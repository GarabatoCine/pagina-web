<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

/* ================= LANGUAGES ================= */

.lang .active{
opacity:0.45;
}

.lang a{
opacity:1;
text-decoration:none;
}

.lang a:hover{
opacity:0.7;
}

/* ================= HAMBURGUESA ================= */

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= VIDEOS ================= */

.video-block{
position:relative;
margin-top:18px;
}

.video-block:first-of-type{
margin-top:0;
}

.video-block video{
width:100%;
display:block;
object-fit:cover;
transform:scale(1.01);
}

/* ================= TITULOS ================= */

.video-title-overlay{
position:absolute;
bottom:20px;
left:20px;
color:#fff;
font-size:28px;
font-weight:500;
z-index:2;
}

.video-title-overlay span{
font-size:14px;
font-weight:300;
opacity:0.95;
margin-left:8px;
}

/* ================= CLICKABLE ================= */

.video-block.clickable{
cursor:pointer;
}

/* ================= FOOTER ================= */

.footer-space{
height:18px;
}

.footer{
background:#000;
color:white;
width:100%;
margin:0;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer a{
color:white;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
font-weight:100;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-bottom-right{
text-align:right;
line-height:1.8;
}

/* ================= TABLET ================= */

@media(max-width:1024px){

body{
padding-top:86px;
}

.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
align-items:flex-start;
border:1px solid #eee;
gap:14px;
}

.nav.active{
display:flex;
}

.menu-toggle{
display:flex;
}

.video-title-overlay{
font-size:22px;
}

.video-title-overlay span{
font-size:12px;
}

}

/* ================= MOBILE ================= */

@media(max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

.video-title-overlay{
font-size:18px;
bottom:14px;
left:14px;
}

.video-title-overlay span{
font-size:11px;
}

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{
text-align:left;
}

.footer-icons{
justify-content:flex-start;
}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{
text-align:left;
}

}

</style>
</head>
