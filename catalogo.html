<!-- CREATO DISPLAY (IMPORTADA) -->
<style>
@font-face {
font-family: 'Creato Display';
src: url('https://fonts.cdnfonts.com/s/19795/CreatoDisplay-Thin.woff') format('woff');
font-weight: 100;
font-style: normal;

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
font-family:'Creato Display', sans-serif; /* 🔥 NUEVA FUENTE */
}

.logo a{
font-size:24px;
letter-spacing:2px;
color:#555;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
color:#999;
text-decoration:none;
}

.lang span{opacity:0.6;}
.lang .active{opacity:1;color:#555;}

.icon{
width:18px;
height:18px;
stroke:#999;
fill:none;
stroke-width:2;
}

/* ================= CONTENIDO ================= */

.video-block{margin-top:100px;}

.video-block video{
width:100%;
object-fit:cover;
transform:scale(1.02);
}

.video-title{
text-align:center;
padding:15px 20px 40px;
}

.video-title .title{
font-size:28px;
font-weight:500;
color:#555;
}

.video-title .subtitle{
font-size:13px;
font-weight:300;
}

.video-block:nth-of-type(2){
margin-bottom:110px;
}

.section-title{
padding:30px 20px 10px;
font-size:26px;
font-weight:500;
color:#555;
}

.block{position:relative;}
.block + .block{margin-top:6px;}

.full-img{
width:100%;
display:block;
}

.overlay{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:18px;
background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
color:#fff;
font-size:18px;
}

/* ================= FOOTER ================= */

.footer-space{height:160px;}

.footer{
background:#434343;
color:white;
padding:70px 160px; /* 🔥 DOBLE MARGEN */
font-family:'Century Gothic', sans-serif;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
text-decoration:underline;
color:white;
font-size:19px; /* +2 */
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px; /* +2 */
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:20px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px; /* 🔥 MÁS GRANDES */
height:24px;
stroke:white;
fill:none;
stroke-width:1.5;
}

/* FACEBOOK */
.fb-circle{stroke:white;fill:none;}
.fb-f{fill:white;stroke:none;}

/* BOTTOM */
.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
text-decoration:underline;
color:white;
margin-bottom:8px;
}

.footer-bottom-right{
text-align:right;
}

/* RESPONSIVE */
@media(max-width:768px){

.footer{padding:50px 40px;}

.footer-row{flex-direction:column;gap:30px;}

.footer-right{text-align:left;}

.footer-icons{justify-content:flex-start;}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{text-align:left;}

}

</style>
</head>
