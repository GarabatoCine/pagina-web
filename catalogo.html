<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
z-index:1000;
border-bottom:1px solid #eee;
}

.logo a{
font-size:22px;
font-weight:700;
letter-spacing:2px;
color:#555;
text-decoration:none;
}

.nav a{
margin-left:20px;
font-size:13px;
color:#999;
text-decoration:none;
}

/* VIDEO */
.video-block{
margin-top:90px;
}

.video-block video{
width:100%;
object-fit:cover;
transform:scale(1.02);
}

.video-title{
text-align:center;
padding:15px 20px 40px;
}

.video-title .title{
font-size:28px;
font-weight:500;
color:#555;
}

.video-title .subtitle{
font-size:13px;
font-weight:300;
margin-top:4px;
}

.video-block:nth-of-type(2){
margin-bottom:110px;
}

/* CORTOS */
.section-title{
padding:30px 20px 10px;
font-size:26px;
font-weight:500;
color:#555;
}

.block{
position:relative;
}

.block + .block{
margin-top:6px;
}

.full-img{
width:100%;
display:block;
}

.overlay{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:18px;
background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
color:#fff;
font-weight:400;
}

/* ========================= */
/* ESPACIO ANTES DEL FOOTER */
/* ========================= */

.footer-space{
height:120px;
background:#fff;
}

/* ========================= */
/* FOOTER GRIS */
/* ========================= */

.footer-top{
background:#555;
color:#fff;
padding:50px 40px;
display:flex;
justify-content:space-between;
font-weight:300;
}

.footer-top a{
color:#fff;
text-decoration:underline;
font-size:14px;
}

/* ========================= */
/* FOOTER BLANCO */
/* ========================= */

.footer-bottom{
background:#fff;
padding:25px 40px;
display:flex;
justify-content:space-between;
align-items:flex-start;
font-size:13px;
}

/* IZQUIERDA */
.footer-left a{
display:block;
margin-bottom:6px;
color:#999;
text-decoration:none;
}

/* DERECHA */
.footer-right{
text-align:right;
}

.footer-right-title{
margin-bottom:8px;
color:#999;
}

/* ICONOS */
.icon{
width:18px;
height:18px;
margin:6px 0;
stroke:#999;
fill:none;
stroke-width:2;
display:block;
margin-left:auto;
}

/* COPYRIGHT */
.footer-copy{
margin-top:10px;
font-size:12px;
color:#999;
}

/* RESPONSIVE */
@media(max-width:768px){

.footer-top,
.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-right{
text-align:left;
}

.icon{
margin-left:0;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">
<a href="https://garabatocine.github.io/pagina-web/">GARABATO CINE</a>
</div>
<div class="nav">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">CONTACTO</a>
</div>
</div>

<!-- VIDEOS -->
<div class="video-block">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
<div class="video-title">
<div class="title">La Frontera</div>
<div class="subtitle">Largometraje</div>
</div>
</div>

<div class="video-block">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
<div class="video-title">
<div class="title">Vida de Colores</div>
<div class="subtitle">Serie</div>
</div>
</div>

<!-- CORTOS -->
<div class="section-title">Cortometrajes</div>

<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/Marimonda-tirita.png">
<div class="overlay">Marimonda</div>
</div>

<div class="block">
<img class="full-img" src="https://raw.githubusercontent.com/GarabatoCine/pagina-web/main/Ano-sabatico.Tirita.png">
<div class="overlay">Año Sabático</div>
</div>

<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/Calaguala-tirita.png">
<div class="overlay">Calaguala</div>
</div>

<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/El-congo-de-oro-tirita.png">
<div class="overlay">El Congo de Oro</div>
</div>

<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/Fracturas-tirita.png">
<div class="overlay">Fracturas</div>
</div>

<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/La-princesita-tirita.png">
<div class="overlay">La Princesita</div>
</div>

<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/La-tortuga-tirita.png">
<div class="overlay">La Tortuga</div>
</div>

<!-- ESPACIO -->
<div class="footer-space"></div>

<!-- FOOTER GRIS -->
<div class="footer-top">
<a href="#top">Contact</a>
</div>

<!-- FOOTER BLANCO -->
<div class="footer-bottom">

<div class="footer-left">
<a href="#">Cookie Policy</a>
<a href="#">Privacy Policy</a>
</div>

<div class="footer-right">

<div class="footer-right-title">Follow us</div>

<!-- Instagram -->
<svg class="icon" viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>

<!-- Facebook -->

</svg>

<!-- YouTube -->

<path d="M22 12s0-4-1-5-5-1-9-1-8 0-9 1-1 5-1 5 0 4 1 5 5 1 9 1 8 0 9-1 1-5 1-5z"></path>
<polygon points="10 15 15 12 10 9 10 15"></polygon>
</svg>

<div class="footer-copy">
© 2026 Garabato Cine. All rights reserved.
</div>

</div>

</div>

</body>
</html>
