<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Sora', sans-serif;
background:#000;
color:white;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:white;
color:black;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
z-index:1000;
text-transform:uppercase;
}

/* LOGO MÁS GRANDE */
.logo{
font-size:24px;
font-weight:800;
letter-spacing:2px;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
color:black;
text-decoration:none;
font-weight:600;
}

/* IDIOMAS */
.lang{
display:flex;
gap:6px;
font-size:12px;
margin-left:10px;
}

.lang span{
opacity:0.6;
}

.lang .active{
opacity:1;
font-weight:700;
}

/* INSTAGRAM ICON */
.icon{
width:18px;
height:18px;
stroke:black;
fill:none;
stroke-width:2;
margin-left:10px;
}

/* SECCIONES */
.section{
width:100%;
background:black;
}

/* 🎬 VIDEOS FULL WIDTH PROPORCIONAL */
.section video{
width:100%;
height:auto;
display:block;
}

/* TITULO VIDEO */
.overlay-title{
position:absolute;
bottom:20px;
left:20px;
font-size:20px;
font-weight:700;
text-transform:uppercase;
background:rgba(0,0,0,0.5);
padding:6px 10px;
}

/* WRAPPER VIDEO */
.video-wrap{
position:relative;
width:100%;
}

/* 📷 IMÁGENES CONTROLADAS */
.image-wrap{
width:100%;
display:flex;
justify-content:center;
padding:35px 0;
background:black;
}

.image-inner{
width:92%;
max-width:1100px;
position:relative;
}

.image-inner img{
width:100%;
height:auto;
display:block;
}

/* TITULO IMAGEN */
.image-title{
position:absolute;
bottom:15px;
left:15px;
font-size:18px;
font-weight:700;
background:rgba(0,0,0,0.5);
padding:6px 10px;
text-transform:uppercase;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">GARABATO CINE</div>

<div class="nav">

<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">CONTACTO</a>

<div class="lang">
<span class="active">ES</span>
<span>|</span>
<span>EN</span>
</div>

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg class="icon" viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

</div>

</div>

<!-- 🎬 LA FRONTERA -->
<div class="section video-wrap">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
<div class="overlay-title">La Frontera — Largometraje</div>
</div>

<!-- 🎬 VIDA DE COLORES -->
<div class="section video-wrap">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
<div class="overlay-title">Vida de Colores</div>
</div>

<!-- 📷 MARIMONDA -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Marimonda.Tira.png">
<div class="image-title">Marimonda — Cortometraje</div>
</div>
</div>

<!-- 📷 AÑO SABÁTICO (CORREGIDO) -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://raw.githubusercontent.com/GarabatoCine/pagina-web/main/Ano-sabatico.Tira.png">
<div class="image-title">Año Sabático — Cortometraje</div>
</div>
</div>

<!-- 📷 EL CONGO DE ORO -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/El%20congo%20de%20oro.Tira.png">
<div class="image-title">El Congo de Oro — Cortometraje</div>
</div>
</div>

<!-- 📷 CALAGUALA -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Calaguala.Tira.png">
<div class="image-title">Calaguala — Cortometraje</div>
</div>
</div>

<!-- 📷 LA PRINCESITA -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/La%20princesita.Tira.png">
<div class="image-title">La Princesita — Cortometraje</div>
</div>
</div>

<!-- 📷 FRACTURAS -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Fracturas.Tira.png">
<div class="image-title">Fracturas — Cortometraje</div>
</div>
</div>

<!-- 📷 LA TORTUGA -->
<div class="image-wrap">
<div class="image-inner">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/La%20tortuga.Tira.png">
<div class="image-title">La Tortuga — Cortometraje</div>
</div>
</div>

</body>
</html>
