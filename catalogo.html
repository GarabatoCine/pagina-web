<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<!-- FUENTES -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
color:#555;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
color:#999;
text-decoration:none;
font-weight:500;
}

.lang span{
opacity:0.6;
}

.lang .active{
opacity:1;
color:#555;
}

/* ICON */
.icon{
width:18px;
height:18px;
stroke:#999;
fill:none;
stroke-width:2;
}

/* ================= CONTENIDO ================= */

.video-block{
margin-top:100px;
}

.video-block video{
width:100%;
object-fit:cover;
transform:scale(1.02);
}

.video-title{
text-align:center;
padding:15px 20px 40px;
}

.video-title .title{
font-size:28px;
font-weight:500;
color:#555;
}

.video-title .subtitle{
font-size:13px;
font-weight:300;
}

.video-block:nth-of-type(2){
margin-bottom:110px;
}

.section-title{
padding:30px 20px 10px;
font-size:26px;
font-weight:500;
color:#555;
}

.block{
position:relative;
}

.block + .block{
margin-top:6px;
}

.full-img{
width:100%;
display:block;
}

.overlay{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:18px;
background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
color:#fff;
font-size:18px;
}

/* ================= FOOTER ================= */

.footer-space{
height:140px;
}

.footer{
background:#434343;
color:white;
padding:60px 40px;
font-weight:300;
font-size:14px;
}

.footer-line{
width:100%;
height:1px;
background:rgba(255,255,255,0.4);
margin:40px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

/* CONTACT */
.footer-left a{
font-family:'Montserrat', sans-serif;
font-size:16px;
letter-spacing:0.5px;
text-decoration:underline;
color:white;
}

/* FOLLOW */
.footer-follow{
font-family:'Montserrat', sans-serif;
font-size:16px;
letter-spacing:0.5px;
margin-bottom:15px;
}

/* ICONOS */
.footer-icons{
display:flex;
gap:15px;
}

.footer-icons svg{
width:20px;
height:20px;
stroke:white;
fill:none;
stroke-width:1.5;
}

/* BOTTOM */
.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.footer-bottom-left a{
display:block;
text-decoration:underline;
color:white;
margin-bottom:6px;
}

.footer-bottom-right{
text-align:right;
}

/* RESPONSIVE */
@media(max-width:768px){
.footer-row{
flex-direction:column;
gap:30px;
}

.footer-bottom{
flex-direction:column;
gap:15px;
}

.footer-bottom-right{
text-align:left;
}
}

</style>
</head>
