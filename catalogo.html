<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
color:#555;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
color:#999;
text-decoration:none;
font-weight:500;
}

.lang span{opacity:0.6;}
.lang .active{opacity:1;color:#555;}

.lang a{
opacity:0.6;
text-decoration:none;
color:#999;
}

.lang a:hover{
opacity:1;
color:#555;
}

/* ================= VIDEO BLOCKS ================= */

.video-block{
position:relative;
margin-top:18px; /* espacio entre bloques */
}

.video-block video{
width:100%;
display:block;
object-fit:cover;
transform:scale(1.01);
}

/* ================= TITULO SOBRE VIDEO ================= */

.video-title-overlay{
position:absolute;
bottom:20px;
left:20px;
color:#fff;
font-size:28px;
font-weight:500;
z-index:2;
}

.video-title-overlay span{
font-size:14px;
font-weight:300;
opacity:0.95;
margin-left:8px;
}

/* ================= CLICKABLE ================= */

.video-block.clickable{
cursor:pointer;
}

/* ================= FOOTER ================= */

.footer-space{
height:160px;
}

.footer{
background:#434343;
color:white;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
text-decoration:underline;
color:white;
font-size:19px;
font-weight:100;
}

.footer-right{text-align:right;}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:20px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
text-decoration:underline;
color:white;
margin-bottom:8px;
}

.footer-bottom-right{text-align:right;}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{text-align:left;}

.footer-icons{justify-content:flex-start;}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{text-align:left;}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">
<a href="https://garabatocine.github.io/pagina-web/">GARABATO CINE</a>
</div>

<div class="nav">

<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>

<div class="lang">
<span class="active">ES</span>
<span>|</span>
<a href="#">EN</a>
</div>

</div>
</div>

<!-- ================= LA FRONTERA ================= -->
<div class="video-block">

<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>

<div class="video-title-overlay">
La Frontera <span>(Largometraje)</span>
</div>

</div>

<!-- ================= VIDA DE COLORES ================= -->
<div class="video-block">

<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>

<div class="video-title-overlay">
Vida de Colores <span>(Serie)</span>
</div>

</div>

<!-- ================= CORTOMETRAJES ================= -->
<div class="video-block clickable" onclick="window.location.href='cortometrajes.html'">

<video autoplay muted loop playsinline>
<source src="https://raw.githubusercontent.com/GarabatoCine/pagina-web/main/Banner-cortometrajes.mp4">
</video>

<div class="video-title-overlay">
Cortometrajes
</div>

</div>

<div class="footer-space"></div>

<!-- FOOTER -->
<footer class="footer">

<div class="footer-line"></div>

<div class="footer-row">

<div class="footer-left">
<a href="#top">Contact</a>
</div>

<div class="footer-right">

<div class="footer-follow">Follow us</div>

<div class="footer-icons">

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

<a href="https://web.facebook.com/garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M13 17v-4h2l.3-2H13V9.8c0-.6.2-1 1-1h1.3V7.1C14.8 7 14 7 13.2 7 11.6 7 10.5 8 10.5 10v1H9v2h1.5v4H13z" fill="white"/>
</svg>
</a>

</div>

</div>

</div>

<div class="footer-line"></div>

<div class="footer-bottom">

<div class="footer-bottom-left">
<a href="#">Cookie Policy</a>
<a href="#">Privacy Policy</a>
</div>

<div class="footer-bottom-right">
© 2026 Garabato Cine. All rights reserved.
</div>

</div>

</footer>

<script>

window.scrollTo(0, 0);
};

window.scrollTo(0, 0);
};
</script>

</body>
</html>
