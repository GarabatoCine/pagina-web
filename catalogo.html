<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Sora', sans-serif;
background:#000;
color:white;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:white;
color:black;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
text-transform:uppercase;
font-size:14px;
font-weight:600;
}

.header a{
color:black;
text-decoration:none;
margin:0 12px;
}

/* CONTENEDOR GENERAL */
.section{
width:100%;
position:relative;
}

/* 🔥 TIRAS DE VIDEO (CLAVE DEL CAMBIO) */
.video-section{
width:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
padding:60px 0; /* aire arriba y abajo */
}

.video-wrapper{
width:100%;
max-width:1200px; /* controla el tamaño tipo “tira” */
aspect-ratio: 16 / 9; /* mantiene proporción real */
position:relative;
}

.video-wrapper video{
width:100%;
height:100%;
object-fit:contain; /* 🔥 NO DEFORMA */
background:black;
}

/* TITULO */
.overlay-title{
position:absolute;
bottom:15px;
left:20px;
font-size:20px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1px;
background:rgba(0,0,0,0.5);
padding:6px 10px;
}

/* IMAGENES (ya en formato tira) */
.image-section{
width:100%;
display:flex;
justify-content:center;
padding:40px 0;
background:black;
}

.image-wrapper{
width:100%;
max-width:1200px;
position:relative;
}

.image-wrapper img{
width:100%;
height:auto;
display:block;
}

/* TITULO IMAGEN */
.image-title{
position:absolute;
bottom:15px;
left:15px;
font-size:18px;
font-weight:700;
background:rgba(0,0,0,0.5);
padding:6px 10px;
text-transform:uppercase;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div>GARABATO CINE</div>

<div>
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">CONTACTO</a>
</div>
</div>

<!-- 🎬 VIDEO 1 -->
<div class="section video-section">
<div class="video-wrapper">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
</video>
<div class="overlay-title">La Frontera — Largometraje</div>
</div>
</div>

<!-- 🎬 VIDEO 2 -->
<div class="section video-section">
<div class="video-wrapper">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4" type="video/mp4">
</video>
<div class="overlay-title">Vida de Colores</div>
</div>
</div>

<!-- 📷 MARIMONDA -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Marimonda.Tira.png">
<div class="image-title">Marimonda — Cortometraje</div>
</div>
</div>

<!-- 📷 AÑOS SABÁTICOS -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Anos-sabaticos.Tira.png">
<div class="image-title">Años Sabáticos — Cortometraje</div>
</div>
</div>

<!-- 📷 EL CONGO DE ORO -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/El%20congo%20de%20oro.Tira.png">
<div class="image-title">El Congo de Oro — Cortometraje</div>
</div>
</div>

<!-- 📷 CALAGUALA -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Calaguala.Tira.png">
<div class="image-title">Calaguala — Cortometraje</div>
</div>
</div>

<!-- 📷 LA PRINCESITA -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/La%20princesita.Tira.png">
<div class="image-title">La Princesita — Cortometraje</div>
</div>
</div>

<!-- 📷 FRACTURAS -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Fracturas.Tira.png">
<div class="image-title">Fracturas — Cortometraje</div>
</div>
</div>

<!-- 📷 LA TORTUGA -->
<div class="section image-section">
<div class="image-wrapper">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/La%20tortuga.Tira.png">
<div class="image-title">La Tortuga — Cortometraje</div>
</div>
</div>

</body>
</html>
