<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#000;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
z-index:1000;
text-transform:uppercase;
border-bottom:1px solid #eee;
}

.logo{
font-size:24px;
font-weight:900;
letter-spacing:2px;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
color:#000;
text-decoration:none;
font-weight:600;
}

.lang{
display:flex;
gap:6px;
font-size:12px;
margin-left:10px;
}

.lang span{opacity:0.5;}
.lang .active{opacity:1;font-weight:700;}

.icon{
width:18px;
height:18px;
stroke:#000;
fill:none;
stroke-width:2;
margin-left:10px;
}

/* BLOQUES */
.block{
width:100%;
margin-top:90px;
}

/* 🔥 IMÁGENES FULL WIDTH SIN DEFORMAR */
.full-img{
width:100%;
display:block;
height:auto;
}

/* TEXTO */
.text{
width:100%;
padding:15px 20px 40px 20px;
}

.title{
font-size:28px;
font-weight:900;
}

.subtitle{
font-size:13px;
font-weight:300;
opacity:0.7;
text-transform:uppercase;
letter-spacing:1px;
margin-top:4px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">GARABATO CINE</div>

<div class="nav">

<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">CONTACTO</a>

<div class="lang">
<span class="active">ES</span>
<span>|</span>
<span>EN</span>
</div>

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg class="icon" viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

</div>
</div>

<!-- 🎬 MARIMONDA -->
<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/Marimonda-tirita.png">
<div class="text">
<div class="title">Marimonda</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

<!-- 🎬 AÑO SABÁTICO -->
<div class="block">
<img class="full-img" src="https://raw.githubusercontent.com/GarabatoCine/pagina-web/main/Ano-sabatico.Tirita.png">
<div class="text">
<div class="title">Año Sabático</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

<!-- 🎬 CALAGUALA -->
<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/Calaguala-tirita.png">
<div class="text">
<div class="title">Calaguala</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

<!-- 🎬 EL CONGO DE ORO -->
<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/El-congo-de-oro-tirita.png">
<div class="text">
<div class="title">El Congo de Oro</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

<!-- 🎬 FRACTURAS -->
<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/Fracturas-tirita.png">
<div class="text">
<div class="title">Fracturas</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

<!-- 🎬 LA PRINCESITA -->
<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/La-princesita-tirita.png">
<div class="text">
<div class="title">La Princesita</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

<!-- 🎬 LA TORTUGA -->
<div class="block">
<img class="full-img" src="https://github.com/GarabatoCine/pagina-web/raw/main/La-tortuga-tirita.png">
<div class="text">
<div class="title">La Tortuga</div>
<div class="subtitle">Cortometraje</div>
</div>
</div>

</body>
</html>
