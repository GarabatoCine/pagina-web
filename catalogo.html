<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Sora', sans-serif;
background:#000;
color:white;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:white;
color:black;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
text-transform:uppercase;
font-size:14px;
font-weight:600;
}

.header a{
color:black;
text-decoration:none;
margin:0 12px;
}

/* SECCIONES */
.section{
width:100%;
background:black;
}

/* 🎬 VIDEO FULL WIDTH PROPORCIONAL */
.video-section video{
width:100%;
height:auto;        /* 🔥 CLAVE: mantiene proporción */
display:block;      /* elimina espacios */
}

/* TITULO VIDEO */
.overlay-title{
position:absolute;
bottom:20px;
left:20px;
font-size:22px;
font-weight:700;
text-transform:uppercase;
background:rgba(0,0,0,0.5);
padding:6px 10px;
}

/* CONTENEDOR VIDEO */
.video-wrap{
position:relative;
width:100%;
}

/* 📷 IMÁGENES FULL WIDTH PROPORCIONAL */
.image-section img{
width:100%;
height:auto;        /* 🔥 mantiene proporción real */
display:block;
}

/* TITULO IMAGEN */
.image-title{
position:absolute;
bottom:15px;
left:15px;
font-size:18px;
font-weight:700;
background:rgba(0,0,0,0.5);
padding:6px 10px;
text-transform:uppercase;
}

.image-wrap{
position:relative;
width:100%;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div>GARABATO CINE</div>

<div>
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">CONTACTO</a>
</div>
</div>

<!-- 🎬 VIDEO 1 -->
<div class="section">
<div class="video-wrap">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
<div class="overlay-title">La Frontera — Largometraje</div>
</div>
</div>

<!-- 🎬 VIDEO 2 -->
<div class="section">
<div class="video-wrap">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
<div class="overlay-title">Vida de Colores</div>
</div>
</div>

<!-- 📷 MARIMONDA -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Marimonda.Tira.png">
<div class="image-title">Marimonda — Cortometraje</div>
</div>

<!-- 📷 AÑOS SABÁTICOS -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Anos-sabaticos.Tira.png">
<div class="image-title">Años Sabáticos — Cortometraje</div>
</div>

<!-- 📷 EL CONGO DE ORO -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/El%20congo%20de%20oro.Tira.png">
<div class="image-title">El Congo de Oro — Cortometraje</div>
</div>

<!-- 📷 CALAGUALA -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Calaguala.Tira.png">
<div class="image-title">Calaguala — Cortometraje</div>
</div>

<!-- 📷 LA PRINCESITA -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/La%20princesita.Tira.png">
<div class="image-title">La Princesita — Cortometraje</div>
</div>

<!-- 📷 FRACTURAS -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/Fracturas.Tira.png">
<div class="image-title">Fracturas — Cortometraje</div>
</div>

<!-- 📷 LA TORTUGA -->
<div class="section image-wrap">
<img src="https://github.com/GarabatoCine/pagina-web/raw/main/La%20tortuga.Tira.png">
<div class="image-title">La Tortuga — Cortometraje</div>
</div>

</body>
</html>
