<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosotros - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* LANG SWITCH */
.lang .active{opacity:0.45;}
.lang a{text-decoration:none;}
.lang a:hover{opacity:0.7;}

/* ================= CONTENIDO ================= */

.page-content{width:100%;}

.intro-text{
max-width:1100px;
margin:70px auto 50px;
padding:0 40px;
text-align:center;
font-family:'Playfair Display', serif;
font-size:20px;
line-height:1.6;
color:#666;
}

/* ================= FESTIVALES ================= */

.festivals{
max-width:1400px;
margin:70px auto 20px;
padding:0 40px;
}

.festival-row{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:40px;
align-items:center;
margin-bottom:55px;
}

.festival-row img{
width:100%;
max-height:60px;
object-fit:contain;
display:block;
margin:auto;
}

/* ================= PERSONAS ================= */

.people{
max-width:1100px;
margin:80px auto;
padding:0 40px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:60px;
}

.person{text-align:center;}

.person img{
width:100%;
max-width:420px;
height:420px;
object-fit:cover;
margin:0 auto 20px;
display:block;
}

/* ================= GALLERY ================= */

.gallery{
max-width:1400px;
margin:60px auto;
padding:0 40px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.gallery-col{
display:flex;
flex-direction:column;
gap:20px;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
padding:70px 160px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

body{padding-top:82px;}

.header{padding:16px 22px;}

/* HAMBURGUESA CORRECTA */
.menu-toggle{
display:flex;
flex-direction:column;
gap:4px;
cursor:pointer;
}

/* MENÚ OCULTO POR DEFECTO */
.nav{
display:none;
flex-direction:column;
position:absolute;
top:74px;
right:0;
background:#fff;
width:100%;
padding:20px;
border-top:1px solid #eee;
}

/* MENÚ ACTIVO */
.nav.active{
display:flex;
}

/* RESTO SIN CAMBIOS */
.intro-text{font-size:18px;padding:0 25px;}

.festivals{padding:0 20px;}

.festival-row{grid-template-columns:repeat(3,1fr);gap:25px;}

.people{grid-template-columns:1fr;}

.footer{padding:50px 40px;}
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="menu-toggle" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>

<div class="nav" id="mobileMenu">
<a href="catalogo.html">CATÁLOGO</a>
<a href="contacto.html">CONTACTO</a>

<div class="lang">
<span class="active">ES</span>
<span>|</span>
<a href="#">EN</a>
</div>
</div>

</div>

<!-- TODO LO DEMÁS QUEDA IGUAL -->

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>
