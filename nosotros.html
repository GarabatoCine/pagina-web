<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente - Garabato Cine</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            color: white;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: white;
        }

        /* HEADER */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            transition: all 0.3s ease;
        }

        .nav {
            display: flex;
            gap: 40px;
            align-items: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .nav a {
            color: white;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #FFC601; /* Actualizado a #FFC601 */
        }

        .lang {
            display: flex;
            gap: 8px;
        }

        .lang .active {
            opacity: .5;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 110;
        }

        /* BANNER */
        .banner-container {
            width: 100%;
            position: relative;
            background: #000;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: brightness(0.65);
        }

        .banner-text-overlay {
            position: absolute;
            bottom: 15px; /* Casi pegado al margen inferior del banner */
            left: 60px;
            z-index: 10;
            max-width: 700px;
        }

        .banner-text-overlay h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(32px, 5vw, 64px); 
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 2px;
            margin-bottom: 10px; /* Reducido para acortar la distancia entre título y subtexto */
            color: #FFF;
            text-transform: uppercase;
        }

        .subrayado-amarillo {
            border-bottom: 4px solid #FFC601; /* Actualizado a #FFC601 */
            padding-bottom: 12px;
            display: inline-block;
            line-height: 0.9;
        }

        .banner-text-overlay p {
            font-size: clamp(14px, 1.5vw, 18px);
            line-height: 1.35; 
            font-weight: 300;
            color: #CCCCCC;
            letter-spacing: 0.5px;
        }

        /* CUERPO DE LA PÁGINA */
        .web-container {
            width: 100%;
        }

        .seccion-proyecto {
            max-width: 1300px;
            margin: 100px auto;
            padding: 0 60px;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            letter-spacing: 3px;
            color: #FFC601; /* Actualizado a #FFC601 */
            border-bottom: 1px solid rgba(255, 198, 1, 0.4); /* Actualizado a #FFC601 con opacidad */
            display: inline-block;
            padding-bottom: 8px;
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .fila-dos-columnas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .featured-project {
            grid-template-columns: 1.1fr 0.9fr;
            gap: 50px;
            align-items: start;
        }

        .main-poster img {
            width: 100%;
            display: block;
        }

        .gallery-thumbs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .gallery-thumbs img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .project-details {
            min-width: 0;
        }

        .project-details .status-tag {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            color: #FFC601; /* Actualizado a #FFC601 */
            margin-bottom: 15px;
        }

        .project-details h2 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(30px, 5vw, 75px);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 12px;
        }

        .project-details .subtitle-yellow {
            color: #FFC601; /* Actualizado a #FFC601 */
            font-size: 17px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .project-details .synopsis {
            font-size: clamp(14px, 1.5vw, 17px);
            line-height: 1.7;
            color: #DCDCDC;
            margin-bottom: 45px;
        }

        .meta-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 50px;
            border-top: 1px solid #222;
            padding-top: 30px;
        }

        .meta-col {
            border-left: 1px solid rgba(255, 198, 1, 0.3); /* Actualizado a #FFC601 con opacidad */
            padding-left: 20px;
            min-width: 0;
        }

        .meta-col:first-child {
            border-left: none;
            padding-left: 0;
            display: flex;
            gap: 15px;
        }

        .meta-label {
            color: #FFC601; /* Actualizado a #FFC601 */
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .meta-col p {
            font-size: 13px;
            color: #E0E0E0;
            line-height: 1.5;
        }

        .star-icon {
            color: #FFC601; /* Actualizado a #FFC601 */
            font-size: 26px;
            margin-top: 2px;
        }

        .logo-telepacific {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-teaser {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 40px;
            border: 1px solid #FFF;
            color: #FFF;
            font-size: 13px;
            letter-spacing: 2px;
            transition: 0.3s;
            text-transform: uppercase;
            width: 100%;
        }

        .btn-teaser i {
            margin-right: 10px;
            font-size: 10px;
        }

        .btn-teaser:hover {
            background: #FFF;
            color: #000;
        }

        .card {
            min-width: 0;
        }

        .card img {
            width: 100%;
            height: 440px;
            object-fit: cover;
            display: block;
        }

        .card h3 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(24px, 4vw, 40px);
            font-weight: 500;
            margin-top: 25px;
            text-transform: uppercase;
        }

        .card .card-subtitle {
            color: #FFC601; /* Actualizado a #FFC601 */
            font-size: 14px;
            letter-spacing: 2px;
            margin: 10px 0 20px;
            text-transform: uppercase;
        }

        .card p.desc {
            font-size: clamp(14px, 1.5vw, 17px);
            line-height: 1.7;
            color: #CCCCCC;
        }

        .festival-laurels {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            color: #E0E0E0;
            font-size: 13px;
            line-height: 1.6;
        }

        .laurel-svg {
            fill: #FFC601; /* Actualizado a #FFC601 */
            flex-shrink: 0;
        }

        .dev-box {
            display: flex;
            gap: 25px;
            border: 1px solid #222;
            padding: 35px;
            background: #0F0F0F;
        }

        .dev-circle-icon {
            width: 70px;
            height: 70px;
            border: 1px solid #FFC601; /* Actualizado a #FFC601 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #FFC601; /* Actualizado a #FFC601 */
            flex-shrink: 0;
        }

        .dev-inner-content {
            flex-grow: 1;
            min-width: 0;
        }

        .dev-inner-content h3 {
            margin-top: 0;
            font-size: clamp(22px, 3.5vw, 36px);
        }

        .technical-sheet {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
            border-top: 1px solid #222;
            padding-top: 20px;
            font-size: 13px;
        }

        .technical-sheet div strong {
            color: #FFC601; /* Actualizado a #FFC601 */
            display: block;
            margin-bottom: 5px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-banner {
            border-top: 1px solid #222;
            padding: 80px 0;
            text-align: center;
        }

        .cta-banner p {
            font-size: 22px;
            margin-bottom: 30px;
            font-weight: 300;
        }
