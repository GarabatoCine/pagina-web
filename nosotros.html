<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosotros - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

/* ================= HAMBURGUESA ================= */

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
z-index:1200; /* 👈 FIX VISIBILIDAD */
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= CONTENIDO ================= */

.page-content{
width:100%;
}

.intro-text{
max-width:1100px;
margin:70px auto 50px auto;
padding:0 40px;
text-align:center;
font-family:'Playfair Display', serif;
font-size:20px;
line-height:1.6;
color:#777;
font-weight:400;
}

/* ================= BANNER ================= */

.banner{
max-width:1400px;
margin:0 auto;
padding:0 40px;
}

.banner img{
width:100%;
height:auto;
display:block;
}

/* ================= PERSONAS ================= */

.people{
max-width:1200px;
margin:80px auto 40px auto;
padding:0 40px;
display:flex;
gap:60px;
justify-content:center;
align-items:flex-start;
}

.person{
flex:1;
text-align:center;
}

.person img{
width:100%;
height:420px;              /* 👈 MISMA ALTURA */
object-fit:cover;
object-position:center;
display:block;
box-shadow:none !important; /* 👈 QUITA SOMBRA */
border:none;
}

.person-title{
font-family:'Playfair Display', serif;
font-size:20px;
margin-top:18px;
color:#555;
font-weight:500;
}

.person-text{
font-family:'Playfair Display', serif;
font-size:15px;
line-height:1.6;
color:#777;
text-align:justify;
margin-top:10px;
}

/* ================= FOOTER ================= */

.footer-space{
height:18px;
}

.footer{
background:#000;
color:white;
width:100%;
margin:0;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer a{
color:white;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
text-decoration:underline;
}

.footer-right{
text-align:right;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

/* ================= TABLET ================= */

@media(max-width:1024px){

.menu-toggle{
display:flex !important; /* 👈 FIX HAMBURGUESA */
}

.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
border:1px solid #eee;
}

.nav.active{
display:flex;
}

.people{
flex-direction:column;
align-items:center;
}

.person img{
height:360px; /* 👈 evita recorte feo en tablet */
}

}

/* ================= MOBILE ================= */

@media(max-width:768px){

.header{
padding:16px 22px;
}

.intro-text{
font-size:18px;
padding:0 25px;
}

.people{
padding:0 20px;
gap:40px;
}

.person img{
height:320px;
}

.footer{
padding:50px 40px;
}

}

</style>
</head>

<body id="top">

<!-- HEADER -->
<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="menu-toggle" onclick="toggleMenu()">
<span></span>
<span></span>
<span></span>
</div>

<div class="nav" id="mobileMenu">
<a href="catalogo.html">CATÁLOGO</a>
<a href="contacto.html">CONTACTO</a>
<div class="lang">
<span class="active">ES</span>
<span>|</span>
<a href="#">EN</a>
</div>
</div>

</div>

<!-- CONTENIDO -->
<div class="page-content">

<div class="intro-text">
Hacemos cine desde el Caribe Colombiano, donde el drama, la ficción y el surrealismo se cruzan para crear relatos profundamente humanos.
</div>

<div class="banner">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/nosotros/banner-afiche.jpg?raw=true">
</div>

<!-- PERSONAS -->
<div class="people">

<div class="person">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/nosotros/david.jpg?raw=true">
<div class="person-title">DAVID DAVID</div>
<div class="person-text">
Guionista, director y productor barranquillero...
</div>
</div>

<div class="person">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/nosotros/caro.jpg?raw=true">
<div class="person-title">CAROLINA DAVID</div>
<div class="person-text">
Productora ejecutiva de Garabato Cine...
</div>
</div>

</div>

</div>

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}

window.onbeforeunload = function(){
window.scrollTo(0,0);
};
</script>

</body>
</html>
