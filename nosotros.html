<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosotros - Garabato Cine</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
padding-top:74px;
}

/* ================= HEADER ================= */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* LANG SWITCH */
.lang .active{
opacity:0.45;
}

.lang a{
opacity:1;
text-decoration:none;
}

.lang a:hover{
opacity:0.7;
}

/* ================= CONTENIDO ================= */
.page-content{
width:100%;
}

.intro-text{
max-width:1100px;
margin:70px auto 50px auto;
padding:0 40px;
text-align:center;
font-family:'Playfair Display', serif;
font-size:20px;
line-height:1.6;
color:#666;
font-weight:400;
}

.banner{
max-width:1400px;
margin:0 auto;
padding:0 40px;
}

.banner img{
width:100%;
height:auto;
display:block;
}

/* ================= FESTIVALES ================= */
.festivals{
max-width:1400px;
margin:70px auto 20px auto;
padding:0 40px;
}

.festival-row{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:40px;
align-items:center;
margin-bottom:55px;
}

.festival-row img{
width:100%;
max-height:60px;
object-fit:contain;
display:block;
margin:auto;
}

/* ================= PERSONAS ================= */
.people{
max-width:1100px;
margin:80px auto;
padding:0 40px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:60px;
}

.person{
text-align:center;
}

.person img{
width:100%;
max-width:420px;
height:420px;
object-fit:cover;
margin:0 auto 20px;
display:block;
}

.person h3{
font-family:'Playfair Display', serif;
font-size:20px;
margin-bottom:10px;
color:#111;
}

.person p{
font-family:'Playfair Display', serif;
font-size:16px;
line-height:1.6;
text-align:justify;
max-width:420px;
margin:0 auto;
color:#666;
}

/* ================= GALLERY ================= */
.gallery{
max-width:1400px;
margin:60px auto;
padding:0 40px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.gallery-col{
display:flex;
flex-direction:column;
gap:20px;
}

.gallery img{
width:100%;
height:auto;
display:block;
object-fit:contain;
}

/* ================= FOOTER ================= */
.footer-space{
height:18px;
}

.footer{
background:#000;
color:white;
width:100%;
margin:0;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer a{
color:white;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
font-weight:100;
text-decoration:underline;
text-underline-offset:2px;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:#fff;
fill:none;
stroke-width:1.5;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
text-decoration:underline;
text-underline-offset:2px;
}

.footer-bottom-right{
text-align:right;
line-height:1.8;
}

/* ================= MOBILE ================= */
@media(max-width:768px){

body{padding-top:82px;}

.header{padding:16px 22px;}

.intro-text{
font-size:18px;
padding:0 25px;
}

.banner{padding:0 20px;}

.festivals{
padding:0 20px;
}

.festival-row{
grid-template-columns:repeat(3,1fr);
gap:25px;
}

/* ✅ ÚNICO CAMBIO REAL: GALERÍA A 2 COLUMNAS EN MÓVIL */
.gallery{
grid-template-columns:repeat(2,1fr);
}

.people{
grid-template-columns:1fr;
}

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{text-align:left;}

.footer-icons{justify-content:flex-start;}

.footer-bottom{
flex-direction:column;
gap:20px;
}
}
</style>
</head>

<body>

<div class="header">
<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="menu-toggle" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>

<div class="nav" id="mobileMenu">
<a href="catalogo.html">CATÁLOGO</a>
<a href="contacto.html">CONTACTO</a>

<div class="lang">
<span class="active">ES</span>
<span>|</span>
<a href="#">EN</a>
</div>
</div>
</div>

<div class="page-content">

<div class="intro-text">
Hacemos cine desde el Caribe Colombiano, donde el drama, la ficción y el surrealismo se cruzan para crear relatos profundamente humanos, con identidad propia y vocación internacional.
</div>

<div class="banner">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/nosotros/banner-afiche.jpg?raw=true">
</div>

<!-- (resto del contenido intacto) -->

</div>

<div class="footer-space"></div>

<footer class="footer">
<!-- footer intacto -->
</footer>

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>
