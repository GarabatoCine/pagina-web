<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosotros - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

/* ================= HAMBURGUESA ================= */

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= CONTENIDO ================= */

.page-content{
width:100%;
}

.intro-text{
max-width:1100px;
margin:70px auto 50px auto;
padding:0 40px;
text-align:center;
font-family:'Playfair Display', serif;
font-size:20px;
line-height:1.6;
color:#666;
}

.banner{
max-width:1400px;
margin:0 auto;
padding:0 40px;
}

.banner img{
width:100%;
display:block;
}

/* ================= FESTIVALES ================= */

.festivals{
max-width:1400px;
margin:70px auto 20px auto;
padding:0 40px;
}

.festival-row{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:40px;
align-items:center;
margin-bottom:55px;
}

.festival-row img{
width:100%;
max-height:60px;
object-fit:contain;
display:block;
margin:auto;
}

/* ================= PERSONAS ================= */

.people{
max-width:1100px;
margin:80px auto;
padding:0 40px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:60px;
}

.person{
text-align:center;
}

.person img{
width:100%;
max-width:420px;
height:420px;
object-fit:cover;
margin:0 auto 20px;
display:block;
}

.person h3{
font-family:'Playfair Display', serif;
font-size:20px;
margin-bottom:10px;
color:#111;
}

.person p{
font-family:'Playfair Display', serif;
font-size:16px;
line-height:1.6;
text-align:justify;
max-width:420px;
margin:0 auto;
color:#666;
}

/* ================= GALLERY ================= */

.gallery{
max-width:1400px;
margin:60px auto;
padding:0 40px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.gallery-col{
display:flex;
flex-direction:column;
gap:20px;
}

.gallery img{
width:100%;
height:auto;
display:block;
object-fit:contain;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:#fff;
padding:70px 160px;
}

.footer a{
color:#fff;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

/* 👇 IMPORTANT: GALERÍA CORRECTA EN MÓVIL */
.gallery{
grid-template-columns:1fr;
}

/* 👇 PERSONAS EN COLUMNA (uno debajo del otro) */
.people{
grid-template-columns:1fr;
}

/* 👇 FESTIVALES MEJORADOS */
.festival-row{
grid-template-columns:repeat(3,1fr);
gap:20px;
}

/* 👇 FOOTER MOBILE */
.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-bottom{
flex-direction:column;
gap:20px;
}

/* ================= HAMBURGUESA CORRECTA ================= */

.menu-toggle{
display:flex;
}

.nav{
display:none;
position:absolute;
top:74px;
right:0;
width:100%;
background:#fff;
flex-direction:column;
padding:20px;
border-top:1px solid #eee;
}

.nav.active{
display:flex;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="menu-toggle" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>

<div class="nav" id="mobileMenu">

<a href="catalogo.html">CATÁLOGO</a>
<a href="contacto.html">CONTACTO</a>

</div>
</div>

<!-- CONTENIDO -->
<div class="page-content">

<div class="intro-text">
Hacemos cine desde el Caribe Colombiano...
</div>

<div class="banner">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/nosotros/banner-afiche.jpg?raw=true">
</div>

<!-- FESTIVALES -->
<div class="festivals">
<div class="festival-row">
<!-- logos -->
</div>
</div>

<!-- PERSONAS -->
<div class="people">

<div class="person">
<img src="...">
<h3>DAVID DAVID</h3>
<p>Texto...</p>
</div>

<div class="person">
<img src="...">
<h3>CAROLINA DAVID</h3>
<p>Texto...</p>
</div>

</div>

<!-- GALERÍA -->
<div class="gallery">
<div class="gallery-col"></div>
<div class="gallery-col"></div>
<div class="gallery-col"></div>
</div>

</div>

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>
