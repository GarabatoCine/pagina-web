<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Garabato Cine</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            color: white;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: white;
        }

        /* HEADER */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            transition: all 0.3s ease;
        }

        .brand-logo a:hover {
            color: #FFC601;
        }

        .nav {
            display: flex;
            gap: 40px;
            align-items: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .nav a {
            color: white;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #FFC601;
        }

        .lang {
            display: flex;
            gap: 8px;
        }

        .lang .active {
            opacity: .5;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 110;
        }

        /* CONTENIDO DE CONTACTO */
        .main-content {
            flex: 1;
            max-width: 700px;
            margin: 180px auto 100px;
            padding: 0 40px;
            color: #DCDCDC;
            line-height: 1.8;
        }

        .main-content h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(32px, 4vw, 44px);
            color: #FFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border-bottom: 2px solid #FFC601;
            padding-bottom: 15px;
            display: inline-block;
            line-height: 1.2;
        }

        .main-content p {
            margin-bottom: 25px;
            font-size: 16px;
            font-weight: 300;
        }

        .contacto-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .contacto-form label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #FFF;
        }

        .contacto-form input, 
        .contacto-form textarea {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: #FFF;
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            border-radius: 4px;
        }

        .contacto-form input:focus, 
        .contacto-form textarea:focus {
            border-color: #FFC601;
            outline: none;
        }

        .contacto-form button {
            background: #FFC601;
            color: #0A0A0A;
            padding: 15px;
            border: none;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            border-radius: 4px;
        }

        .contacto-form button:hover {
            background: #e6b300;
        }

        /* FOOTER BASE */
        .sitio-footer {
            background-color: #000000;
            padding: 40px 60px;
            border-top: 1px solid #1a1a1a;
            width: 100%;
            margin-top: auto;
        }

        .fila-tres-columnas {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .columna-izquierda {
            text-align: left;
            flex: 1;
        }

        .columna-izquierda h4 {
            font-family: 'Oswald', sans-serif;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .columna-izquierda p {
            font-size: clamp(10px, 1.2vw, 13px);
            color: #888888;
            white-space: nowrap;
        }

        .columna-central {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex: 1;
        }

        .columna-central a {
            color: #ffffff;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .columna-central a:hover {
            color: #FFC601;
        }

        .columna-derecha {
            text-align: right;
            flex: 1;
        }

        .columna-derecha p {
            font-size: 13px;
            color: #888888;
            line-height: 1.6;
        }

        .texto-chico {
            font-size: 11.5px !important;
            color: #888888;
        }
        
        .footer-link-normal {
            display: inline-block;
            font-size: 13px;
            color: inherit; 
            text-decoration: underline;
            transition: color 0.3s ease;
        }

        .footer-link-normal:hover {
            color: #FFC601;
        }

        /* RESPONSIVE DISPOSITIVOS (TABLETS) */
        @media(max-width: 1024px) {
            .header { 
                padding: 20px 40px; 
            }

            .brand-logo {
                font-size: 18px; 
            }
            
            .menu-toggle { 
                display: block; 
            }

            .nav {
                display: none; 
                flex-direction: column;
                position: absolute;
                top: 70px; 
                right: 40px;
                background: rgba(10, 10, 10, 0.98);
                border: 1px solid #222;
                padding: 30px;
                gap: 25px;
                align-items: flex-start;
                width: 220px;
                box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
                z-index: 200;
            }

            .nav.open { 
                display: flex; 
            }

            .main-content {
                margin: 140px auto 60px;
                padding: 0 20px;
            }
        }

        /* RESPONSIVE EXCLUSIVO PARA MÓVILES Y TABLETS */
        @media(max-width: 767px) {
            .header { 
                padding: 15px 25px; 
            }

            .brand-logo {
                font-size: 16px; 
                letter-spacing: 1px;
            }

            .nav { right: 25px; top: 60px; }

            .main-content {
                margin: 120px auto 50px;
            }

            .fila-tres-columnas {
                flex-direction: column;
                gap: 25px;
                text-align: center;
            }
            .columna-izquierda, .columna-derecha {
                text-align: center;
            }
            .columna-izquierda p {
                font-size: 11px;
            }
            .columna-derecha {
                text-align: center;
            }
            
            .columna-derecha {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }
            
            .columna-derecha .link-linea-1 {
                order: 1;
            }

            .columna-derecha .texto-linea-2 {
                order: 2;
            }

            .columna-derecha .texto-linea-3 {
                order: 3;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand-logo"><a href="index.html">GARABATO CINE</a></div>

        <button class="menu-toggle" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="nav" id="navMenu">
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="nosotros.html">NOSOTROS</a>
            <div class="lang">
                <span class="active">ES</span>
                <span>/</span>
                <a href="#">EN</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <h1>CONTACTO</h1>
        <p>¿Tienes alguna duda o proyecto en mente? Escríbenos y te responderemos lo antes posible.</p>

        <form class="contacto-form" action="#" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required placeholder="tu@correo.com">

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>

            <button type="submit">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="sitio-footer">
        <div class="fila-tres-columnas">
            <div class="columna-izquierda">
                <h4>GARABATO CINE</h4>
                <p>Cine hecho desde el Caribe colombiano.</p>
            </div>
            
            <div class="columna-central">
                <a href="https://www.instagram.com/garabatocine/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/garabatocine?_rdc=1&_rdr" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="http://www.youtube.com/channel/UC4vuld7vS7GhKcBf2dv0fJw" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            </div>
            
            <div class="columna-derecha">
                <p class="link-linea-1"><a href="contacto.html" class="footer-link-normal">Contacto</a></p>
                <p class="texto-chico texto-linea-2">Todos los derechos reservados</p>
                <p class="texto-chico texto-linea-3">© 2026 Garabato Cine</p>
            </div>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');

        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('open');
        });
    </script>
</body>
</html>
