<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    font-family: 'Roboto', sans-serif;
    overflow-x: hidden;
}

/* ================= INTRO ================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
}

#intro svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* animaciones */
.play .fade {
    animation: fadeIn 2.5s ease forwards;
}

.play .move {
    animation: moveLeft 1.2s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 3.5s;
}

.play .white {
    animation: fadeOut 1s ease forwards;
    animation-delay: 3.5s;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes moveLeft {
    to { transform: translateX(-120%); }
}

@keyframes fadeOut {
    to { opacity: 0; }
}

/* ================= HEADER ================= */

header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
}

.logo-txt {
    font-weight: 300;
    letter-spacing: 4px;
}

.nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #000;
}

/* ================= CONTENIDO ================= */

.hero {
    height: 100vh;
    width: 100%;
    object-fit: cover;
}

</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">
<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="textMask" maskUnits="userSpaceOnUse">

<rect width="1200" height="600" fill="white"/>

<g class="fade move">
<text x="600" y="300"
text-anchor="middle"
dominant-baseline="middle"
font-size="160"
font-weight="900"
font-family="Roboto, sans-serif"
fill="black">
GARABATO CINE
</text>
</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#textMask)" class="white"/>

</svg>
</div>

<!-- ================= HEADER ================= -->
<header>
    <div class="logo-txt">Garabato Cine</div>
    <div class="nav">
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</header>

<!-- ================= CONTENIDO ================= -->
<img class="hero" src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">

<script>
window.addEventListener("load", () => {

    // activar animación
    setTimeout(() => {
        document.body.classList.add("play");
    }, 200);

    // eliminar intro después
    setTimeout(() => {
        const intro = document.getElementById("intro");
        if (intro) intro.remove();
    }, 5000);

});
</script>

</body>
</html>
