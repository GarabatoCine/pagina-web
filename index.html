<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Roboto',sans-serif;
    background:black;
    overflow-x:hidden;
}

/* ================= HERO VIDEO ================= */

.hero{
    position:fixed;
    inset:0;
    z-index:-1;
    background:black;
    transition:opacity .5s ease;
}

.hero video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    background:white;
}

#intro svg{
    width:100%;
    height:100%;
}

/* TEXTO */
.mask-group{
    opacity:0;
}

/* ANIMACIONES */
.play .mask-group{
    animation:
        fadeIn 1.4s ease forwards,
        moveLeft 1.2s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.8s;
}

.play .white-bg{
    animation:fadeOut .3s ease forwards;
    animation-delay:3s;
}

@keyframes fadeIn{
    to{opacity:1;}
}

@keyframes moveLeft{
    to{transform:translateX(-140%);}
}

@keyframes fadeOut{
    to{opacity:0;visibility:hidden;}
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    z-index:1000;

    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(15px);
}

.logo{
    letter-spacing:4px;
    text-transform:uppercase;
    font-weight:300;
}

.nav a{
    margin-left:20px;
    font-size:.7rem;
    text-decoration:none;
    color:#222;
}

/* ================= MEDIA ================= */

.media{
    width:100%;
    background:black;
}

.media img,
.media video{
    width:100%;
    height:auto;
    display:block;
}

/* Desktop */
@media(min-width:1024px){
    .media img,
    .media video{
        height:100vh;
        object-fit:contain;
    }
}

/* ================= TEXTOS ================= */

.pie{
    padding:20px 0 80px;
    text-align:center;
    background:white;
}

.pie h2{
    font-weight:300;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie p{
    font-size:.6rem;
    letter-spacing:3px;
    color:#999;
}

</style>
</head>

<body>

<!-- HERO VIDEO -->
<div class="hero">
<video id="heroVideo" autoplay muted loop playsinline preload="auto">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group" fill="black" text-anchor="middle">

<text x="600" y="280"
font-size="clamp(60px,10vw,110px)"
font-weight="900">
GARABATO CINE
</text>

<text x="600" y="340"
font-size="clamp(14px,2vw,22px)"
letter-spacing="4">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)" class="white-bg"/>

</svg>

</div>

<!-- HEADER -->
<header>
<div class="logo">Garabato Cine</div>
<div class="nav">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- CONTENIDO -->

<div class="media">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">
</div>
<div class="pie"><h2>La Frontera</h2><p>Largometraje</p></div>

<div class="media">
<video autoplay muted loop playsinline preload="auto">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
</div>
<div class="pie"><h2>Vida de Colores</h2><p>Serie</p></div>

<!-- resto proyectos igual -->

<script>

// 🔒 AUTOPLAY SEGURO (iOS/tablet)
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.playsInline = true;
    v.play().catch(()=>{});
});

// 🔒 SCROLL TOP
if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
}

window.addEventListener("load", ()=>{

    window.scrollTo(0,0);

    requestAnimationFrame(()=>{
        document.body.classList.add("play");
    });

    setTimeout(()=>{
        document.getElementById("intro")?.remove();
        document.querySelector(".hero").style.opacity="0";
    }, 3200);

});

</script>

</body>
</html>
