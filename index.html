<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO ESTILO CAVIAR (LETRAS TRANSPARENTES REALES) --- */
        #intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff; /* Fondo blanco */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* El fondo blanco desaparece al final de todo el proceso */
            animation: fadeBackground 0.8s ease-in forwards;
            animation-delay: 4.2s; 
            pointer-events: none;
        }

        #intro h1 {
            font-size: clamp(2.2rem, 10vw, 7.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            white-space: nowrap;
            
            /* TRUCO DE TRANSPARENCIA: */
            /* El texto es negro, pero el modo 'screen' sobre blanco lo vuelve 100% transparente */
            color: #000; 
            background: #fff;
            mix-blend-mode: screen; 
            
            /* ANIMACIÓN: Aparece quieto -> Pausa -> Se mueve */
            animation: caviarFinalFlow 4.2s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes caviarFinalFlow {
            /* 1. APARECE EN EL CENTRO SIN MOVERSE */
            0% { opacity: 0; transform: translateX(0); }
            15% { opacity: 1; transform: translateX(0); } 
            
            /* 2. PAUSA ESTÁTICA (Mantenemos el centro para ver a través de las letras) */
            15% { transform: translateX(0); }
            75% { transform: translateX(0); } 
            
            /* 3. DESPLAZAMIENTO A LA IZQUIERDA */
            100% { transform: translateX(-150%); }
        }

        @keyframes fadeBackground {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* --- RESTO DEL DISEÑO --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 35px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            mix-blend-mode: difference;
        }

        .brand { font-weight: 400; letter-spacing: 4px; text-transform: uppercase; font-size: 0.9rem; color: #fff; }
        nav { display: flex; gap: 30px; align-items: center; }
        .ig-icon { width: 18px; height: 18px; fill: #fff; }

        .hero-project {
            height: 100vh;
            width: 100%;
            background: #000;
        }

        .hero-project img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info {
            padding: 60px 0 120px 0;
            text-align: center;
        }

        .project-info h2 { font-size: 1.5rem; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; }
        .project-info p { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 3px; }

        .image-container img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <div id="intro">
        <h1>Garabato Cine</h1>
    </div>

    <header>
        <div class="brand">Garabato Cine</div>
        <nav>
            <a href="https://www.instagram.com/garabatocine/" target="_blank">

            </a>
        </nav>
    </header>

    <div class="main-content">
        <div class="hero-project">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">
        </div>
        <div class="project-info">
            <h2>La Frontera</h2>
            <p>Largometraje</p>
        </div>
        </div>

</body>
</html>
