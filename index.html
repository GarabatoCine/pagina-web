<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#whiteCover{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9;
}

#intro{
    position:fixed;
    inset:0;
    z-index:10;
    opacity:1;
    transition:opacity 0.05s linear;
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

@media (max-width:1024px){
    svg{
        transform:scale(0.98);
    }
}

text.big{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size: clamp(26px, 5.5vw, 58px);
}

text.small{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing:2px;
}

.mask-group{
    transform-box: fill-box;
    transform-origin:center;
}

.mask-group text{ opacity:0; }
.play .mask-group text{ opacity:1; }

.play .mask-group{
    animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:2s;
}

@keyframes slideLeft{
    to { transform: translateX(-200%); }
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:25px 40px;

    font-family: Arial, Helvetica, sans-serif;
    color:white;
    text-transform:uppercase;

    opacity:0;
    animation:fadeInHeader 0.5s ease forwards;
    animation-delay:3.3s;
}

@keyframes fadeInHeader{
    to { opacity:1; }
}

.brand{
    font-weight:900;
    font-size:20px;
    cursor:pointer;
}

.hamburger{
    width:28px;
    height:18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}

.hamburger span{
    height:2px;
    background:white;
    width:100%;
}

/* ===================== */
/* OVERLAY MENU */
/* ===================== */
.cinema-overlay{
    position:fixed;
    inset:0;
    z-index:100;

    opacity:0;
    pointer-events:none;

    transition:opacity 0.5s ease;
}

.cinema-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.cinema-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.cinema-content{
    position:relative;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;
}

.cinema-links{
    display:flex;
    flex-direction:column;
    gap:22px;
    text-align:center;
    font-family: Arial, Helvetica, sans-serif;
    text-transform:uppercase;
}

.cinema-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    letter-spacing:2px;

    opacity:0;
    transform:translateY(10px);
    transition:all 0.4s ease;
}

.cinema-overlay.active .cinema-links a{
    opacity:1;
    transform:translateY(0);
}

.cinema-overlay.active .cinema-links a:nth-child(1){ transition-delay:0.1s; }
.cinema-overlay.active .cinema-links a:nth-child(2){ transition-delay:0.15s; }
.cinema-overlay.active .cinema-links a:nth-child(3){ transition-delay:0.2s; }
.cinema-overlay.active .cinema-links a:nth-child(4){ transition-delay:0.25s; }
.cinema-overlay.active .cinema-links a:nth-child(5){ transition-delay:0.3s; }

</style>
</head>

<body>

<!-- FIX WHITE COVER -->
<div id="whiteCover"></div>

<!-- HEADER -->
<header class="header">
    <div class="brand">GARABATO CINE</div>

    <div class="hamburger" id="hambBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<!-- OVERLAY -->
<div class="cinema-overlay" id="cinemaMenu">
    <div class="cinema-backdrop"></div>

    <div class="cinema-content">
        <div class="cinema-links">
            <a href="#">CATÁLOGO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">PRÓXIMAMENTE</a>
            <a href="#">CONTACTO</a>
            <a href="#">INSTAGRAM</a>
        </div>
    </div>
</div>

<!-- VIDEO -->
<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<!-- INTRO -->
<div id="intro">
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">

        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>
                <g class="mask-group" id="logoGroup">
                    <text x="700" y="240" text-anchor="middle" class="big">GARABATO CINE</text>
                    <text x="700" y="285" text-anchor="middle" class="small">COLOMBIA</text>
                </g>
            </mask>
        </defs>

        <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<script>

window.addEventListener("load", ()=>{

    document.body.classList.add("play");

    const intro = document.getElementById("intro");
    const white = document.getElementById("whiteCover");

    setTimeout(()=>{
        intro.style.opacity = "0";

        setTimeout(()=>{
            intro.style.display = "none";
            white.style.display = "none";
        },120);

    },3250);
});

/* HAMBURGER */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("cinemaMenu");

btn.addEventListener("click", ()=>{
    menu.classList.toggle("active");
});

/* cerrar overlay */
menu.addEventListener("click", (e)=>{
    if(e.target === menu){
        menu.classList.remove("active");
    }
});

document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){
        menu.classList.remove("active");
    }
});

document.querySelectorAll(".cinema-links a").forEach(a=>{
    a.addEventListener("click", ()=>{
        menu.classList.remove("active");
    });
});

</script>

</body>
</html>
