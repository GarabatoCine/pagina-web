<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Banner de Video</title>
    <style>
      /* Este código crea un fondo negro que se expande más allá del video */
      body, html { 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        background-color: black; 
        height: 100%;
      }

      .outer-black-box {
        background-color: black;
        width: 100%;
        height: 100vh; /* Ocupa el alto total de la pantalla */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .video-container {
        position: relative;
        width: 100%;
        height: 100%; /* Ajustado para que en GitHub sea pantalla completa */
        overflow: hidden;
        background-color: black;
      }

      iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vw; /* Tu configuración favorita */
        transform: translate(-50%, -50%);
        object-fit: cover;
      }
    </style>
</head>
<body>

<div class="outer-black-box">
  <div class="video-container">
    <iframe 
      src="https://player.vimeo.com/video/1186377656?background=1&autoplay=1&loop=1&muted=1&quality=1080p" 
      frameborder="0" 
      allow="autoplay; fullscreen">
    </iframe>
  </div>
</div>

</body>
</html>
