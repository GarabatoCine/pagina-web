<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:10;
    opacity:1;
    transition: opacity 0.05s linear;
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

/* TEXTO ORIGINAL */
text.big {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 58px);
}

text.small {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing: 2px;
}

/* máscara */
.mask-group{
    transform-box: fill-box;
    transform-origin: center;
}

.mask-group text{
    opacity:0;
}

.play .mask-group text{
    opacity:1;
}

/* animación salida */
.play .mask-group{
    animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay: 2s;
}

@keyframes slideLeft{
    to { transform: translateX(-200%); }
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:30px 50px;

    font-family: Arial, Helvetica, sans-serif;
    text-transform:uppercase;
    color:white;

    opacity: 0;
    animation: fadeInHeader 0.5s ease forwards;
    animation-delay: 3.3s;
}

@keyframes fadeInHeader{
    to { opacity: 1; }
}

.brand{
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    cursor:pointer;
}

.nav{
    display:flex;
    gap:25px;
    align-items:center;
    font-size:11px;
    font-weight:700;
}

.nav a{
    color:white;
    text-decoration:none;
    opacity:0.8;
}

.nav a:hover{
    opacity:1;
}

.icon{
    width:18px;
    height:18px;
    fill:white;
}

.lang-selector{
    font-size:10px;
    letter-spacing:1px;
}

.lang-selector span{
    opacity:0.4;
    margin-right:5px;
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */
@media (max-width:768px){
    .header{ padding:20px; }
    .brand{ font-size:16px; }
    .nav{ gap:12px; }
    .nav a:nth-child(3){ display:none; }
}
</style>
</head>

<body>

<header class="header">
    <div class="brand" id="restartIntro">GARABATO CINE</div>

    <div class="nav">
        <a href="#">CATÁLOGO</a>
        <a href="#">NOSOTROS</a>
        <a href="#">PRÓXIMAMENTE</a>

        <a href="https://instagram.com" target="_blank">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162z"/>
            </svg>
        </a>

        <div class="lang-selector">
            <span>ES</span><a href="#">EN</a>
        </div>
    </div>
</header>

<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<div id="intro">
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">
        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>
                <g class="mask-group" id="logoGroup">
                    <text x="700" y="240" text-anchor="middle" class="big">GARABATO CINE</text>
                    <text x="700" y="285" text-anchor="middle" class="small">COLOMBIA</text>
                </g>
            </mask>
        </defs>

        <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<script>

/* VIDEO */
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

/* INTRO INICIAL */
function startIntro(){
    const intro = document.getElementById("intro");

    intro.style.display = "block";
    intro.style.opacity = "1";

    document.body.classList.remove("play");

    setTimeout(()=>{
        document.body.classList.add("play");
    }, 50);

    setTimeout(()=>{
        intro.style.opacity = "0";

        setTimeout(()=>{
            intro.style.display = "none";
        }, 120);

    }, 3250);
}

window.addEventListener("load", startIntro);

/* ===================== */
/* REINICIAR INTRO DESDE HEADER */
/* ===================== */
document.getElementById("restartIntro").addEventListener("click", ()=>{

    const intro = document.getElementById("intro");

    intro.style.display = "block";
    intro.style.opacity = "1";

    document.body.classList.remove("play");

    const logo = document.getElementById("logoGroup");
    logo.style.animation = "none";
    void logo.offsetWidth;
    logo.style.animation = "";

    setTimeout(()=>{
        document.body.classList.add("play");
    }, 50);

    setTimeout(()=>{
        intro.style.opacity = "0";

        setTimeout(()=>{
            intro.style.display = "none";
        }, 120);

    }, 3250);
});

</script>

</body>
</html>
