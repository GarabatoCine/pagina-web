<style>

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    overflow:hidden;
}

/* VIDEO DETRÁS DEL TEXTO */
.intro-video{
    position:absolute;
    inset:0;
    z-index:1;
}

.intro-video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CAPA BLANCA */
.intro-white{
    position:absolute;
    inset:0;
    background:white;
    z-index:2;

    animation:fadeOut .35s ease forwards;
    animation-delay:3s;
}

/* TEXTO */
.intro-text{
    position:absolute;
    inset:0;
    z-index:3;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    mix-blend-mode:screen; /* 🔥 CLAVE REAL */
}

.titulo{
    font-size:clamp(42px,9vw,110px);
    font-weight:900;
    letter-spacing:-2px;
    text-transform:uppercase;
    white-space:nowrap;

    opacity:0;

    animation:fadeIn 1.2s ease forwards,
              moveLeft 1.2s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.7s;
}

.sub{
    margin-top:10px;
    font-size:12px;
    letter-spacing:4px;

    opacity:0;

    animation:fadeIn 1.2s ease forwards,
              moveLeft 1.2s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.7s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes moveLeft{to{transform:translateX(-140%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* ================= HEADER ORIGINAL ================= */

header {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;

    background-color: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.logo-txt {
    font-size: 0.9rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #222; 
}

.nav-derecha a {
    color: #222;
    text-decoration: none;
    font-size: 0.65rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-left: 25px;
}

</style>

<!-- INTRO NUEVO -->
<div id="intro">

    <!-- VIDEO -->
    <div class="intro-video">
        <video autoplay muted loop playsinline>
            <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
        </video>
    </div>

    <!-- FONDO BLANCO -->
    <div class="intro-white"></div>

    <!-- TEXTO -->
    <div class="intro-text">
        <div class="titulo">GARABATO CINE</div>
        <div class="sub">COLOMBIA</div>
    </div>

</div>
