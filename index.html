<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* ===================== */
        /* VIDEO DE FONDO */
        /* ===================== */
        .video-background {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===================== */
        /* INTRO / CORTINILLA */
        /* ===================== */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #fff; /* Fondo blanco inicial */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Esta propiedad hace que el texto negro sea transparente hacia el video */
            mix-blend-mode: screen; 
            
            transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1);
        }

        .intro-title {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-size: clamp(42px, 8vw, 110px);
            color: #000; /* Negro = Transparente con 'screen' */
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
            animation-delay: 0.5s;
        }

        .intro-subtitle {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: clamp(12px, 2vw, 18px);
            letter-spacing: 4px;
            color: #000;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Clase para retirar la cortina */
        .hide-intro {
            transform: translateY(-100%);
        }

        /* ===================== */
        /* HEADER */
        /* ===================== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .header.show {
            opacity: 1;
            pointer-events: auto;
        }

        .brand {
            font-weight: 900;
            font-size: 20px;
            cursor: pointer;
        }

        .hamburger {
            width: 28px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .hamburger span {
            height: 2px;
            background: white;
            width: 100%;
        }

        /* ===================== */
        /* MENU OVERLAY */
        /* ===================== */
        .cinema-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .cinema-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cinema-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
        }

        .cinema-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cinema-links {
            display: flex;
            flex-direction: column;
            gap: 25px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .cinema-links a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .cinema-links a:hover {
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
        </video>
    </div>

    <div id="intro">
        <div class="intro-title">GARABATO CINE</div>
        <div class="intro-subtitle">COLOMBIA</div>
    </div>

    <header class="header" id="mainHeader">
        <div class="brand" onclick="location.reload()">GARABATO CINE</div>
        <div class="hamburger" id="hambBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="cinema-overlay" id="menu">
        <div class="cinema-backdrop"></div>
        <div class="cinema-content">
            <nav class="cinema-links">
                <a href="#">CATÁLOGO</a>
                <a href="#">NOSOTROS</a>
                <a href="#">PRÓXIMAMENTE</a>
                <a href="#">CONTACTO</a>
                <a href="#">INSTAGRAM</a>
            </nav>
        </div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const intro = document.getElementById("intro");
            const header = document.getElementById("mainHeader");

            // 1. Mostrar la intro (el video se verá a través del texto negro)
            // 2. Después de 3 segundos, deslizar la cortina hacia arriba
            setTimeout(() => {
                intro.classList.add("hide-intro");
                header.classList.add("show");
            }, 3000);
        });

        // Lógica del Menú
        const btn = document.getElementById("hambBtn");
        const menu = document.getElementById("menu");

        btn.addEventListener("click", () => {
            menu.classList.toggle("active");
        });

        menu.addEventListener("click", (e) => {
            if (e.target.classList.contains('cinema-backdrop')) {
                menu.classList.remove("active");
            }
        });
    </script>

</body>
</html>
