<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;
}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
background:#000;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:1000;
opacity:1;
}

svg{
width:100vw;
height:100vh;
display:block;
}

/* TEXTO */
text.big{
font-weight:900;
font-size:clamp(24px, 5.5vw, 72px);
}

text.small{
font-weight:700;
font-size:clamp(10px, 1.5vw, 14px);
letter-spacing:3px;
}

/* ANIMACIÓN */
.mask-group{
transform-box:fill-box;
transform-origin:center;
}

.play .mask-group{
animation:slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:1s;
}

@keyframes slideLeft{
to{transform:translateX(-130vw);}
}

/* FADE */
.fade{
opacity:0;
transition:opacity 0.1s linear;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:200;
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 50px;
color:white;
text-transform:uppercase;
font-family:'Sora', sans-serif;
}

.nav{
display:flex;
gap:26px;
align-items:center;
font-size:14px;
}

.nav a{
color:white;
text-decoration:none;
opacity:0.85;
font-weight:600;
letter-spacing:1px;
}

.brand{
font-weight:800;
font-size:22px;
letter-spacing:2px;
cursor:pointer;
}

.icon{
width:22px;
height:22px;
stroke:white;
fill:none;
stroke-width:2;
}

.lang{
display:flex;
align-items:center;
gap:6px;
font-size:12px;
}

.lang .active{opacity:0.4;}
.lang .divider{opacity:0.4;}

.lang a{
color:white;
text-decoration:none;
font-weight:600;
}

/* HAMBURGER */
.hamburger{
display:none;
width:28px;
height:18px;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
}

.hamburger span{
height:2px;
background:white;
width:100%;
}

/* MENU */
.menu{
position:fixed;
top:70px;
right:30px;
width:220px;
background:rgba(0,0,0,0.95);
backdrop-filter:blur(12px);
border-radius:10px;
padding:15px 20px;

display:flex;
flex-direction:column;
gap:12px;

opacity:0;
transform:translateY(-10px);
pointer-events:none;
transition:0.3s ease;

z-index:150;
}

.menu.active{
opacity:1;
transform:translateY(0);
pointer-events:auto;
}

.menu a{
color:white;
text-decoration:none;
font-size:14px;
font-weight:600;
letter-spacing:0.5px;
}

/* RESPONSIVE */
@media (max-width:1024px){
.nav{display:none;}
.hamburger{display:flex;}
.header{padding:20px;}
text.big{font-size:clamp(20px, 4.8vw, 55px);}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video id="bgVideo" autoplay muted loop playsinline webkit-playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid slice">
<defs>
<mask id="mask" style="mask-type:luminance;">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group">
<text x="50%" y="50%" text-anchor="middle" class="big" fill="white">
GARABATO CINE
</text>
<text x="50%" y="60%" text-anchor="middle" class="small" fill="white">
COLOMBIA
</text>
</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
</svg>
</div>

<!-- HEADER -->
<header class="header">
<div class="brand" id="logoBtn">GARABATO CINE</div>

<div class="nav">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>

<a href="https://www.instagram.com/garabatocine/" target="_blank" rel="noopener noreferrer">
<svg class="icon" viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

<div class="lang">
<span class="active">ES</span>
<span class="divider">|</span>
<a href="#">EN</a>
</div>

</div>

<div class="hamburger" id="hambBtn">
<span></span><span></span><span></span>
</div>
</header>

<!-- MENU -->
<div class="menu" id="menu">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>
</div>

<script>

/* 🔥 SIMPLE AUTOPLAY (sin interferencias) */
const video = document.getElementById("bgVideo");

function playVideo(){
video.muted = true;
video.play().catch(()=>{});
}

window.addEventListener("load", playVideo);
document.addEventListener("DOMContentLoaded", playVideo);

/* INTRO */
function startIntro(){
const intro = document.getElementById("intro");

intro.style.display="block";
intro.style.opacity="1";
document.body.classList.remove("play");

setTimeout(()=>{
document.body.classList.add("play");
},50);

setTimeout(()=>{
intro.classList.add("fade");

setTimeout(()=>{
intro.style.display="none";
playVideo();
},120);

},1600);

}

window.addEventListener("load", startIntro);
document.getElementById("logoBtn").addEventListener("click", startIntro);

/* MENU */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("menu");

btn.addEventListener("click", ()=>{
menu.classList.toggle("active");
});

</script>

</body>
</html>
