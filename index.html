<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:10;
    opacity:1;
    transition: opacity 0.05s linear;
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

/* TEXTO ORIGINAL */
text.big {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 58px);
}

text.small {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing: 2px;
}

/* máscara */
.mask-group{
    transform-box: fill-box;
    transform-origin: center;
}

.mask-group text{
    opacity:0;
}

.play .mask-group text{
    opacity:1;
}

/* animación salida */
.play .mask-group{
    animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay: 2s;
}

@keyframes slideLeft{
    to { transform: translateX(-200%); }
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:30px 50px;

    font-family: Arial, Helvetica, sans-serif;
    text-transform:uppercase;
    color:white;

    opacity: 0;
    animation: fadeInHeader 0.5s ease forwards;
    animation-delay: 3.3s;
}

@keyframes fadeInHeader{
    to { opacity: 1; }
}

.brand{
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    cursor:pointer;
}

.nav{
    display:flex;
    gap:25px;
    align-items:center;
    font-size:11px;
    font-weight:700;
}

.nav a{
    color:white;
    text-decoration:none;
    opacity:0.8;
}

.nav a:hover{
    opacity:1;
}

/* ICONO INSTAGRAM CORREGIDO */
.icon{
    width:18px;
    height:18px;
    fill:white;
}

/* idioma */
.lang-selector{
    font-size:10px;
    letter-spacing:1px;
}

.lang-selector span{
    opacity:0.4;
    margin-right:5px;
}

/* ===================== */
/* TABLET FIX (DESBORDES) */
/* ===================== */
@media (max-width:1024px){

    text.big{
        font-size: clamp(24px, 5vw, 48px);
    }

    text.small{
        font-size: clamp(10px, 2vw, 12px);
    }

    svg{
        transform: scale(0.95);
        transform-origin: center;
    }
}

/* ===================== */
/* MOBILE */
/* ===================== */
@media (max-width:768px){
    .header{ padding:20px; }
    .brand{ font-size:16px; }
    .nav{ gap:12px; }
    .nav a:nth-child(3){ display:none; }
}
</style>
</head>

<body>

<header class="header">
    <div class="brand" id="restartIntro">GARABATO CINE</div>

    <div class="nav">
        <a href="#">CATÁLOGO</a>
        <a href="#">NOSOTROS</a>
        <a href="#">PRÓXIMAMENTE</a>

        <!-- INSTAGRAM CORRECTO -->
        <a href="https://instagram.com" target="_blank">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm10 2H7a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3zm-5 3.5A4.5 4.5 0 1112 16a4.5 4.5 0 010-9zm0 2A2.5 2.5 0 1014.5 12 2.5 2.5 0 0012 9.5zM17.8 6.2a1 1 0 11-1 1 1 1 0 011-1z"/>
            </svg>
        </a>

        <div class="lang-selector">
            <span>ES</span><a href="#">EN</a>
        </div>
    </div>
</header>

<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<div id="intro">
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">
        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>
                <g class="mask-group" id="logoGroup">
                    <text x="700" y="240" text-anchor="middle" class="big">GARABATO CINE</text>
                    <text x="700" y="285" text-anchor="middle" class="small">COLOMBIA</text>
                </g>
            </mask>
        </defs>

        <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<script>

/* VIDEO */
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

/* INTRO */
function startIntro(){
    const intro = document.getElementById("intro");

    intro.style.display = "block";
    intro.style.opacity = "1";

    document.body.classList.remove("play");

    setTimeout(()=>{
        document.body.classList.add("play");
    }, 50);

    setTimeout(()=>{
        intro.style.opacity = "0";

        setTimeout(()=>{
            intro.style.display = "none";
        }, 120);

    }, 3250);
}

window.addEventListener("load", startIntro);

/* REINICIAR INTRO DESDE HEADER */
document.getElementById("restartIntro").addEventListener("click", ()=>{

    const intro = document.getElementById("intro");

    intro.style.display = "block";
    intro.style.opacity = "1";

    document.body.classList.remove("play");

    const logo = document.getElementById("logoGroup");
    logo.style.animation = "none";
    void logo.offsetWidth;
    logo.style.animation = "";

    setTimeout(()=>{
        document.body.classList.add("play");
    }, 50);

    setTimeout(()=>{
        intro.style.opacity = "0";

        setTimeout(()=>{
            intro.style.display = "none";
        }, 120);

    }, 3250);
});

</script>

</body>
</html>
