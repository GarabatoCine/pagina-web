<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine | Recreación Efecto Caviar</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #fff; 
            font-family: 'Roboto', sans-serif;
            overflow: hidden; /* Evita scroll durante la intro */
        }

        /* --- CAPA INTRO: EL EFECTO MÁSCARA Y MOVIMIENTO --- */
        #capa-intro {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #fff; /* Fondo blanco inicial */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            /* El fondo blanco desaparece instantáneamente al final del movimiento del texto */
            animation: deslizarTexto 2s cubic-bezier(0.85, 0, 0.15, 1) forwards, desaparecerFondo 0s linear forwards 2s; 
        }

        /* El SVG que hace el hoyo */
        .svg-hoyo {
            width: 90vw; /* Ocupa casi todo el ancho */
            height: auto;
            transform: translateX(100%); /* Comienza fuera de la pantalla a la derecha */
        }

        /* Animación para el movimiento del texto */
        @keyframes deslizarTexto {
            to { 
                transform: translateX(-160%); /* El texto se desliza hacia la izquierda */
            }
        }

        /* Animación para la desaparición instantánea del fondo blanco */
        @keyframes desaparecerFondo {
            to { 
                visibility: hidden; 
            }
        }

        /* --- EL CONTENIDO INICIAL DETRÁS DE LA INTRO --- */
        .contenido-inicial {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Detrás de la intro */
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true');
            background-size: cover;
            background-position: center;
        }

        .titular-web {
            font-size: 2vw;
            font-weight: 300;
            letter-spacing: 5px;
            color: #fff;
            text-transform: uppercase;
            background-color: rgba(0,0,0,0.5);
            padding: 10px 20px;
        }

    </style>
</head>
<body>

    <div id="capa-intro">
        <svg class="svg-hoyo" viewBox="0 0 1000 200">
            <defs>
                <mask id="maskCaviar">
                    <rect width="100%" height="100%" fill="white" />
                    <text x="50%" y="50%" text-anchor="middle" dy=".35em" 
                          font-size="120" font-weight="900" fill="black" 
                          style="letter-spacing: -4px;">GARABATO CINE</text>
                </mask>
            </defs>
            <rect width="100%" height="100%" fill="white" mask="url(#maskCaviar)" />
        </svg>
    </div>

    <div class="contenido-inicial">
        <h2 class="titular-web">La Frontera</h2>
    </div>

</body>
</html>
