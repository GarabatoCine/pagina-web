<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #ffffff; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO EFECTO MÁSCARA (TRANSPARENTE) --- */
        #intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff; /* Fondo blanco que cubre todo */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* El fondo blanco se desvanece al final */
            animation: fadeOutBackground 0.8s ease-in forwards;
            animation-delay: 4s; 
            pointer-events: none;
        }

        #intro h1 {
            font-size: clamp(2.5rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -2px;
            
            /* ESTA ES LA CLAVE DEL EFECTO CAVIAR: */
            color: #000; /* Texto negro */
            background-color: #fff; /* Fondo blanco interno */
            mix-blend-mode: screen; /* Esto vuelve lo negro TRANSPARENTE sobre blanco */
            
            /* ANIMACIÓN: Centro estático -> Pausa -> Salida Izquierda */
            animation: caviarMove 4s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes caviarMove {
            0% { opacity: 0; transform: translateX(0); }
            15% { opacity: 1; transform: translateX(0); } /* Aparece quieto en el centro */
            75% { transform: translateX(0); opacity: 1; } /* Se mantiene quieto 2.5s */
            100% { transform: translateX(-150%); opacity: 0; } /* Sale a la izquierda */
        }

        @keyframes fadeOutBackground {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- CONTENIDO --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
            mix-blend-mode: difference;
            color: white;
        }

        .hero-project {
            height: 100vh;
            width: 100%;
            background: #000;
        }

        .hero-project img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .project-info {
            padding: 60px 0 120px 0;
            text-align: center;
        }

        .project-info h2 { font-weight: 300; letter-spacing: 5px; text-transform: uppercase; }
        .project-info p { color: #888; font-size: 0.7rem; letter-spacing: 2px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="intro">
        <h1>Garabato Cine</h1>
    </div>

    <header>
        <div style="text-transform: uppercase; letter-spacing: 3px; font-weight: 400;">Garabato Cine</div>
        <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 300;">About / Contact</div>
    </header>

    <div class="hero-project">
        <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" alt="La Frontera">
    </div>

    <div class="project-info">
        <h2>La Frontera</h2>
        <p>LARGOMETRAJE</p>
    </div>

</body>
</html>
