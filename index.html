<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#000;overflow-x:hidden;}

/* ================= HERO VIDEO ================= */

.hero{
    position:fixed;
    inset:0;
    z-index:-1;
}

.hero video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro svg{
    width:100%;
    height:100%;
    display:block;
}

.mask-text{
    opacity:0;
}

.play .mask-text{
    animation:
        fadeIn 1.2s ease forwards,
        slideLeft 1.2s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.7s;
}

.play .white-bg{
    animation:fadeOut .35s ease forwards;
    animation-delay:2.9s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes slideLeft{to{transform:translateX(-140%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* ================= HEADER (TU ORIGINAL) ================= */

header {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;

    background-color: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.logo-txt {
    font-size: 0.9rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #222; 
}

.nav-derecha a {
    color: #222;
    text-decoration: none;
    font-size: 0.65rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-left: 25px;
}

/* ================= MEDIA ================= */

.media{
    width:100%;
    background:#000;
}

.media video,
.media img{
    width:100%;
    height:auto;
    display:block;
}

/* ================= TEXTOS ================= */

.pie{
    padding:20px 0 80px 0;
    text-align:center;
    background:#fff;
}

.pie h2{
    font-size:1.4rem;
    font-weight:300;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie p{
    font-size:0.6rem;
    letter-spacing:3px;
    color:#999;
    text-transform:uppercase;
}

</style>
</head>

<body>

<!-- VIDEO FONDO -->
<div class="hero">
<video autoplay muted loop playsinline preload="auto">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">

<rect width="100%" height="100%" fill="white"/>

<g class="mask-text" fill="black" text-anchor="middle">

<text x="600" y="280"
font-size="110"
font-weight="900">
GARABATO CINE
</text>

<text x="600" y="340"
font-size="20"
letter-spacing="4">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
<rect width="100%" height="100%" fill="white" class="white-bg"/>

</svg>
</div>

<!-- HEADER -->
<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav-derecha">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- CONTENIDO -->

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>
<div class="pie"><h2>La Frontera</h2><p>Largometraje</p></div>

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
</div>
<div class="pie"><h2>Vida de Colores</h2><p>Serie</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true"></div>
<div class="pie"><h2>Marimonda</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true"></div>
<div class="pie"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true"></div>
<div class="pie"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true"></div>
<div class="pie"><h2>Calaguala</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true"></div>
<div class="pie"><h2>La Princesita</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true"></div>
<div class="pie"><h2>Fracturas</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true"></div>
<div class="pie"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

// fix iOS
document.addEventListener("touchstart", ()=>{
    document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// intro animación
window.addEventListener("load", ()=>{
    document.body.classList.add("play");
    window.scrollTo(0,0);
});

</script>

</body>
</html>
