<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;overflow:hidden;}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:10;
}

svg{
position:absolute;
width:100%;
height:100%;
display:block;
}

/* CLAVE PARA MOVER SVG */
.mask-group{
transform-box: fill-box;
transform-origin: center;
}

/* ANIMACIONES */
.play .fade{
animation:fadeIn 3s ease forwards;
}

.play .mask-group{
animation:slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3s;
}

.play #intro{
animation:fadeOut 0.4s ease forwards;
animation-delay:4.6s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

/* 🔥 MÁS DESPLAZAMIENTO */
@keyframes slideLeft{
to{transform:translateX(-180%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<!-- 🔥 MÁS ANCHO = NO SE CORTA EN TABLET -->
<svg viewBox="0 0 1800 500" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group fade">

<!-- 🔥 TEXTO MÁS PEQUEÑO -->
<text x="900" y="240"
text-anchor="middle"
font-size="60"
font-family="Arial, Helvetica, sans-serif"
font-weight="900"
fill="black">
GARABATO CINE
</text>

<text x="900" y="285"
text-anchor="middle"
font-size="16"
font-family="Arial, Helvetica, sans-serif"
font-weight="700"
letter-spacing="3"
fill="black">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

window.addEventListener("load",()=>{
document.body.classList.add("play");
});

setTimeout(()=>{
document.getElementById("intro").style.display="none";
},6000);

</script>

</body>
</html>
