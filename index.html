<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        background-color: black; 
        color: white; 
        font-family: 'Helvetica', Arial, sans-serif; 
        overflow-x: hidden;
      }

      /* Sección del Video Banner */
      .hero-video {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background-color: black;
      }
      iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vw;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Contenedor de Proyectos */
      .container {
        padding: 50px 10%;
        text-align: center;
      }

      .proyecto {
        margin-bottom: 80px;
      }

      .proyecto h2 {
        font-size: 2rem;
        margin-bottom: 20px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .proyecto img {
        width: 100%;
        max-width: 900px;
        height: auto;
        border-radius: 5px;
        transition: transform 0.3s ease;
      }

      .proyecto img:hover {
        transform: scale(1.02);
      }

      h1.titulo-principal {
        margin-top: 40px;
        font-size: 3rem;
      }
    </style>
</head>
<body>

  <div class="hero-video">
    <iframe 
      src="https://player.vimeo.com/video/1186377656?background=1&autoplay=1&loop=1&muted=1&quality=1080p" 
      frameborder="0" allow="autoplay; fullscreen">
    </iframe>
  </div>

  <div class="container">
    <h1 class="titulo-principal">NUESTROS PROYECTOS</h1>
    <br><br><br>

    <div class="proyecto">
      <h2>La Frontera</h2>
      <img src="TU_ENLACE_AL_GIF_AQUI" alt="La Frontera">
    </div>

    <div class="proyecto">
      <h2>Vida de Colores</h2>
      <img src="TU_ENLACE_AL_GIF_2_AQUI" alt="Vida de Colores">
    </div>

    <div class="proyecto">
      <h2>Siguiente Proyecto</h2>
      <img src="TU_ENLACE_A_FOTO_AQUI" alt="Proyecto 3">
    </div>
  </div>

</body>
</html>
