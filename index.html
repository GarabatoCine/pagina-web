<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;overflow:hidden;}

/* VIDEO FULLSCREEN */
.video{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
background:#000;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:10;
}

svg{
width:100%;
height:100%;
display:block;
}

/* TIPOGRAFÍA CONTROLADA */
.main{
font-family:Arial, Helvetica, sans-serif;
font-weight:900;
}

.sub{
font-family:Arial, Helvetica, sans-serif;
font-weight:700;
letter-spacing:0.25vw;
}

/* 🔥 CONTROL REAL DE TAMAÑO */
@media (min-width:1200px){
text.main{font-size:7vw;}
text.sub{font-size:1vw;}
}

@media (max-width:1199px){
text.main{font-size:9vw;}
text.sub{font-size:1.6vw;}
}

@media (max-width:768px){
text.main{font-size:11vw;}
text.sub{font-size:2.2vw;}
}

/* ANIMACIONES */
.play .fade{
animation:fadeIn 3s ease forwards;
}

.play .mask-group{
animation:slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3.1s;
}

.play #intro{
animation:fadeOut 0.4s ease forwards;
animation-delay:4.7s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes slideLeft{
to{transform:translateX(-140%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<!-- 🔥 CAMBIO CLAVE AQUÍ -->
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group fade">

<text x="50" y="48"
text-anchor="middle"
class="main"
fill="black">
GARABATO CINE
</text>

<text x="50" y="55"
text-anchor="middle"
class="sub"
fill="black">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

window.addEventListener("load",()=>{
document.body.classList.add("play");
});

setTimeout(()=>{
document.getElementById("intro").style.display="none";
},6000);

</script>

</body>
</html>
