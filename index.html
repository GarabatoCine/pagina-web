<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:10;
    background: transparent; /* Aseguramos que el fondo no sea sólido aquí */
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

.mask-group{
    transform-box: fill-box;
    transform-origin: center;
}

.mask-group text{
    opacity:0;
}

.play .mask-group text{
    opacity:1;
}

/* AJUSTE: Reducimos el tiempo de slideLeft de 1.6s a 1.1s 
   para ganar esos 0.5s de rapidez al final.
*/
.play .mask-group{
    animation: slideLeft 1.1s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay: 2.5s;
}

/* Ocultado inmediato */
#intro.hide {
    display: none !important;
}

/* ===================== */
/* TEXTO */
/* ===================== */
text.big{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size: clamp(28px, 6vw, 58px);
}

text.small{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing:2px;
}

/* ===================== */
/* KEYFRAMES */
/* ===================== */
@keyframes slideLeft{
    to { transform: translateX(-150%); } /* Ajustado para que no viaje más de lo necesario */
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */
@media (max-width: 1024px){
    text.big{ font-size: clamp(20px, 5vw, 38px); }
    text.small{ font-size: clamp(9px, 2.2vw, 12px); }
}
</style>
</head>

<body>

<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<div id="intro">
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">
        <defs>
            <mask id="mask">
                <rect id="maskRect" width="100%" height="100%" fill="white"/>
                <g class="mask-group" id="logoGroup">
                    <text x="700" y="240" text-anchor="middle" class="big">GARABATO CINE</text>
                    <text x="700" y="285" text-anchor="middle" class="small">COLOMBIA</text>
                </g>
            </mask>
        </defs>
        <rect id="whiteBackground" width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<script>
/* Autoplay Fix */
document.querySelectorAll("video").forEach(v => {
    v.muted = true;
    v.play().catch(() => {});
});

window.addEventListener("load", () => {
    document.body.classList.add("play");

    const logo = document.getElementById("logoGroup");
    const intro = document.getElementById("intro");
    const whiteBg = document.getElementById("whiteBackground");

    logo.addEventListener("animationend", (e) => {
        if (e.animationName === "slideLeft") {
            // ELIMINACIÓN INSTANTÁNEA
            // Quitamos el fondo blanco y el contenedor de inmediato
            whiteBg.style.display = "none";
            intro.classList.add("hide");
        }
    });
});
</script>

</body>
</html>
