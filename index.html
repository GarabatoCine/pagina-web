<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO (VERSIÓN SEGURA) */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:10;
    background:#fff;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:opacity 0.05s linear;
}

/* 🔥 TÍTULO GRANDE (COMO EL QUE TENÍAS) */
.intro-title{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;

    /* tamaño grande estilo cine */
    font-size: clamp(42px, 7vw, 96px);

    color:#000;

    opacity:0;
    animation:fadeIn 0.4s ease forwards;
    animation-delay:1.6s;

    /* 🔥 efecto transparencia leve */
    mix-blend-mode: multiply;
}

/* SUBTÍTULO */
.intro-subtitle{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;

    font-size: clamp(12px, 2vw, 16px);
    letter-spacing:2px;

    color:#000;

    opacity:0;
    animation:fadeIn 0.4s ease forwards;
    animation-delay:1.8s;

    mix-blend-mode: multiply;
}

/* entrada suave */
@keyframes fadeIn{
    to{ opacity:1; }
}

/* movimiento cortinilla */
.play .intro-title,
.play .intro-subtitle{
    animation:slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:2s;
}

@keyframes slideLeft{
    to{
        transform:translateX(-180%);
    }
}

/* salida intro */
.hide{
    opacity:0;
    pointer-events:none;
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:25px 40px;

    font-family: Arial, Helvetica, sans-serif;
    color:white;
    text-transform:uppercase;

    opacity:0;
    animation:fadeInHeader 0.5s ease forwards;
    animation-delay:3.2s;
}

@keyframes fadeInHeader{
    to { opacity:1; }
}

.brand{
    font-weight:900;
    font-size:20px;
    cursor:pointer;
}

/* HAMBURGER */
.hamburger{
    width:28px;
    height:18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}

.hamburger span{
    height:2px;
    background:white;
    width:100%;
}

/* ===================== */
/* OVERLAY MENU */
/* ===================== */
.cinema-overlay{
    position:fixed;
    inset:0;
    z-index:100;

    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
}

.cinema-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.cinema-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(14px);
}

.cinema-content{
    position:relative;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;
}

.cinema-links{
    display:flex;
    flex-direction:column;
    gap:22px;
    text-align:center;
    font-family: Arial, Helvetica, sans-serif;
    text-transform:uppercase;
}

.cinema-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    letter-spacing:2px;

    opacity:0;
    transform:translateY(10px);
    transition:all 0.4s ease;
}

.cinema-overlay.active .cinema-links a{
    opacity:1;
    transform:translateY(0);
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
    <div class="brand" id="restart">GARABATO CINE</div>

    <div class="hamburger" id="hambBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<!-- OVERLAY -->
<div class="cinema-overlay" id="menu">
    <div class="cinema-backdrop"></div>

    <div class="cinema-content">
        <div class="cinema-links">
            <a href="#">CATÁLOGO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">PRÓXIMAMENTE</a>
            <a href="#">CONTACTO</a>
            <a href="#">INSTAGRAM</a>
        </div>
    </div>
</div>

<!-- VIDEO -->
<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<!-- INTRO -->
<div id="intro">
    <div class="intro-title">GARABATO CINE</div>
    <div class="intro-subtitle">COLOMBIA</div>
</div>

<script>

window.addEventListener("load", ()=>{

    document.body.classList.add("play");

    const intro = document.getElementById("intro");

    setTimeout(()=>{
        intro.classList.add("hide");

        setTimeout(()=>{
            intro.style.display="none";
        },120);

    },3250);
});

/* REINICIO INTRO */
document.getElementById("restart").addEventListener("click", ()=>{
    location.reload();
});

/* MENU */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("menu");

btn.addEventListener("click", ()=>{
    menu.classList.toggle("active");
});

menu.addEventListener("click", (e)=>{
    if(e.target === menu){
        menu.classList.remove("active");
    }
});

</script>

</body>
</html>
