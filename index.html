<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    font-family: 'Roboto', sans-serif;
    background: #000;
}

/* --- IMAGEN DE FONDO --- */
.bg-media {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* --- CAPA BLANCA --- */
#intro {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: slideOut 1.2s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    animation-delay: 3.2s;
}

/* --- TEXTO "RECORTE" --- */
#intro h1 {
    font-size: 11vw;
    font-weight: 900;
    letter-spacing: -0.05em;
    text-transform: uppercase;

    color: black;

    /* 💥 ESTO HACE EL HUECO REAL */
    mix-blend-mode: destination-out;

    opacity: 0;
    animation: fadeIn 1.4s ease forwards;
    animation-delay: 0.4s;
}

/* --- ANIMACIONES --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes slideOut {
    to {
        transform: translateX(-100%);
        visibility: hidden;
    }
}

/* --- CONTENIDO --- */
.contenido {
    position: relative;
    z-index: 2;
}

.seccion {
    height: 100vh;
}

</style>
</head>

<body>

<!-- IMAGEN DE FONDO -->
<img 
class="bg-media" 
src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true"
/>

<!-- INTRO -->
<div id="intro">
    <h1>GARABATO CINE</h1>
</div>

<!-- CONTENIDO -->
<div class="contenido">
    <div class="seccion"></div>
</div>

</body>
</html>
