<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #ffffff; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO DEFECTIVA (LETRA TRANSPARENTE + DESLIZAMIENTO) --- */
        #capa-intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background-color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            
            /* El fondo blanco desaparece suavemente al final */
            animation: salidaFondo 0.6s ease-in forwards;
            animation-delay: 4.5s;
        }

        /* Esta clase aplica la animación de movimiento al texto */
        .svg-texto {
            width: 95vw;
            height: auto;
            /* Aparece en el centro (quieta) y luego corre a la izquierda */
            animation: flujoGarabato 4.5s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes flujoGarabato {
            0% { opacity: 0; transform: translateX(0); }
            15% { opacity: 1; transform: translateX(0); } /* Pausa quieta en el centro */
            75% { transform: translateX(0); opacity: 1; } /* Sigue quieta */
            100% { transform: translateX(-180%); opacity: 0; } /* Salida rápida a la izquierda */
        }

        @keyframes salidaFondo {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- HEADER ESTILO CAPTURA (TRANSPARENTE + BLUR) --- */
        header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            
            /* Transparencia y blur de cristal estilo Safari */
            background-color: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .logo-header {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #333; /* Gris oscuro elegante */
        }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .ig-icon {
            width: 15px;
            height: 15px;
            fill: #333;
        }

        /* --- PROYECTOS --- */
        .bloque-proyecto {
            width: 100%;
            background-color: #fff;
        }

        .hero-img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        .info-proyecto {
            padding: 70px 0 120px 0;
            text-align: center;
        }

        .info-proyecto h2 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #1a1a1a;
        }

        .info-proyecto p {
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="capa-intro">
        <svg class="svg-texto" viewBox="0 0 1200 200">
            <defs>
                <mask id="hoyoTexto">
                    <rect width="100%" height="100%" fill="white" />
                    <text x="50%" y="50%" text-anchor="middle" dy=".35em" 
                          font-size="140" font-weight="900" fill="black" 
                          style="letter-spacing: -5px; font-family: 'Roboto', sans-serif;">GARABATO CINE!</text>
                </mask>
            </defs>
            <rect width="100%" height="100%" fill="white" mask="url(#hoyoTexto)" />
        </svg>
    </div>

    <header>
        <div class="logo-header">Garabato Cine</div>
        <div class="nav-links">

            <a href="#">Contact</a>

            </a>
        </div>
    </header>

    </div>

</body>
</html>
