<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;overflow:hidden;}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:10;
}

svg{
position:absolute;
width:100%;
height:100%;
display:block;
}

/* CLAVE PARA ANIMAR SVG */
.mask-group{
transform-box: fill-box;
transform-origin: center;
}

/* ===== ANIMACIONES ===== */

/* fade in */
.play .fade{
animation:fadeIn 3s ease forwards;
}

/* slide */
.play .mask-group{
animation:slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3s;
}

/* 🔥 DESAPARECE EXACTO AL FINAL */
.play #intro{
animation:fadeOut 0.3s ease forwards;
animation-delay:4.6s; /* mismo momento en que termina slide */
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes slideLeft{
to{transform:translateX(-200%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group fade">

<!-- 🔥 TEXTO MÁS PEQUEÑO Y CONTROLADO -->
<text x="700" y="240"
text-anchor="middle"
font-size="55"
font-family="Arial, Helvetica, sans-serif"
font-weight="900"
fill="black">
GARABATO CINE
</text>

<text x="700" y="280"
text-anchor="middle"
font-size="14"
font-family="Arial, Helvetica, sans-serif"
font-weight="700"
letter-spacing="2"
fill="black">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

/* autoplay */
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* iniciar */
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

/* failsafe */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},6000);

</script>

</body>
</html>
