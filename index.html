<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#fff;overflow-x:hidden;}

/* HEADER (TIPOGRAFÍA DELGADA COMO ANTES) */

header{
position:fixed;
top:0;
width:100%;
height:90px;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 60px;
z-index:1000;
}

.logo{
font-weight:300;
letter-spacing:6px;
font-size:1.2rem;
}

.nav a{
margin-left:30px;
text-decoration:none;
font-size:.9rem;
letter-spacing:2px;
color:#000;
font-weight:300;
}

/* VIDEO (PROPORCIÓN REAL) */

.hero{
margin-top:90px;
background:#fff;
}

.hero video{
width:100%;
height:auto;
display:block;
}

/* ================= INTRO ================= */

#intro{
position:fixed;
inset:0;
z-index:9999;
}

/* VIDEO DE FONDO (NO SE VE AL INICIO POR LA CORTINA) */

.intro-video{
position:absolute;
top:90px;
width:100%;
height:auto;
}

/* CORTINA BLANCA CON HUECO */

.mask-layer{
position:absolute;
inset:0;
background:#fff;

/* 🔥 AQUÍ ESTÁ LA MAGIA REAL */
-webkit-mask-image: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200">\
<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="120" font-family="Roboto" font-weight="900">GARABATO CINE</text>\
</svg>');
-webkit-mask-repeat:no-repeat;
-webkit-mask-position:center;
-webkit-mask-size:80%;

mask-image: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200">\
<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="120" font-family="Roboto" font-weight="900">GARABATO CINE</text>\
</svg>');
mask-repeat:no-repeat;
mask-position:center;
mask-size:80%;

opacity:0;
}

/* ANIMACIONES */

.play .mask-layer{
animation:
fadeIn 1s forwards,
slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:.3s,1.8s;
}

.play #intro{
animation:fadeOut .4s forwards;
animation-delay:3.4s;
}

@keyframes fadeIn{to{opacity:1;}}

@keyframes slideLeft{
to{transform:translateX(-120%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* LOG LINE */

.descripcion{
background:#fff;
text-align:center;
padding:60px 20px;
}

.descripcion p{
font-weight:300;
letter-spacing:1px;
white-space:nowrap;
font-size:1rem;
}

/* RESPONSIVE */

@media(max-width:768px){

header{
height:70px;
padding:0 25px;
}

.hero{
margin-top:70px;
}

.intro-video{
top:70px;
}

.logo{font-size:1rem;}
.nav a{margin-left:15px;font-size:.75rem;}

.descripcion p{
font-size:.8rem;
}

.mask-layer{
-webkit-mask-size:120%;
mask-size:120%;
}

}

</style>
</head>

<body>

<header>
<div class="logo">Garabato Cine</div>
<div class="nav">
<a href="proyectos.html">Proyectos</a>
<a href="#">Nosotros</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
</div>
</header>

<!-- VIDEO FINAL -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<video class="intro-video" autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>

<div class="mask-layer"></div>

</div>

<!-- LOG LINE -->
<section class="descripcion">
<p>
Ficción con raíz local y mirada social, donde el realismo se quiebra en el imaginario vibrante del Caribe colombiano.
</p>
</section>

<script>

// autoplay seguro
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// activar intro
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

// failsafe
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},5000);

</script>

</body>
</html>
