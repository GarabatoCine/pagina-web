<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Roboto', sans-serif; overflow-x:hidden; }

/* ================= INTRO ================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
}

/* --- SVG (PRO REAL) --- */
#intro svg {
    width: 100%;
    height: 100%;
}

/* --- FALLBACK TEXTO --- */
.fallback {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.fallback .title {
    font-size:9vw;
    font-weight:900;
    white-space:nowrap;
    opacity:0;
}

.fallback .sub {
    font-size:0.8rem;
    letter-spacing:4px;
    opacity:0;
}

/* --- ANIMACIONES --- */

.play .grupo {
    animation:
        fadeIn 1.6s ease forwards,
        moveLeft 1.4s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 0.3s, 2s;
}

.play .fondo {
    animation: fadeOut 0.5s ease forwards;
    animation-delay: 3.4s;
}

/* fallback */
.play .fallback .title,
.play .fallback .sub {
    animation: fadeIn 1.6s ease forwards;
    animation-delay: 0.3s;
}

.play .fallback {
    animation: moveLeft 1.4s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 2s;
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

@keyframes moveLeft {
    to { transform: translateX(-140%); }
}

@keyframes fadeOut {
    to { opacity:0; visibility:hidden; }
}

/* ================= HEADER ================= */

header {
    position:fixed;
    top:0;
    width:100%;
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(15px);
}

.logo-txt {
    letter-spacing:4px;
    text-transform:uppercase;
    font-weight:300;
}

.nav a {
    margin-left:25px;
    font-size:0.65rem;
    text-decoration:none;
    color:#222;
}

.nav i { font-size:0.9rem; }

/* ================= PROYECTOS ================= */

.imagen-full { width:100%; height:auto; }

@media(min-width:1024px){
    .imagen-full{ height:100vh; object-fit:cover; }
}

.pie-proyecto {
    padding:20px 0 80px;
    text-align:center;
}

.pie-proyecto h2 {
    font-weight:300;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie-proyecto p {
    font-size:0.6rem;
    letter-spacing:3px;
    color:#999;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">

<!-- SVG PRO -->
<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
<defs>
<mask id="mask" maskUnits="userSpaceOnUse">
<rect width="1200" height="600" fill="white"/>
<g class="grupo" fill="black" text-anchor="middle">
<text x="600" y="270" font-size="110" font-weight="900">GARABATO CINE</text>
<text x="600" y="340" font-size="22" letter-spacing="4">COLOMBIA</text>
</g>
</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)" class="fondo"/>
</svg>

<!-- FALLBACK -->
<div class="fallback">
<div class="title">GARABATO CINE</div>
<div class="sub">COLOMBIA</div>
</div>

</div>

<!-- HEADER -->
<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- PROYECTOS -->
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Frontera</h2><p>Largometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Vida%20de%20colores.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Vida de Colores</h2><p>Serie</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Marimonda</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Calaguala</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Princesita</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Fracturas</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>
// scroll top SIEMPRE
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0,0);

// DETECCIÓN SEGURA SVG
function supportsSVGMask() {
  return typeof SVGMaskElement !== "undefined";
}

window.addEventListener("load", () => {

    window.scrollTo(0,0);

    // si NO soporta máscara → ocultar svg y usar fallback
    if (!supportsSVGMask()) {
        document.querySelector("svg").style.display = "none";
    } else {
        document.querySelector(".fallback").style.display = "none";
    }

    requestAnimationFrame(()=>{
        document.body.classList.add("play");
    });

    setTimeout(()=>{
        document.getElementById("intro")?.remove();
    }, 4200);

});
</script>

</body>
</html>
