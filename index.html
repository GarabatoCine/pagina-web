<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
}

/* --- FONDO --- */
.bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* --- INTRO --- */
#intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    opacity: 1;
}

/* estado inicial: sin animación */
#intro svg rect {
    opacity: 1;
}

/* SOLO cuando activamos */
.play .text-fade {
    animation: fadeIn 2.2s ease forwards;
    animation-delay: 0.8s;
}

.play .text-move {
    animation: moveLeft 1.2s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 4.2s;
}

.play .white-fade {
    animation: fadeWhite 0.9s ease forwards;
    animation-delay: 4.2s;
}

/* --- ANIMACIONES --- */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes moveLeft {
    to { transform: translateX(-120%); }
}

@keyframes fadeWhite {
    to { opacity: 0; visibility: hidden; }
}

</style>
</head>

<body>

<img class="bg" src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">

<div id="intro">

<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">

    <defs>
        <mask id="mask">
            <rect width="1000" height="600" fill="white"/>
            <g class="text-fade text-move">
                <text x="500" y="300"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-size="140"
                    font-weight="900"
                    font-family="Roboto, sans-serif"
                    fill="black">
                    GARABATO CINE
                </text>
            </g>
        </mask>
    </defs>

    <rect width="100%" height="100%" fill="white" mask="url(#mask)" class="white-fade"/>

</svg>

</div>

<script>
window.addEventListener("load", () => {
    // pequeño delay para asegurar visibilidad
    setTimeout(() => {
        document.body.classList.add("play");
    }, 200);
});
</script>

</body>
</html>
