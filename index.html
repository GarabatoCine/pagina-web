<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;font-family:'Roboto',sans-serif;}

/* HEADER */

header{
position:fixed;
top:0;
width:100%;
height:90px;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 60px;
z-index:1000;
}

.logo{letter-spacing:6px;font-size:1.2rem;}
.nav a{margin-left:30px;text-decoration:none;color:#000;font-size:.9rem;}

/* VIDEO REAL (PROPORCIÓN CORRECTA) */

.hero{
margin-top:90px;
background:#fff;
}

.hero video{
width:100%;
height:auto;
display:block;
}

/* INTRO */

#intro{
position:fixed;
inset:0;
z-index:9999;
background:#fff;
overflow:hidden;
}

/* SVG FULL */

#intro svg{
width:100%;
height:100%;
}

/* TEXTO */

.mask-text{
opacity:0;
}

/* ANIMACIONES */

.play .mask-text{
animation:
fadeIn 1.1s forwards,
moveUp 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:.3s,1.6s;
}

.play .white-layer{
animation:fadeOut .35s forwards;
animation-delay:3.2s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes moveUp{to{transform:translateY(-260%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* LOG LINE */

.descripcion{
background:#fff;
text-align:center;
padding:60px 20px;
}

.descripcion p{
white-space:nowrap;
font-size:1rem;
color:#000;
}

/* RESPONSIVE */

@media(max-width:768px){

header{
height:70px;
padding:0 25px;
}

.hero{
margin-top:70px;
}

.logo{font-size:1rem;}
.nav a{margin-left:15px;font-size:.75rem;}

.descripcion p{
font-size:.8rem;
}

}

</style>
</head>

<body>

<header>
<div class="logo">Garabato Cine</div>
<div class="nav">
<a href="proyectos.html">Proyectos</a>
<a href="#">Nosotros</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
</div>
</header>

<!-- VIDEO PRINCIPAL -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- INTRO REAL -->
<div id="intro">

<svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">

<defs>

<mask id="mask">

<!-- fondo blanco -->
<rect width="100%" height="100%" fill="white"/>

<!-- TEXTO recorta -->
<text x="50%" y="50%"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="120"
      font-weight="900"
      fill="black"
      class="mask-text">
GARABATO CINE
</text>

</mask>

</defs>

<!-- VIDEO DENTRO DE TEXTO -->
<foreignObject width="100%" height="100%" mask="url(#mask)">
<video autoplay muted loop playsinline
style="width:100%;height:100%;object-fit:cover;">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</foreignObject>

<!-- capa blanca -->
<rect width="100%" height="100%" fill="white" class="white-layer"/>

</svg>

</div>

<!-- LOG LINE -->
<section class="descripcion">
<p>
Ficción con raíz local y mirada social, donde el realismo se quiebra en el imaginario vibrante del Caribe colombiano.
</p>
</section>

<script>

// autoplay seguro
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// activar animación
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

// failsafe
setTimeout(()=>{
const intro=document.getElementById("intro");
if(intro) intro.style.display="none";
},5000);

</script>

</body>
</html>
