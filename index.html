<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;font-family:'Roboto',sans-serif;overflow:hidden;}

/* ===== VIDEO BASE (PROPORCIÓN SEGURA) ===== */
.video-base{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:0;
}

.video-base video{
width:100%;
height:auto;
max-height:100%;
object-fit:contain; /* 🔥 NUNCA se deforma */
}

/* ===== INTRO ===== */
#intro{
position:fixed;
inset:0;
background:#fff;
z-index:10;
overflow:hidden;
}

/* CONTENEDOR */
.intro-wrap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

/* TEXTO (SE USA PARA LA MÁSCARA) */
.intro-text{
font-weight:300;
letter-spacing:2px;
white-space:nowrap;
}

/* PRINCIPAL */
.intro-main{
font-size:10vw;
}

/* COLOMBIA */
.intro-sub{
margin-top:10px;
font-size:1.5vw;
letter-spacing:4px;
}

/* ===== CAPA MÁSCARA (REAL, ESTABLE) ===== */
.mask-layer{
position:absolute;
inset:0;
background:#fff;

/* máscara invertida */
-webkit-mask-image: 
linear-gradient(black,black),
url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">\
<text x="50%" y="45%" text-anchor="middle" font-size="120" font-family="Roboto" font-weight="300">GARABATO CINE</text>\
<text x="50%" y="75%" text-anchor="middle" font-size="30" font-family="Roboto" font-weight="300">COLOMBIA</text>\
</svg>');
-webkit-mask-composite: destination-out;
-webkit-mask-repeat:no-repeat;
-webkit-mask-position:center;
-webkit-mask-size:80%;

mask-image:
linear-gradient(black,black),
url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">\
<text x="50%" y="45%" text-anchor="middle" font-size="120" font-family="Roboto" font-weight="300">GARABATO CINE</text>\
<text x="50%" y="75%" text-anchor="middle" font-size="30" font-family="Roboto" font-weight="300">COLOMBIA</text>\
</svg>');
mask-composite: exclude;

opacity:0;
}

/* ===== ANIMACIONES ===== */

/* fade-in (3s como pediste) */
.play .mask-layer{
animation:
fadeIn 3s ease forwards,
slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:0.1s,3.2s;
}

/* desaparición */
.play #intro{
animation:fadeOut 0.35s ease forwards;
animation-delay:4.8s;
}

@keyframes fadeIn{
to{opacity:1;}
}

@keyframes slideLeft{
to{transform:translateX(-120%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){
.mask-layer{
-webkit-mask-size:120%;
mask-size:120%;
}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-base">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<div class="mask-layer"></div>
</div>

<script>

/* autoplay robusto */
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.playsInline=true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* activar animación */
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

/* failsafe (evita bloqueos) */
setTimeout(()=>{
const intro=document.getElementById("intro");
if(intro) intro.style.display="none";
},6000);

</script>

</body>
</html>
