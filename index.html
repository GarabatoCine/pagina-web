<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* VIDEO */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* HEADER */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 40px;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

.brand{
    font-weight:900;
    font-size:20px;
    cursor:pointer;
}

/* HAMBURGER */
.hamburger{
    width:28px;
    height:18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}

.hamburger span{
    height:2px;
    background:white;
    width:100%;
}

/* OVERLAY */
.cinema-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
}

.cinema-overlay.active{
    opacity:1;
    pointer-events:auto;
}

/* BACKDROP BLUR */
.cinema-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(14px);
}

/* CONTENT */
.cinema-content{
    position:relative;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.cinema-links{
    display:flex;
    flex-direction:column;
    gap:20px;
    text-align:center;
    font-family:Arial;
    text-transform:uppercase;
}

.cinema-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    letter-spacing:2px;
    opacity:0;
    transform:translateY(10px);
    transition:0.4s ease;
}

.cinema-overlay.active .cinema-links a{
    opacity:1;
    transform:translateY(0);
}

.cinema-overlay.active .cinema-links a:nth-child(1){transition-delay:0.1s;}
.cinema-overlay.active .cinema-links a:nth-child(2){transition-delay:0.15s;}
.cinema-overlay.active .cinema-links a:nth-child(3){transition-delay:0.2s;}
.cinema-overlay.active .cinema-links a:nth-child(4){transition-delay:0.25s;}
.cinema-overlay.active .cinema-links a:nth-child(5){transition-delay:0.3s;}

</style>
</head>

<body>

<header class="header">
    <div class="brand">GARABATO CINE</div>

    <div class="hamburger" id="hambBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<div class="cinema-overlay" id="cinemaMenu">
    <div class="cinema-backdrop"></div>

    <div class="cinema-content">
        <div class="cinema-links">
            <a href="#">CATÁLOGO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">PRÓXIMAMENTE</a>
            <a href="#">CONTACTO</a>
            <a href="#">INSTAGRAM</a>
        </div>
    </div>
</div>

<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {

    const btn = document.getElementById("hambBtn");
    const menu = document.getElementById("cinemaMenu");

    const sound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-fast-swoosh-transition-1497.mp3");
    sound.volume = 0.2;

    let open = false;

    btn.addEventListener("click", () => {

        open = !open;

        if(open){
            menu.classList.add("active");
            sound.currentTime = 0;
            sound.play().catch(()=>{});
        } else {
            menu.classList.remove("active");
        }

    });

});
</script>

</body>
</html>
