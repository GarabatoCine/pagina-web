<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #fff; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- CAPA DE INTRO (EL "HOYO" TRANSPARENTE) --- */
        #intro-definitiva {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999; /* Por encima de todo al inicio */
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: desaparecerIntro 0.8s ease-in forwards;
            animation-delay: 4s;
        }

        .mascara-svg {
            width: 90vw;
            height: auto;
            animation: animacionCaviar 4s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes animacionCaviar {
            0% { opacity: 0; transform: scale(0.95); }
            10% { opacity: 1; transform: scale(1); }
            80% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-150%); opacity: 0; }
        }

        @keyframes desaparecerIntro {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- HEADER ESTILO CAPTURA (FRANJA CRISTAL) --- */
        header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.6); /* Transparencia de la foto */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo-txt {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444; /* Gris de la foto */
        }

        .nav-derecha {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-derecha a {
            color: #444;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* --- CONTENIDO (TUS 6 PROYECTOS) --- */
        .contenedor-proyectos { width: 100%; }

        .proyecto { width: 100%; background: #fff; }

        .imagen-full {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        .pie-proyecto {
            padding: 80px 0 120px 0;
            text-align: center;
        }

        .pie-proyecto h2 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #111;
        }

        .pie-proyecto p {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="intro-definitiva">
        <svg class="mascara-svg" viewBox="0 0 1000 200">
            <defs>
                <mask id="maskCaviar">
                    <rect width="100%" height="100%" fill="white" />
                    <text x="50%" y="50%" text-anchor="middle" dy=".35em" 
                          font-size="120" font-weight="900" fill="black" 
                          style="letter-spacing: -4px;">GARABATO CINE!</text>
                </mask>
            </defs>
            <rect width="100%" height="100%" fill="white" mask="url(#maskCaviar)" />
        </svg>
    </div>

    <header>
        <div class="logo-txt">Garabato Cine</div>
        <div class="nav-derecha">
            <a href="#">About Us</a>
            <a href="#">Contact</a>
            <a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
        </div>
    </header>

    <div class="contenedor-proyectos">
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>La Frontera</h2><p>Largometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Vida%20de%20colores.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Vida de Colores</h2><p>Serie</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Marimonda</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Año Sabático</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>La Tortuga</h2><p>Cortometraje</p></div>
        </div>
    </div>

</body>
</html>
