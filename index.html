<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    *{margin:0;padding:0;box-sizing:border-box;}

    html, body{
        width:100%;
        height:100%;
        background:#000;
        overflow:hidden;
        font-family:Arial, Helvetica, sans-serif;
    }

    /* VIDEO: Optimizado para iPad */
    .video{
        position:fixed;
        inset:0;
        z-index:0;
        background:#000;
    }

    .video video{
        width:100%;
        height:100%;
        object-fit:cover;
    }

    /* INTRO */
    #intro{
        position:fixed;
        inset:0;
        z-index:1000;
        background: transparent;
        pointer-events:none;
    }

    svg{
        width:100%;
        height:100%;
        display:block;
    }

    /* FIX LETRAS: No se desbordan en iPad */
    text.big{
        font-weight:900;
        font-size: clamp(35px, 6.5vw, 80px); 
        font-family:Arial, Helvetica, sans-serif;
    }

    text.small{
        font-weight:700;
        font-size: clamp(10px, 1.5vw, 14px);
        letter-spacing:5px;
    }

    .mask-group{
        transform-box:fill-box;
        transform-origin:center;
    }

    .play .mask-group{
        animation:slideLeft 1.4s cubic-bezier(.76,0,.24,1) forwards;
        animation-delay:1s;
    }

    @keyframes slideLeft{
        to{transform:translateX(-180vw);} 
    }

    .fade{
        opacity:0;
        transition:opacity 0.5s ease-out;
    }

    /* HEADER */
    .header{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        z-index:200;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:30px 50px;
        color:white;
        text-transform:uppercase;
        font-family:'Sora', sans-serif;
        opacity:0;
        animation: fadeInHeader 0.8s ease forwards;
        animation-delay: 2.2s;
    }

    @keyframes fadeInHeader { to { opacity: 1; } }

    .brand{ font-weight:700; font-size:22px; letter-spacing:2px; cursor:pointer; }
    .nav{ display:flex; gap:26px; align-items:center; font-size:14px; }
    .nav a{ color:white; text-decoration:none; opacity:0.8; }
    .hamburger{ display:none; width:28px; height:18px; flex-direction:column; justify-content:space-between; cursor:pointer; }
    .hamburger span{ height:2px; background:white; width:100%; }

    .menu{
        position:fixed; top:75px; right:25px; width:220px;
        background:rgba(0,0,0,0.92); backdrop-filter:blur(15px);
        border-radius:12px; padding:20px; display:flex; flex-direction:column;
        gap:15px; opacity:0; transform:translateY(-10px);
        transition:0.3s ease; z-index:150; pointer-events:none;
    }
    .menu.active{ opacity:1; transform:translateY(0); pointer-events:auto; }

    @media (max-width:1024px){
        .nav{display:none;}
        .hamburger{display:flex;}
        .header{padding:25px 30px;}
        text.big { font-size: 55px; } /* Forzado para iPad */
    }
</style>
</head>

<body>

<div class="video">
    <video id="bgVideo" autoplay muted loop playsinline webkit-playsinline preload="auto" muted="true">
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
    </video>
</div>

<div id="intro">
    <svg viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid slice">
        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>
                <g class="mask-group">
                    <text x="50%" y="48%" text-anchor="middle" class="big" fill="black">GARABATO CINE</text>
                    <text x="50%" y="55%" text-anchor="middle" class="small" fill="black">COLOMBIA</text>
                </g>
            </mask>
        </defs>
        <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<header class="header">
    <div class="brand" id="logoBtn">GARABATO CINE</div>
    <nav class="nav">
        <a href="#">CATÁLOGO</a>
        <a href="#">NOSOTROS</a>
        <a href="#">PRÓXIMAMENTE</a>
        <a href="#">CONTACTO</a>
    </nav>
    <div class="hamburger" id="hambBtn"><span></span><span></span><span></span></div>
</header>

<div class="menu" id="menu">
    <a href="#">CATÁLOGO</a><a href="#">NOSOTROS</a><a href="#">PRÓXIMAMENTE</a><a href="#">CONTACTO</a>
</div>

<script>
    const video = document.getElementById('bgVideo');

    // Forzar inicio sin interacción
    function bootVideo() {
        video.muted = true;
        video.play();
    }

    function startIntro(){
        const intro = document.getElementById("intro");
        document.body.classList.remove("play");
        intro.style.display="block";
        intro.classList.remove("fade");

        // Intentar arrancar el video varias veces en milisegundos clave
        bootVideo();
        setTimeout(bootVideo, 100);
        setTimeout(bootVideo, 500);

        setTimeout(()=>{
            document.body.classList.add("play");
        }, 150);

        setTimeout(()=>{
            intro.classList.add("fade");
            setTimeout(()=>{ intro.style.display="none"; }, 500);
        }, 2800);
    }

    // Iniciar todo
    window.addEventListener("load", startIntro);
    // Un intento extra por si el iPad es lento cargando el archivo
    document.addEventListener("DOMContentLoaded", bootVideo);

    const btn = document.getElementById("hambBtn");
    const menu = document.getElementById("menu");
    btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        menu.classList.toggle("active");
    });
    document.addEventListener("click", () => menu.classList.remove("active"));
    document.getElementById("logoBtn").addEventListener("click", startIntro);
</script>

</body>
</html>
