<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;overflow:hidden;}

/* VIDEO */
.video{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
z-index:0;
}

.video video{
width:100%;
height:auto;
max-height:100%;
object-fit:contain;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:10;
}

/* SVG FULL */
svg{
width:100%;
height:100%;
display:block;
}

/* ANIMACIONES */
.play .mask-group{
animation:slide 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3s;
}

.play #intro{
animation:fadeOut 0.4s ease forwards;
animation-delay:4.6s;
}

.play .fade{
animation:fadeIn 3s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes slide{
to{transform:translateX(-140%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* RESPONSIVE */
@media(max-width:768px){
text.main{font-size:10vw;}
text.sub{font-size:3vw;}
}

</style>
</head>

<body>

<!-- VIDEO NUEVO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask" x="0" y="0" width="100%" height="100%">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group fade">

<!-- 🔥 TAMAÑO AJUSTADO -->
<text x="50" y="48"
text-anchor="middle"
font-size="8"
font-family="Arial, Helvetica, sans-serif"
font-weight="900"
fill="black"
class="main">
GARABATO CINE
</text>

<!-- 🔥 COLOMBIA MÁS PEQUEÑO -->
<text x="50" y="60"
text-anchor="middle"
font-size="2"
font-family="Arial, Helvetica, sans-serif"
font-weight="700"
fill="black"
class="sub">
COLOMBIA
</text>

</g>

</mask>
</defs>

<!-- CORTINA -->
<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

/* autoplay robusto */
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* animación */
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

/* failsafe */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},6000);

</script>

</body>
</html>
