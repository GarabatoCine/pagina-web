<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* ===================== */
/* BLANCO (CONTROL REAL) */
/* ===================== */
.white-bg{
position:fixed;
inset:0;
background:white;
z-index:5;
opacity:1;
will-change:opacity;
backface-visibility:hidden;
}

/* fade controlado por JS */
.white-bg.fade{
animation: fadeOut 0.5s ease forwards;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
position:fixed;
inset:0;
z-index:10;
}

svg{
width:100%;
height:100%;
display:block;
}

/* ===================== */
/* LOGO */
/* ===================== */
.mask-group{
transform-box: fill-box;
transform-origin: center;
animation: slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:2.5s;
}

/* ===================== */
/* TEXTO */
/* ===================== */
text.big{
font-family: Arial, Helvetica, sans-serif;
font-weight:900;
font-size: clamp(28px, 6vw, 58px);
}

text.small{
font-family: Arial, Helvetica, sans-serif;
font-weight:700;
font-size: clamp(10px, 2vw, 14px);
letter-spacing:2px;
}

/* ===================== */
/* KEYFRAMES */
/* ===================== */
@keyframes slideLeft{
to{
transform:translateX(-200%);
}
}

@keyframes fadeOut{
to{
opacity:0;
visibility:hidden;
}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- BLANCO -->
<div class="white-bg"></div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">

<g class="mask-group" id="logoGroup">

<text x="700" y="240"
text-anchor="middle"
class="big">
GARABATO CINE
</text>

<text x="700" y="285"
text-anchor="middle"
class="small">
COLOMBIA
</text>

</g>

</svg>

</div>

<script>

/* video autoplay */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* ===================== */
/* 🔥 SINCRONIZACIÓN CINEMATOGRÁFICA */
/* ===================== */

const logo = document.getElementById("logoGroup");
const white = document.querySelector(".white-bg");

window.addEventListener("load",()=>{

document.body.classList.add("play");

/* cuando empieza el movimiento del logo */
logo.addEventListener("animationstart",(e)=>{

if(e.animationName === "slideLeft"){

/* 🔥 aquí ocurre la magia:
   apagamos el blanco ligeramente antes del movimiento perceptual */
setTimeout(()=>{
white.classList.add("fade");
}, 200); // micro ajuste cinematográfico estable

}

});

});

</script>

</body>
</html>
