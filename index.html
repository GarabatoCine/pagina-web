<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            font-family: 'Helvetica', 'Arial', sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        /* --- INTRO GARABATO (MÁSCARA INVISIBLE) --- */
        #capa-intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background-color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            animation: fadeOutIntro 0.6s ease-in forwards;
            animation-delay: 4.5s;
        }

        .svg-texto {
            width: 95vw; /* Texto gigante */
            height: auto;
            animation: moverIzquierda 4.5s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes moverIzquierda {
            0% { opacity: 0; transform: translateX(0); }
            15% { opacity: 1; transform: translateX(0); } /* Quieto en el centro */
            75% { transform: translateX(0); opacity: 1; } /* Pausa para ver el cine */
            100% { transform: translateX(-180%); opacity: 0; } /* Sale a la izquierda */
        }

        @keyframes fadeOutIntro {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- MENÚ INFERIOR ESTILO QUIDDITY --- */
        header {
            position: fixed;
            bottom: 0; /* Menú abajo */
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: transparent;
        }

        .marca-footer {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav.menu-footer {
            display: flex;
            gap: 25px;
        }

        nav.menu-footer a {
            color: #fff;
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        nav.menu-footer a:hover {
            opacity: 1;
        }

        /* --- CONTENIDO VISUAL --- */
        .contenedor-cine {
            width: 100%;
        }

        .bloque-proyecto {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .imagen-principal {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }

        .info-proyecto {
            padding: 40px 0 80px 0;
            text-align: center;
            width: 100%;
            background: #000;
        }

        .info-proyecto h2 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .info-proyecto p {
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: #888;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="capa-intro">
        <svg class="svg-texto" viewBox="0 0 1200 200">
            <defs>
                <mask id="hoyoTexto">
                    <rect width="100%" height="100%" fill="white" />
                    <text x="50%" y="50%" text-anchor="middle" dy=".35em" 
                          font-size="140" font-weight="900" fill="black" 
                          style="letter-spacing: -5px;">GARABATO CINE!</text>
                </mask>
            </defs>
            <rect width="100%" height="100%" fill="white" mask="url(#hoyoTexto)" />
        </svg>
    </div>

    <header>
        <div class="marca-footer">Garabato Cine</div>
        <nav class="menu-footer">
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
        </nav>
    </header>

    <div class="contenedor-cine">
        <div class="bloque-proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-principal">
            <div class="info-proyecto">
                <h2>La Frontera</h2>
                <p>Largometraje</p>
            </div>
        </div>

        <div class="bloque-proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Vida%20de%20colores.jpg?raw=true" class="imagen-principal">
            <div class="info-proyecto">
                <h2>Vida de Colores</h2>
                <p>Serie</p>
            </div>
        </div>
    </div>

</body>
</html>
