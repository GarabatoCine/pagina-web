<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
    font-family: 'Roboto', sans-serif;
    overflow-x: hidden;
}

/* ================= INTRO ================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: white;
}

/* TEXTO (FALLBACK SEGURO) */
.intro-text {
    position: absolute;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;

    font-weight: 900;
    letter-spacing: -0.05em;
    text-transform: uppercase;

    font-size: 10vw;

    /* 🔥 transparencia estable */
    background-image: url("https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true");
    background-size: cover;
    background-position: center;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    opacity: 0;
}

/* tablet */
@media (max-width:1024px){
    .intro-text{
        font-size: 12vw;
    }
}

/* móvil */
@media (max-width:600px){
    .intro-text{
        font-size: 14vw;
    }
}

/* ANIMACIÓN */
.play .intro-text {
    animation: fadeIn 1.2s ease forwards,
               moveLeft 1s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 0.3s, 1.3s;
}

.play #intro {
    animation: fadeOut 0.8s ease forwards;
    animation-delay: 1.3s;
}

@keyframes fadeIn {
    from { opacity:0; }
    to { opacity:1; }
}

@keyframes moveLeft {
    to { transform: translate(-120%, -50%); }
}

@keyframes fadeOut {
    to { opacity:0; visibility:hidden; }
}

/* ================= HEADER ================= */

header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;

    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(15px);
}

.logo-txt {
    font-size: 0.9rem;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.nav a {
    margin-left: 25px;
    text-decoration: none;
    font-size: 0.65rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #222;
}

.nav i {
    font-size: 0.9rem;
}

/* ================= PROYECTOS ================= */

.imagen-full {
    width:100%;
    height:auto;
}

@media (min-width:1024px){
    .imagen-full{
        height:100vh;
        object-fit:cover;
    }
}

.pie-proyecto {
    padding:20px 0 80px;
    text-align:center;
    background:#fff;
}

.pie-proyecto h2 {
    font-size:1.4rem;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie-proyecto p {
    font-size:0.6rem;
    letter-spacing:3px;
    color:#999;
}

</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">
    <div class="intro-text">GARABATO CINE</div>
</div>

<!-- ================= HEADER ================= -->
<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- ================= PROYECTOS ================= -->

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Frontera</h2><p>Largometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Vida%20de%20colores.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Vida de Colores</h2><p>Serie</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Marimonda</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Calaguala</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Princesita</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Fracturas</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>
// 🔥 SIEMPRE iniciar arriba
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0,0);

window.addEventListener("load", () => {

    window.scrollTo(0,0);

    document.body.classList.add("play");

    setTimeout(() => {
        const intro = document.getElementById("intro");
        if (intro) intro.remove();
    }, 2200);

});
</script>

</body>
</html>
