<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* ===================== */
/* 🔥 NUEVO: FONDO BLANCO REAL (CONTROL TOTAL) */
/* ===================== */
.white-bg{
position:fixed;
inset:0;
background:white;
z-index:5;
opacity:1;
animation: fadeOut 0.5s ease 2.3s forwards;
}

/* ===================== */
/* INTRO (LOGO SOLO) */
/* ===================== */
#intro{
position:fixed;
inset:0;
z-index:10;
display:flex;
align-items:center;
justify-content:center;
}

svg{
width:100%;
height:auto;
max-width:900px;
}

/* ===================== */
/* LOGO ANIMACIÓN */
/* ===================== */
.mask-group{
transform-box: fill-box;
transform-origin: center;
animation: slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:2.5s;
}

/* ===================== */
/* TEXTO */
/* ===================== */
text.big{
font-family: Arial, Helvetica, sans-serif;
font-weight:900;
font-size: clamp(28px, 6vw, 58px);
}

text.small{
font-family: Arial, Helvetica, sans-serif;
font-weight:700;
font-size: clamp(10px, 2vw, 14px);
letter-spacing:2px;
}

/* ===================== */
/* KEYFRAMES */
/* ===================== */
@keyframes slideLeft{
to{transform:translateX(-200%);}
}

@keyframes fadeOut{
to{
opacity:0;
visibility:hidden;
}
}

/* ===================== */
/* TABLET */
/* ===================== */
@media (max-width: 1024px){

text.big{
font-size: clamp(20px, 5vw, 38px);
}

text.small{
font-size: clamp(9px, 2.2vw, 12px);
letter-spacing:1.3px;
}

}

/* ===================== */
/* MOBILE */
/* ===================== */
@media (max-width: 768px){

svg{
max-width: 90%;
}

}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- 🔥 FONDO BLANCO REAL -->
<div class="white-bg"></div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 1400 500">

<g class="mask-group">

<text x="700" y="240"
text-anchor="middle"
class="big">
GARABATO CINE
</text>

<text x="700" y="285"
text-anchor="middle"
class="small">
COLOMBIA
</text>

</g>

</svg>

</div>

<script>

/* autoplay */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

</script>

</body>
</html>
