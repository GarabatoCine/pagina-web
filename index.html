<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<!-- Tipografía gruesa como antes -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;font-family:'Roboto',sans-serif;overflow:hidden;}

/* ===== VIDEO BASE (DETRÁS, PROPORCIÓN REAL) ===== */
.video-base{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:0;
}
.video-base video{
width:100%;
height:auto;
max-height:100%;
object-fit:contain; /* no se deforma */
display:block;
}

/* ===== INTRO (CORTINA BLANCA) ===== */
#intro{
position:fixed;
inset:0;
z-index:10;
overflow:hidden;
}

/* CAPA BLANCA QUE SE PERFORA CON TEXTO (MÁSCARA REAL) */
.white-layer{
position:absolute;
inset:0;
background:#fff;

/* máscara: texto = hueco (se ve el video debajo) */
-webkit-mask-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300'>\
<rect width='100%' height='100%' fill='white'/>\
<text x='50%' y='48%' text-anchor='middle' font-family='Roboto' font-weight='900' font-size='140' fill='black'>GARABATO CINE</text>\
<text x='50%' y='75%' text-anchor='middle' font-family='Roboto' font-weight='900' font-size='36' fill='black'>COLOMBIA</text>\
</svg>");
-webkit-mask-repeat:no-repeat;
-webkit-mask-position:center;
-webkit-mask-size:100% auto;
-webkit-mask-composite: xor; /* perfora el blanco */

mask-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300'>\
<rect width='100%' height='100%' fill='white'/>\
<text x='50%' y='48%' text-anchor='middle' font-family='Roboto' font-weight='900' font-size='140' fill='black'>GARABATO CINE</text>\
<text x='50%' y='75%' text-anchor='middle' font-family='Roboto' font-weight='900' font-size='36' fill='black'>COLOMBIA</text>\
</svg>");
mask-repeat:no-repeat;
mask-position:center;
mask-size:100% auto;
mask-composite: exclude;

opacity:0;
}

/* ===== ANIMACIÓN ===== */

/* Fade-in lento (3s) del “hueco” */
.play .white-layer{
animation:
fadeIn 3s ease forwards,
slideLeft 1.5s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:0.05s,3.1s;
}

/* Desaparece la cortina blanca (no se mueve) */
.play #intro{
animation:fadeOut 0.35s ease forwards;
animation-delay:4.7s;
}

@keyframes fadeIn{ to{opacity:1;} }
@keyframes slideLeft{ to{transform:translateX(-120%);} }
@keyframes fadeOut{ to{opacity:0;visibility:hidden;} }

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
.white-layer{
-webkit-mask-size:130% auto;
mask-size:130% auto;
}
}
</style>
</head>

<body>

<!-- VIDEO (DEBAJO) -->
<div class="video-base">
  <video autoplay muted loop playsinline>
    <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
  </video>
</div>

<!-- CORTINA -->
<div id="intro">
  <div class="white-layer"></div>
</div>

<script>
// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
  v.muted = true;
  v.playsInline = true;
  v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart",()=>{
  document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// iniciar animación
window.addEventListener("load",()=>{
  document.body.classList.add("play");
});

// failsafe
setTimeout(()=>{
  const intro=document.getElementById("intro");
  if(intro) intro.style.display="none";
},6000);
</script>

</body>
</html>
