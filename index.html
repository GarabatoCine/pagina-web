<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family: Arial, Helvetica, sans-serif;
}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:10;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

/* TEXTO GRANDE */
.intro-title{
font-weight:900;
font-size: clamp(60px, 8vw, 120px);
color:black;

/* 🔥 EFECTO “FALSO TRANSPARENTE” */
mix-blend-mode: multiply;
}

.intro-sub{
font-weight:700;
font-size: clamp(12px, 2vw, 16px);
letter-spacing:3px;
margin-top:10px;
}

/* ANIMACIÓN IZQUIERDA */
.move{
animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
}

@keyframes slideLeft{
to{
transform:translateX(-120vw);
}
}

/* DESAPARECER */
.fade{
opacity:0;
transition:opacity 0.1s linear;
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<div class="intro-title">GARABATO CINE</div>
<div class="intro-sub">COLOMBIA</div>
</div>

<script>

/* INTRO ROBUSTA */
function startIntro(){

const intro = document.getElementById("intro");
const title = document.querySelector(".intro-title");
const sub = document.querySelector(".intro-sub");

/* TIEMPO DE ESPERA */
setTimeout(()=>{
title.classList.add("move");
sub.classList.add("move");
},2000);

/* DESAPARECER */
setTimeout(()=>{
intro.classList.add("fade");

setTimeout(()=>{
intro.style.display="none";
},120);

},3200);

}

window.addEventListener("load", startIntro);

</script>

</body>
</html>
