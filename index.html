<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;font-family:'Roboto',sans-serif;overflow:hidden;}

/* VIDEO BASE */
.video-base{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:0;
}

.video-base video{
width:100%;
height:auto;
max-height:100%;
object-fit:contain;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:#fff;
z-index:10;
overflow:hidden;
}

/* TEXTO (MÁSCARA REAL FUNCIONAL) */
.intro-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:100%;
text-align:center;
font-size:12vw;
font-weight:900;
white-space:nowrap;

/* 🔥 CLAVE: transparencia real estable */
background:transparent;
color:transparent;
-webkit-text-stroke:0 transparent;

/* esto sí funciona cross-browser */
background-clip:text;
-webkit-background-clip:text;

/* usamos el video como fondo del texto */
background-image:url("https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif"); /* fallback */
mix-blend-mode:multiply;

opacity:0;
}

/* COLOMBIA */
.intro-sub{
position:absolute;
top:65%;
left:50%;
transform:translateX(-50%);
font-size:2vw;
font-weight:900;
letter-spacing:4px;
color:transparent;
opacity:0;
}

/* ANIMACIÓN */

.play .intro-text,
.play .intro-sub{
animation:fadeIn 3s ease forwards;
animation-delay:0.2s;
}

.play .intro-text{
animation:
fadeIn 3s ease forwards,
slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:0.2s,3.2s;
}

.play .intro-sub{
animation:
fadeIn 3s ease forwards,
slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:0.2s,3.2s;
}

.play #intro{
animation:fadeOut 0.35s ease forwards;
animation-delay:4.8s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes slideLeft{
to{transform:translate(-180%,-50%);}
}
@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* RESPONSIVE */
@media(max-width:768px){
.intro-text{font-size:16vw;}
.intro-sub{font-size:4vw;}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-base">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<div class="intro-text">GARABATO CINE</div>
<div class="intro-sub">COLOMBIA</div>
</div>

<script>

// autoplay seguro
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// animación
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

// failsafe
setTimeout(()=>{
const intro=document.getElementById("intro");
if(intro) intro.style.display="none";
},6000);

</script>

</body>
</html>
