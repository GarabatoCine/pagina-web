<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    font-family: 'Roboto', sans-serif;
    background: #000;
}

/* --- FONDO --- */
.bg-media {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* --- INTRO CON MÁSCARA --- */
#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;

    /* blanco pero con hueco */
    background: #fff;

    /* 💥 MÁSCARA REAL */
    -webkit-mask: url(#mask-text);
    mask: url(#mask-text);

    animation: slideOut 1.2s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    animation-delay: 4.5s; /* más tiempo antes de deslizar */
}

/* --- SVG invisible que define la máscara --- */
svg {
    position: absolute;
    width: 0;
    height: 0;
}

/* --- TEXTO (solo para animar opacidad visual) --- */
.texto {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);

    font-size: 11vw;
    font-weight: 900;
    letter-spacing: -0.05em;
    text-transform: uppercase;

    color: transparent; /* no se ve, solo referencia */

    opacity: 0;
    animation: fadeIn 2.5s ease forwards;
    animation-delay: 1s; /* ⏳ más lento como pediste */
}

/* --- ANIMACIONES --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes slideOut {
    to {
        transform: translateX(-100%);
        visibility: hidden;
    }
}

/* --- CONTENIDO --- */
.contenido {
    position: relative;
    z-index: 2;
}

.seccion {
    height: 100vh;
}

</style>
</head>

<body>

<!-- IMAGEN DE FONDO -->
<img 
class="bg-media" 
src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true"
/>

<!-- SVG MASK -->
<svg>
    <defs>
        <mask id="mask-text">
            <!-- fondo visible -->
            <rect width="100%" height="100%" fill="white"/>
            
            <!-- texto = hueco -->
            <text x="50%" y="50%" dy=".35em"
                text-anchor="middle"
                font-size="140"
                font-weight="900"
                font-family="Roboto, sans-serif"
                fill="black">
                GARABATO CINE
            </text>
        </mask>
    </defs>
</svg>

<!-- INTRO -->
<div id="intro">
    <div class="texto">GARABATO CINE</div>
</div>

<!-- CONTENIDO -->
<div class="contenido">
    <div class="seccion"></div>
</div>

</body>
</html>
