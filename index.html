<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#fff;}

/* HEADER */

header{
position:fixed;
top:0;
width:100%;
height:90px;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 60px;
z-index:1000;
}

.logo{letter-spacing:6px;font-size:1.2rem;}
.nav a{margin-left:30px;text-decoration:none;color:#000;font-size:.9rem;}

/* VIDEO PRINCIPAL (PROPORCIÓN REAL) */

.hero{
margin-top:90px;
background:#fff;
}

.hero video{
width:100%;
height:auto;
display:block;
}

/* ================= INTRO ================= */

#intro{
position:fixed;
inset:0;
z-index:9999;
background:#fff;
overflow:hidden;
}

/* VIDEO DE FONDO PARA LAS LETRAS */

.intro-video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

/* TEXTO TRANSPARENTE */

.intro-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:9vw;
font-weight:900;
letter-spacing:-2px;
white-space:nowrap;

/* 🔥 TRANSPARENCIA REAL */
color:#fff;
mix-blend-mode:screen;

opacity:0;
}

/* ANIMACIÓN */

.play .intro-text{
animation:
fadeIn 1s forwards,
moveUp 1.5s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:.3s,1.6s;
}

.play #intro{
animation:fadeOut .4s forwards;
animation-delay:3.2s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes moveUp{to{transform:translate(-50%,-250%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* LOG LINE */

.descripcion{
background:#fff;
text-align:center;
padding:60px 20px;
}

.descripcion p{
white-space:nowrap;
font-size:1rem;
color:#000;
}

/* RESPONSIVE */

@media(max-width:768px){

header{
height:70px;
padding:0 25px;
}

.hero{
margin-top:70px;
}

.logo{font-size:1rem;}
.nav a{margin-left:15px;font-size:.75rem;}

.descripcion p{
font-size:.8rem;
}

}

</style>
</head>

<body>

<header>
<div class="logo">Garabato Cine</div>
<div class="nav">
<a href="proyectos.html">Proyectos</a>
<a href="#">Nosotros</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
</div>
</header>

<!-- VIDEO FINAL -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<video class="intro-video" autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>

<div class="intro-text">GARABATO CINE</div>

</div>

<!-- LOG LINE -->
<section class="descripcion">
<p>
Ficción con raíz local y mirada social, donde el realismo se quiebra en el imaginario vibrante del Caribe colombiano.
</p>
</section>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// activar intro SIEMPRE
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

// failsafe
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},5000);

</script>

</body>
</html>
