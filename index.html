<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;overflow-x:hidden;}

/* ================= HERO VIDEO ================= */

.hero{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    transition:opacity 0.4s ease;
}

.hero video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro svg{
    width:100%;
    height:100%;
}

svg text{
    dominant-baseline:middle;
}

.mask-group{
    opacity:0;
}

.play .mask-group{
    animation:
        fadeIn 1.6s ease forwards,
        moveLeft 1.3s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay:0.3s,2s;
}

.play .white-bg{
    animation:fadeOut 0.35s ease forwards;
    animation-delay:3.2s;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes moveLeft{
    to{transform:translateX(-140%);}
}

@keyframes fadeOut{
    to{opacity:0;visibility:hidden;}
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    z-index:1000;

    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(15px);
}

.logo-txt{
    letter-spacing:4px;
    text-transform:uppercase;
    font-weight:300;
}

.nav a{
    margin-left:25px;
    font-size:0.65rem;
    text-decoration:none;
    color:#222;
}

.nav i{font-size:0.9rem;}

/* ================= MEDIA (IMAGEN / VIDEO) ================= */

.media-full{
    width:100%;
    height:auto;
    display:block;
}

@media(min-width:1024px){
    .media-full{
        height:100vh;
        object-fit:cover;
    }
}

/* ================= TEXTOS ================= */

.pie-proyecto{
    padding:20px 0 80px;
    text-align:center;
}

.pie-proyecto h2{
    font-weight:300;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie-proyecto p{
    font-size:0.6rem;
    letter-spacing:3px;
    color:#999;
}

</style>
</head>

<body>

<!-- HERO VIDEO (INTRO) -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group" fill="black" text-anchor="middle">

<text x="600" y="280"
font-size="clamp(60px, 10vw, 110px)"
font-weight="900">
GARABATO CINE
</text>

<text x="600" y="340"
font-size="clamp(14px, 2vw, 22px)"
letter-spacing="4">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)" class="white-bg"/>

</svg>
</div>

<!-- HEADER -->
<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- PROYECTOS -->

<!-- LA FRONTERA -->
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>La Frontera</h2><p>Largometraje</p></div>

<!-- VIDA DE COLORES (VIDEO) -->
<video autoplay muted loop playsinline class="media-full">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4" type="video/mp4">
</video>
<div class="pie-proyecto"><h2>Vida de Colores</h2><p>Serie</p></div>

<!-- RESTO -->
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>Marimonda</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>Calaguala</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true" class="media-full">
<div class="pie-proyecto"><h2>La Princesita</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>Fracturas</h2><p>Cortometraje</p></div>

<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true" class="media-full">
<div class="pie-proyecto"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>
// SCROLL ARRIBA SIEMPRE
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0,0);

window.addEventListener("load", () => {

    window.scrollTo(0,0);

    requestAnimationFrame(()=>{
        document.body.classList.add("play");
    });

    setTimeout(()=>{
        document.getElementById("intro")?.remove();
        document.querySelector(".hero").style.opacity = "0";
    }, 3600);

});
</script>

</body>
</html>
