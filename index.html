<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
}

/* --- FONDO --- */
.bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* --- INTRO WRAPPER --- */
#intro {
    position: fixed;
    inset: 0;
    z-index: 10;
}

/* --- SVG FULLSCREEN --- */
#maskSVG {
    width: 100%;
    height: 100%;
    display: block;
}

/* --- ANIMACIONES CONTROLADAS --- */
.text-fade {
    opacity: 0;
    animation: fadeIn 2.2s ease forwards;
    animation-delay: 0.8s;
}

.text-move {
    animation: moveLeft 1.2s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 4.2s;
}

.white-fade {
    animation: fadeWhite 0.9s ease forwards;
    animation-delay: 4.2s;
}

/* --- KEYFRAMES --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes moveLeft {
    to { transform: translateX(-120%); }
}

@keyframes fadeWhite {
    to { opacity: 0; }
}

/* --- TEXTO RESPONSIVE --- */
@media (max-width: 1024px) {
    .mask-text {
        font-size: 110px;
    }
}

@media (max-width: 768px) {
    .mask-text {
        font-size: 80px;
    }
}

@media (max-width: 480px) {
    .mask-text {
        font-size: 55px;
    }
}

</style>
</head>

<body>

<!-- FONDO -->
<img class="bg" src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">

<!-- INTRO -->
<div id="intro">

<svg id="maskSVG" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">

    <defs>
        <mask id="textMask" maskUnits="userSpaceOnUse">

            <!-- Fondo visible -->
            <rect width="1000" height="600" fill="white"/>

            <!-- TEXTO = HUECO -->
            <g class="text-fade text-move">
                <text
                    x="500"
                    y="300"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    class="mask-text"
                    font-weight="900"
                    font-family="Roboto, sans-serif"
                    fill="black">
                    GARABATO CINE
                </text>
            </g>

        </mask>
    </defs>

    <!-- Capa blanca con hueco -->
    <rect 
        width="100%" 
        height="100%" 
        fill="white" 
        mask="url(#textMask)" 
        class="white-fade"
    />

</svg>

</div>

</body>
</html>
