<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    font-family: 'Roboto', sans-serif;
    overflow-x: hidden;
}

/* ================= INTRO ================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
}

#intro svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* 🎬 TIMING TIPO CAVIAR */
.play .fade {
    animation: fadeIn 1.4s ease forwards;
}

.play .move {
    animation: moveLeft 0.9s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 1.6s;
}

.play .white {
    animation: fadeOut 0.7s ease forwards;
    animation-delay: 1.6s;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes moveLeft {
    to { transform: translateX(-120%); }
}

@keyframes fadeOut {
    to { opacity: 0; }
}

/* ================= HEADER ================= */

header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;

    background-color: rgba(255,255,255,0.6);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.logo-txt {
    font-size: 0.9rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.nav a {
    margin-left: 25px;
    text-decoration: none;
    font-size: 0.65rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #222;
}

/* ================= PROYECTOS ================= */

.contenedor-proyectos {
    width: 100%;
}

.proyecto {
    display: flex;
    flex-direction: column;
}

/* 🔥 SOLUCIÓN: NO MÁS IMÁGENES CORTADAS */
.imagen-full {
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* en desktop mantenemos impacto */
@media (min-width: 1024px) {
    .imagen-full {
        height: 100vh;
        object-fit: cover;
    }
}

.pie-proyecto {
    padding: 20px 0 80px 0;
    text-align: center;
    background: #fff;
}

.pie-proyecto h2 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.pie-proyecto p {
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: #999;
    text-transform: uppercase;
}

/* ================= TEXTO INTRO RESPONSIVE ================= */

@media (max-width: 1024px) {
    #intro svg {
        transform: scale(0.7);
    }
}

@media (max-width: 600px) {
    #intro svg {
        transform: scale(0.5);
    }
}

</style>
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro">
<svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">

<defs>
<mask id="textMask" maskUnits="userSpaceOnUse">
<rect width="1200" height="600" fill="white"/>

<g class="fade move">
<text x="600" y="300"
text-anchor="middle"
dominant-baseline="middle"
font-size="120"
font-weight="900"
font-family="Roboto, sans-serif"
fill="black">
GARABATO CINE
</text>
</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#textMask)" class="white"/>

</svg>
</div>

<!-- ================= HEADER ================= -->
<header>
    <div class="logo-txt">Garabato Cine</div>
    <div class="nav">
        <a href="#">About Us</a>
        <a href="#">Contact</a>
        <a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
    </div>
</header>

<!-- ================= PROYECTOS ================= -->
<div class="contenedor-proyectos">

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Frontera</h2><p>Largometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Vida%20de%20colores.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Vida de Colores</h2><p>Serie</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Marimonda</h2><p>Cortometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Año Sabático</h2><p>Cortometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Calaguala</h2><p>Cortometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Princesita</h2><p>Cortometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>Fracturas</h2><p>Cortometraje</p></div>
</div>

<div class="proyecto">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true" class="imagen-full">
<div class="pie-proyecto"><h2>La Tortuga</h2><p>Cortometraje</p></div>
</div>

</div>

<script>
window.addEventListener("load", () => {

    setTimeout(() => {
        document.body.classList.add("play");
    }, 100);

    setTimeout(() => {
        const intro = document.getElementById("intro");
        if (intro) intro.remove();
    }, 2600);

});
</script>

</body>
</html>
