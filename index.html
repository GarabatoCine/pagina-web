<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;overflow:hidden;}

/* VIDEO FULLSCREEN */
.video{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
background:#000;
}

.video video{
width:100%;
height:100%;
object-fit:cover; /* 🔥 llena toda la pantalla */
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:10;
}

/* SVG */
svg{
width:100%;
height:100%;
display:block;
}

/* TIPOGRAFÍA */
.main{
font-family:Arial, Helvetica, sans-serif;
font-weight:900;
}

.sub{
font-family:Arial, Helvetica, sans-serif;
font-weight:700;
letter-spacing:0.25vw;
}

/* RESPONSIVE */
@media (min-width:1200px){
text.main{font-size:8vw;}
text.sub{font-size:1.2vw;}
}

@media (max-width:1199px){
text.main{font-size:10vw;}
text.sub{font-size:1.8vw;}
}

@media (max-width:768px){
text.main{font-size:12vw;}
text.sub{font-size:2.5vw;}
}

/* ===== ANIMACIÓN CORREGIDA ===== */

/* fade in */
.play .fade{
animation:fadeIn 3s ease forwards;
}

/* 🔥 AHORA SÍ: desplazamiento */
.play .mask-group{
animation:slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3.1s;
}

/* desaparición cortina */
.play #intro{
animation:fadeOut 0.4s ease forwards;
animation-delay:4.7s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes slideLeft{
to{transform:translateX(-140%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

</style>
</head>

<body>

<!-- VIDEO FULL -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group fade">

<!-- GARABATO -->
<text x="50" y="48"
text-anchor="middle"
class="main"
fill="black">
GARABATO CINE
</text>

<!-- COLOMBIA (pegado y pequeño) -->
<text x="50" y="55"
text-anchor="middle"
class="sub"
fill="black">
COLOMBIA
</text>

</g>

</mask>
</defs>

<!-- CORTINA -->
<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

/* autoplay robusto */
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* iniciar animación */
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

/* failsafe */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},6000);

</script>

</body>
</html>
