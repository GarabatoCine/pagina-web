<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#fff;
    overflow:hidden;
}

/* SVG FULLSCREEN (SOLUCIONA TABLET + BORDES) */
svg{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    display:block;
}

/* TEXTO GRANDE (TAMAÑO REAL QUE NECESITAS) */
.big{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size: clamp(80px, 10vw, 160px);
}

.small{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size: clamp(14px, 2vw, 18px);
    letter-spacing:3px;
}

/* ANIMACIÓN */
.mask-group{
    transform-box: fill-box;
    transform-origin: center;
}

.play .mask-group{
    animation:slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:2s;
}

/* 🔥 IZQUIERDA */
@keyframes slideLeft{
    to{
        transform:translateX(-120vw);
    }
}

/* DESAPARICIÓN BLANCO */
.fadeOut{
    opacity:0;
    transition:opacity 0.1s linear;
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<!-- INTRO -->
<div id="intro">
    <svg viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid slice">

        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>

                <g class="mask-group">
                    <!-- TEXTO TRANSPARENTE -->
                    <text x="50%" y="50%" text-anchor="middle" dy="-10" class="big">
                        GARABATO CINE
                    </text>

                    <text x="50%" y="58%" text-anchor="middle" class="small">
                        COLOMBIA
                    </text>
                </g>
            </mask>
        </defs>

        <!-- BLANCO CON HUECOS (TRANSPARENCIA REAL) -->
        <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

    </svg>
</div>

<script>

/* 🎬 INTRO DEFINITIVA */
function startIntro(){

    const intro = document.getElementById("intro");

    // RESET
    intro.style.display = "block";
    intro.style.opacity = "1";
    document.body.classList.remove("play");

    setTimeout(()=>{
        document.body.classList.add("play");
    },50);

    /* TIMING EXACTO */
    setTimeout(()=>{
        intro.classList.add("fadeOut");

        setTimeout(()=>{
            intro.style.display = "none";
            intro.classList.remove("fadeOut");
        },120);

    },3200);
}

window.addEventListener("load", startIntro);

</script>

</body>
</html>
