<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#000;overflow-x:hidden;}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    height:90px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    z-index:1000;
}

.logo-txt{
    font-size:1.2rem;
    letter-spacing:6px;
    font-weight:300;
    text-transform:uppercase;
}

.nav-derecha a{
    margin-left:30px;
    font-size:0.85rem;
    letter-spacing:2px;
    text-decoration:none;
    color:#222;
}

/* ================= HERO ================= */

.hero{
    margin-top:90px;
}

.hero video{
    width:100%;
    height:calc(100vh - 90px);
    object-fit:cover;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.titulo{
    font-size:clamp(42px,9vw,110px);
    font-weight:900;
    letter-spacing:-2px;
    text-transform:uppercase;
    color:#111;
    opacity:0;
}

.sub{
    margin-top:10px;
    font-size:12px;
    letter-spacing:4px;
    color:#444;
    opacity:0;
}

/* ================= MEDIA ================= */

.media video,
.media img{
    width:100%;
    height:auto;
    display:block;
}

/* ================= TEXTOS ================= */

.pie{
    padding:20px 0 80px;
    text-align:center;
    background:#fff;
}

.pie h2{
    font-size:1.4rem;
    font-weight:300;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie p{
    font-size:0.6rem;
    letter-spacing:3px;
    color:#999;
}

/* ================= ANIMACIONES ================= */

@keyframes fadeIn{to{opacity:1;}}
@keyframes slideUp{to{transform:translateY(-140%);}}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav-derecha">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- VIDEO PRINCIPAL -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<div class="titulo">GARABATO CINE</div>
<div class="sub">COLOMBIA</div>
</div>

<!-- PROYECTOS -->

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
</div>
<div class="pie"><h2>Vida de Colores</h2><p>Serie</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true"></div>
<div class="pie"><h2>Marimonda</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true"></div>
<div class="pie"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true"></div>
<div class="pie"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true"></div>
<div class="pie"><h2>Calaguala</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true"></div>
<div class="pie"><h2>La Princesita</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true"></div>
<div class="pie"><h2>Fracturas</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true"></div>
<div class="pie"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

// fix iOS
document.addEventListener("touchstart", ()=>{
    document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// intro animación CONTROLADA (NO FALLA)
window.addEventListener("load", ()=>{

    window.scrollTo(0,0);

    const titulo = document.querySelector(".titulo");
    const sub = document.querySelector(".sub");
    const intro = document.getElementById("intro");

    // fade in
    setTimeout(()=>{
        titulo.style.animation="fadeIn 1.2s forwards";
        sub.style.animation="fadeIn 1.2s forwards";
    },400);

    // subir
    setTimeout(()=>{
        titulo.style.animation+=" , slideUp 1.2s forwards";
        sub.style.animation+=" , slideUp 1.2s forwards";
    },1700);

    // desaparecer SIEMPRE
    setTimeout(()=>{
        intro.style.transition="opacity .4s ease";
        intro.style.opacity="0";
        setTimeout(()=>intro.style.display="none",400);
    },3000);

});

</script>

</body>
</html>
