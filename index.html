<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<!-- NUEVA TIPOGRAFÍA -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:'Inter', sans-serif;
}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:1000;
opacity:1;
}

svg{
width:100vw;
height:100vh;
display:block;
}

/* TEXTO AJUSTADO */
text.big{
font-weight:800;
font-size:clamp(50px, 7vw, 110px);
text-anchor:middle;
}

text.small{
font-weight:600;
font-size:clamp(12px, 1.8vw, 16px);
letter-spacing:3px;
text-anchor:middle;
}

/* 🔥 TRANSPARENCIA REAL (SIN FLASH) */
text{
fill:black;
}

/* ANIMACIÓN */
.mask-group{
transform-box:fill-box;
transform-origin:center;
}

.play .mask-group{
animation:slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:1s;
}

@keyframes slideLeft{
to{transform:translateX(-130vw);}
}

/* FADE */
.fade{
opacity:0;
transition:opacity 0.1s linear;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:200;
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 50px;
color:white;
text-transform:uppercase;
}

/* BRAND */
.brand{
font-weight:800;
font-size:22px;
letter-spacing:2px;
cursor:pointer;
}

/* NAV */
.nav{
display:flex;
gap:28px;
align-items:center;
font-size:13px;
font-weight:600;
}

.nav a{
color:white;
text-decoration:none;
opacity:0.85;
}

.nav a:hover{opacity:1;}

/* INSTAGRAM ICON CORRECTO */
.icon{
width:20px;
height:20px;
fill:white;
}

/* IDIOMA */
.lang{
display:flex;
align-items:center;
gap:8px;
font-size:12px;
}

.lang span{
opacity:0.4;
}

.lang a{
color:white;
text-decoration:none;
}

/* HAMBURGER */
.hamburger{
display:none;
width:28px;
height:18px;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
}

.hamburger span{
height:2px;
background:white;
width:100%;
}

/* MENU DROPDOWN */
.menu{
position:fixed;
top:70px;
right:30px;
width:220px;
background:rgba(0,0,0,0.95);
backdrop-filter:blur(12px);
border-radius:10px;
padding:15px 20px;

display:flex;
flex-direction:column;
gap:12px;

opacity:0;
transform:translateY(-10px);
pointer-events:none;
transition:0.3s ease;

z-index:150;
}

.menu.active{
opacity:1;
transform:translateY(0);
pointer-events:auto;
}

.menu a{
color:white;
text-decoration:none;
font-size:14px;
letter-spacing:2px;
}

/* RESPONSIVE */
@media (max-width:1024px){

.nav{display:none;}
.hamburger{display:flex;}
.header{padding:20px;}

text.big{
font-size:clamp(38px, 9vw, 80px);
}

}

@media (max-width:768px){

text.big{
font-size:clamp(30px, 10vw, 60px);
}

text.small{
font-size:clamp(10px, 3vw, 14px);
}

.menu{
right:20px;
top:65px;
width:200px;
}

}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid slice">
<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>
<g class="mask-group">
<text x="50%" y="50%" class="big">GARABATO CINE</text>
<text x="50%" y="60%" class="small">COLOMBIA</text>
</g>
</mask>
</defs>
<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
</svg>
</div>

<!-- HEADER -->
<header class="header">

<div class="brand" id="logoBtn">GARABATO CINE</div>

<div class="nav">

<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>

<!-- INSTAGRAM -->
<a href="https://instagram.com" target="_blank">
<svg class="icon" viewBox="0 0 24 24">
<path d="M7.75 2C4.574 2 2 4.574 2 7.75v8.5C2 19.426 4.574 22 7.75 22h8.5C19.426 22 22 19.426 22 16.25v-8.5C22 4.574 19.426 2 16.25 2h-8.5zm0 2h8.5A3.75 3.75 0 0120 7.75v8.5A3.75 3.75 0 0116.25 20h-8.5A3.75 3.75 0 014 16.25v-8.5A3.75 3.75 0 017.75 4zm4.25 2.5A5.75 5.75 0 106 12a5.75 5.75 0 006-5.75zm0 2A3.75 3.75 0 118.25 12 3.75 3.75 0 0112 8.5zm5.25-.88a1.12 1.12 0 11-2.24 0 1.12 1.12 0 012.24 0z"/>
</svg>
</a>

<!-- IDIOMA -->
<div class="lang">
<span>ES</span>
<span>|</span>
<a href="#">EN</a>
</div>

</div>

<!-- HAMBURGER -->
<div class="hamburger" id="hambBtn">
<span></span>
<span></span>
<span></span>
</div>

</header>

<!-- MENU MOBILE -->
<div class="menu" id="menu">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>
<a href="#">INSTAGRAM</a>
<a href="#">ES / EN</a>
</div>

<script>

/* VIDEO */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* INTRO */
function startIntro(){
const intro = document.getElementById("intro");

intro.style.display="block";
intro.style.opacity="1";
document.body.classList.remove("play");

setTimeout(()=>{
document.body.classList.add("play");
},50);

setTimeout(()=>{
intro.classList.add("fade");

setTimeout(()=>{
intro.style.display="none";
},120);

},2600);
}

window.addEventListener("load", startIntro);

/* REINICIO */
document.getElementById("logoBtn").addEventListener("click", startIntro);

/* MENU */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("menu");

btn.addEventListener("click", ()=>{
menu.classList.toggle("active");
});

</script>

</body>
</html>
