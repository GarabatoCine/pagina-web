<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #ffffff; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO: LETRAS QUE MUESTRAN LA IMAGEN --- */
        #intro {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff; /* Fondo blanco puro */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* El fondo blanco desaparece suavemente */
            animation: fadeOutIntro 0.8s ease-in forwards;
            animation-delay: 4s;
            pointer-events: none;
        }

        #intro h1 {
            font-size: clamp(2.5rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -2px;

            /* TRUCO: El texto usa la imagen de "La Frontera" como relleno */
            background: url('https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            
            /* Animación: Aparece quieto -> Pausa -> Sale a la izquierda */
            animation: caviarMove 4s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes caviarMove {
            0% { opacity: 0; transform: translateX(0); }
            15% { opacity: 1; transform: translateX(0); } /* Aparece en el centro */
            75% { transform: translateX(0); opacity: 1; } /* Se queda quieto */
            100% { transform: translateX(-150%); opacity: 0; } /* Se va a la izquierda */
        }

        @keyframes fadeOutIntro {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- CONTENIDO --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
            mix-blend-mode: difference;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
        }

        .hero-project {
            height: 100vh;
            width: 100%;
            background: #000;
        }

        .hero-project img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .project-info {
            padding: 60px 0;
            text-align: center;
        }

        .project-info h2 { font-weight: 300; letter-spacing: 6px; text-transform: uppercase; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div id="intro">
        <h1>Garabato Cine</h1>
    </div>

    <header>
        <div>Garabato Cine</div>
        <div>About / Contact</div>
    </header>

    <div class="hero-project">
        <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">
    </div>

    <div class="project-info">
        <h2>La Frontera</h2>
        <p style="color:#888; font-size:0.7rem; letter-spacing:2px; margin-top:10px;">LARGOMETRAJE</p>
    </div>

</body>
</html>
