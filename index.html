<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
}

/* --- FONDO --- */
.bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* --- CAPA BLANCA --- */
#intro {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: fadeOut 1s ease forwards;
    animation-delay: 4.5s;
}

/* --- TEXTO TRANSPARENTE REAL --- */
.texto {
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.04em;
    text-align: center;

    /* 🔥 AQUÍ ESTÁ EL TRUCO */
    background-image: url('https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true');
    background-size: cover;
    background-position: center;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    opacity: 0;

    animation: fadeIn 2.5s ease forwards, moveLeft 1.2s cubic-bezier(0.76,0,0.24,1) forwards;
    animation-delay: 1s, 4.5s;
}

/* --- RESPONSIVE --- */
.texto {
    font-size: 10vw;
}

@media (max-width: 768px) {
    .texto {
        font-size: 14vw;
        letter-spacing: -0.03em;
    }
}

/* --- ANIMACIONES --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes moveLeft {
    to { transform: translateX(-120%); }
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

</style>
</head>

<body>

<!-- FONDO -->
<img class="bg" src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">

<!-- INTRO -->
<div id="intro">
    <div class="texto">GARABATO CINE</div>
</div>

</body>
</html>
