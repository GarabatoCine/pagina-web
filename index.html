<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO DE FONDO */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===================== */
/* INTRO / MÁSCARA */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:10;
    transition: opacity 0.1s ease; /* Transición casi instantánea */
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

.mask-group{
    transform-box: fill-box;
    transform-origin: center;
}

.mask-group text{
    opacity:0;
}

.play .mask-group text{
    opacity:1;
}

/* ANIMACIÓN: 
   - Duración 1.3s para que sea ágil.
   - Delay de 2.5s para que se alcance a leer.
*/
.play .mask-group{
    animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay: 2.5s;
}

/* Clase para desaparecer el fondo blanco */
#intro.hide{
    opacity:0;
    pointer-events:none;
}

/* ===================== */
/* TEXTO (ESTILOS) */
/* ===================== */
text.big{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size: clamp(28px, 6vw, 58px);
}

text.small{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing:2px;
}

/* ===================== */
/* KEYFRAMES */
/* ===================== */
@keyframes slideLeft{
    to {
        /* -300% asegura que la 'E' cruce toda la pantalla hacia la izquierda */
        transform: translateX(-300%);
    }
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */
@media (max-width: 1024px){
    text.big{ font-size: clamp(20px, 5vw, 38px); }
    text.small{ font-size: clamp(9px, 2.2vw, 12px); }
}
</style>
</head>

<body>

<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<div id="intro">
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">
        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>
                
                <g class="mask-group" id="logoGroup">
                    <text x="700" y="240" text-anchor="middle" class="big">
                        GARABATO CINE
                    </text>
                    <text x="700" y="285" text-anchor="middle" class="small">
                        COLOMBIA
                    </text>
                </g>
            </mask>
        </defs>

        <rect id="whiteBg" width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<script>
    /* Autoplay Fix para navegadores */
    document.querySelectorAll("video").forEach(v => {
        v.muted = true;
        v.play().catch(() => {});
    });

    window.addEventListener("load", () => {
        // Inicia la secuencia
        document.body.classList.add("play");

        const logo = document.getElementById("logoGroup");
        const intro = document.getElementById("intro");

        // Escucha exactamente cuando termina el movimiento de la letra
        logo.addEventListener("animationend", (e) => {
            if (e.animationName === "slideLeft") {
                // 1. Desaparece el intro de inmediato
                intro.classList.add("hide");

                // 2. Lo quita del DOM a la milésima para que no estorbe
                setTimeout(() => {
                    intro.style.display = "none";
                }, 100);
            }
        });
    });
</script>

</body>
</html>
