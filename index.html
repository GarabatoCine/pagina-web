<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#000;overflow-x:hidden;}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    height:100px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 80px;
    z-index:1000;
}

.logo-txt{
    font-size:1.4rem;
    letter-spacing:8px;
    font-weight:300;
    text-transform:uppercase;
}

.nav-derecha a{
    margin-left:40px;
    font-size:1rem;
    letter-spacing:2px;
    text-decoration:none;
    color:#222;
}

/* ================= HERO (PROPORCIÓN REAL) ================= */

.hero{
    margin-top:100px;
    background:#000;
}

.hero video{
    width:100%;
    height:auto; /* 🔥 clave: NO se deforma nunca */
    display:block;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
}

.contenido-intro{
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translateY(0);
}

/* TEXTO */

.titulo{
    font-size:clamp(40px,9vw,120px);
    font-weight:900;
    letter-spacing:-2px;
    text-transform:uppercase;
    color:#111;
    opacity:0;
    white-space:nowrap;
}

.sub{
    margin-top:10px;
    font-size:14px;
    letter-spacing:4px;
    color:#444;
    opacity:0;
}

/* ================= MEDIA ================= */

.media video,
.media img{
    width:100%;
    height:auto;
    display:block;
}

/* ================= FRANJA ================= */

.pie{
    padding:40px 0 80px;
    text-align:center;
    background:#fff;
}

.pie h2{
    font-size:1.6rem;
    font-weight:300;
    letter-spacing:6px;
    text-transform:uppercase;
}

.pie p{
    font-size:.7rem;
    letter-spacing:3px;
    color:#999;
}

/* ================= ANIMACIONES ================= */

@keyframes fadeIn{to{opacity:1;}}
@keyframes slideUp{to{transform:translateY(-250%);}}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){
header{
    height:80px;
    padding:0 30px;
}
.hero{
    margin-top:80px;
}
.logo-txt{
    font-size:1rem;
}
.nav-derecha a{
    font-size:.8rem;
    margin-left:20px;
}
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav-derecha">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- HERO -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
    <div class="contenido-intro">
        <div class="titulo">GARABATO CINE</div>
        <div class="sub">COLOMBIA</div>
    </div>
</div>

<!-- PROYECTOS -->

<div class="pie"><h2>La Frontera</h2><p>Largometraje</p></div>

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
</div>
<div class="pie"><h2>Vida de Colores</h2><p>Serie</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true"></div>
<div class="pie"><h2>Marimonda</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true"></div>
<div class="pie"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true"></div>
<div class="pie"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true"></div>
<div class="pie"><h2>Calaguala</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true"></div>
<div class="pie"><h2>La Princesita</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true"></div>
<div class="pie"><h2>Fracturas</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true"></div>
<div class="pie"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart", ()=>{
    document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// INTRO CONTROL TOTAL
window.addEventListener("load", ()=>{

    window.scrollTo(0,0);

    const titulo = document.querySelector(".titulo");
    const sub = document.querySelector(".sub");
    const grupo = document.querySelector(".contenido-intro");
    const intro = document.getElementById("intro");

    // fade in
    setTimeout(()=>{
        titulo.style.animation="fadeIn 1.2s forwards";
        sub.style.animation="fadeIn 1.2s forwards";
    },400);

    // subir TODO
    setTimeout(()=>{
        grupo.style.animation="slideUp 1.4s forwards";
    },1700);

    // desaparecer fondo
    setTimeout(()=>{
        intro.style.transition="opacity .3s ease";
        intro.style.opacity="0";
        setTimeout(()=>intro.style.display="none",300);
    },3100);

});

</script>

</body>
</html>
