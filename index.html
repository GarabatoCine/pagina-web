<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#fff;}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    height:90px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    z-index:1000;
}

.logo{
    font-size:1.2rem;
    letter-spacing:6px;
    text-transform:uppercase;
}

.nav a{
    margin-left:30px;
    text-decoration:none;
    font-size:.9rem;
    letter-spacing:2px;
    color:#000;
}

/* ================= VIDEO ================= */

.hero{
    margin-top:90px;
}

.hero video{
    width:100%;
    height:auto; /* 🔥 proporción correcta */
    display:block;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro svg{
    width:100%;
    height:100%;
}

/* TEXTO */

.mask-text{
    opacity:0;
}

/* ANIMACIÓN */

.play .mask-text{
    animation:
        fadeIn 1.2s forwards,
        slideUp 1.5s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.3s,1.6s;
}

.play .bg{
    animation:fadeOut .3s forwards;
    animation-delay:3s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes slideUp{to{transform:translateY(-250%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* ================= LOG LINE ================= */

.descripcion{
    background:#fff; /* 🔥 fondo blanco */
    color:#000;
    padding:60px 20px;
    text-align:center;
    overflow:hidden;
}

.descripcion p{
    font-size:1rem;
    letter-spacing:.5px;
    white-space:nowrap; /* 🔥 UNA SOLA LÍNEA */
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

header{
    height:70px;
    padding:0 25px;
}

.hero{
    margin-top:70px;
}

.logo{
    font-size:1rem;
}

.nav a{
    margin-left:15px;
    font-size:.75rem;
}

.descripcion p{
    font-size:.8rem; /* para que quepa en móvil */
}

}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="logo">Garabato Cine</div>
<div class="nav">
<a href="proyectos.html">Proyectos</a>
<a href="#">Nosotros</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
</div>
</header>

<!-- VIDEO -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 100 100" preserveAspectRatio="none">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-text" fill="black" text-anchor="middle">

<text x="50" y="50"
      font-size="12"
      font-weight="900"
      dominant-baseline="middle">
GARABATO CINE
</text>

</g>

</mask>
</defs>

<!-- blanco con hueco -->
<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

<!-- capa fade -->
<rect width="100%" height="100%" fill="white" class="bg"/>

</svg>
</div>

<!-- LOG LINE -->
<section class="descripcion">
<p>
Ficción con raíz local y mirada social, donde el realismo se quiebra en el imaginario vibrante del Caribe colombiano.
</p>
</section>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
    v.muted=true;
    v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart",()=>{
    document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// animación
window.addEventListener("load",()=>{
    document.body.classList.add("play");
    window.scrollTo(0,0);
});

// failsafe
setTimeout(()=>{
    const intro=document.getElementById("intro");
    if(intro) intro.style.display="none";
},5000);

</script>

</body>
</html>
