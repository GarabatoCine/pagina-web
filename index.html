<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

/* VIDEO */
.video{
  position:fixed;
  inset:0;
  z-index:0;
}

.video video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  z-index:10;
  background:#fff;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* TEXTO PRINCIPAL (GRANDE Y ESTABLE) */
.title{
  font-family: Arial, Helvetica, sans-serif;
  font-weight:900;

  /* tamaño estable en TODOS los dispositivos */
  font-size: clamp(40px, 8vw, 110px);

  color:#000;

  opacity:0;
  transform:translateX(0);

  animation:fadeIn 0.4s ease forwards;
  animation-delay:1.6s;
}

/* SUBTITULO */
.subtitle{
  font-family: Arial, Helvetica, sans-serif;
  font-weight:700;
  font-size: clamp(12px, 2vw, 16px);
  letter-spacing:2px;

  color:#000;

  opacity:0;
  animation:fadeIn 0.4s ease forwards;
  animation-delay:1.8s;
}

/* entrada */
@keyframes fadeIn{
  to{ opacity:1; }
}

/* movimiento tipo cortinilla */
.play .title,
.play .subtitle{
  animation:slide 1.3s cubic-bezier(.76,0,.24,1) forwards;
  animation-delay:2s;
}

@keyframes slide{
  to{
    transform:translateX(-180%);
  }
}

/* salida intro */
.hide{
  opacity:0;
  pointer-events:none;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:25px 40px;

  color:#fff;
  font-family:Arial;
  text-transform:uppercase;

  opacity:0;
  animation:fadeInHeader 0.5s ease forwards;
  animation-delay:3.2s;
}

@keyframes fadeInHeader{
  to{ opacity:1; }
}

.brand{
  font-weight:900;
  font-size:20px;
  cursor:pointer;
}

/* MENU */
.menu-btn{
  width:28px;
  height:18px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.menu-btn span{
  height:2px;
  background:#fff;
  width:100%;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  z-index:100;

  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(12px);

  display:flex;
  justify-content:center;
  align-items:center;

  opacity:0;
  pointer-events:none;

  transition:0.4s;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

.overlay a{
  display:block;
  color:#fff;
  font-family:Arial;
  text-decoration:none;
  font-size:18px;
  margin:10px 0;
  text-align:center;
}

</style>
</head>

<body>

<header class="header">
  <div class="brand" id="restart">GARABATO CINE</div>

  <div class="menu-btn" id="btn">
    <span></span>
    <span></span>
    <span></span>
  </div>
</header>

<div class="overlay" id="overlay">
  <div>
    <a href="#">CATÁLOGO</a>
    <a href="#">NOSOTROS</a>
    <a href="#">PRÓXIMAMENTE</a>
    <a href="#">CONTACTO</a>
    <a href="#">INSTAGRAM</a>
  </div>
</div>

<div class="video">
  <video autoplay muted loop playsinline>
    <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
  </video>
</div>

<div id="intro">
  <div class="title">GARABATO CINE</div>
  <div class="subtitle">COLOMBIA</div>
</div>

<script>

window.addEventListener("load", ()=>{

  document.body.classList.add("play");

  const intro = document.getElementById("intro");

  setTimeout(()=>{
    intro.classList.add("hide");

    setTimeout(()=>{
      intro.style.display="none";
    },100);

  },3200);
});

/* REINICIO INTRO */
document.getElementById("restart").addEventListener("click", ()=>{
  location.reload();
});

/* MENU */
const btn = document.getElementById("btn");
const overlay = document.getElementById("overlay");

btn.addEventListener("click", ()=>{
  overlay.classList.toggle("active");
});

overlay.addEventListener("click", (e)=>{
  if(e.target === overlay){
    overlay.classList.remove("active");
  }
});

</script>

</body>
</html>
