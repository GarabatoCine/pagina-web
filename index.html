<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine | Productora</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #fff; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- HEADER DELGADO (Logo y Menú) --- */
        header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 15px 50px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .logo-txt {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #222; 
        }

        .nav-derecha a {
            color: #222;
            text-decoration: none;
            font-size: 0.65rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-left: 25px;
        }

        /* --- TITULO ESTILO CAVIAR (STICKY) --- */
        .contenedor-titulo-fijo {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            pointer-events: none; /* No molesta al hacer click */
        }

        .titulo-gigante {
            font-size: 10vw; /* Tamaño dinámico según la pantalla */
            font-weight: 900;
            letter-spacing: -5px;
            text-transform: uppercase;
            color: #fff;
            mix-blend-mode: difference; /* ESTO HACE LA MAGIA: cambia de color con el fondo */
            text-align: center;
        }

        /* --- CONTENEDOR DE PROYECTOS --- */
        .contenedor-proyectos { 
            margin-top: -100vh; /* Sube los proyectos para que el título quede encima */
            position: relative;
            z-index: 1;
        }

        .proyecto { 
            width: 100%; 
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .imagen-full {
            width: 100%;
            height: auto; 
            display: block;
        }

        .pie-proyecto {
            padding: 5px 0 90px 0;
            text-align: center;
        }

        .pie-proyecto h2 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #111;
        }

        .pie-proyecto p {
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
            margin-top: 2px;
        }

        @media (min-width: 1024px) {
            .imagen-full {
                height: 100vh;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-txt">Garabato Cine</div>
        <div class="nav-derecha">
            <a href="#">About Us</a>
            <a href="#">Contact</a>
            <a href="https://www.instagram.com/garabatocine/" target="_blank">Instagram</a>
        </div>
    </header>

    <div class="contenedor-titulo-fijo">
        <h1 class="titulo-gigante">GARABATO CINE!</h1>
    </div>

    <div class="contenedor-proyectos">
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>La Frontera</h2><p>Largometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Vida%20de%20colores.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Vida de Colores</h2><p>Serie</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Marimonda</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Año Sabático</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Calaguala</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>La Princesita</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>Fracturas</h2><p>Cortometraje</p></div>
        </div>
        <div class="proyecto">
            <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true" class="imagen-full">
            <div class="pie-proyecto"><h2>La Tortuga</h2><p>Cortometraje</p></div>
        </div>
    </div>

</body>
</html>
