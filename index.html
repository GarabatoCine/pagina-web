<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    background: #000;
    overflow-x: hidden;
    font-family: 'Roboto', sans-serif;
}

/* --- VIDEO DE FONDO --- */
.video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* --- CAPA BLANCA --- */
#capa-intro {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: slideOut 1s cubic-bezier(0.85, 0, 0.15, 1) forwards;
    animation-delay: 3s;
}

/* --- TEXTO COMO MÁSCARA --- */
.texto-mask {
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: -5px;
    text-transform: uppercase;

    color: black;

    /* CLAVE: esto crea el "hueco" */
    -webkit-mask-image: linear-gradient(#000, #000);
    -webkit-mask-composite: destination-out;

    mix-blend-mode: normal;

    opacity: 0;
    animation: fadeIn 1.2s ease forwards;
    animation-delay: 0.5s;
}

/* alternativa más compatible */
.texto-mask {
    background: black;
    -webkit-background-clip: text;
    color: transparent;
}

/* --- ANIMACIONES --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes slideOut {
    to {
        transform: translateX(-100%);
        visibility: hidden;
    }
}

/* --- CONTENIDO --- */
.contenido {
    position: relative;
    z-index: 2;
}

.imagen-full {
    width: 100%;
    height: 100vh;
    object-fit: cover;
}

</style>
</head>

<body>

<!-- VIDEO (esto es lo que se ve dentro del texto) -->
<video class="video-bg" autoplay muted loop playsinline>
    <source src="TU_VIDEO.mp4" type="video/mp4">
</video>

<!-- INTRO -->
<div id="capa-intro">
    <div class="texto-mask">GARABATO</div>
</div>

<!-- CONTENIDO -->
<div class="contenido">
    <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true" class="imagen-full">
</div>

</body>
</html>
