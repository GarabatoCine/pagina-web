<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
background:#fff;
overflow:hidden;
}

/* ===================== */
/* VIDEO BACKGROUND */
/* ===================== */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
position:fixed;
inset:0;
z-index:10;
}

svg{
width:100vw;
height:100vh;
display:block;
}

/* ===================== */
/* TEXTO RESPONSIVE */
/* ===================== */
text.big{
font-family: Arial, Helvetica, sans-serif;
font-weight:900;
font-size: clamp(28px, 6vw, 58px);
}

text.small{
font-family: Arial, Helvetica, sans-serif;
font-weight:700;
font-size: clamp(10px, 2vw, 14px);
letter-spacing:2px;
}

/* ===================== */
/* ANIMACIÓN */
/* ===================== */
.mask-group{
transform-box: fill-box;
transform-origin: center;
}

.play .fade{
animation:fadeIn 2.8s ease forwards;
}

.play .mask-group{
animation:slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3s;
}

/* 🔥 BACKGROUND BLANCO CON TIMING ORIGINAL */
.play #intro{
animation:fadeOut 0.25s ease forwards;
animation-delay:4.6s;
}

/* ===================== */
/* KEYFRAMES */
/* ===================== */
@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes slideLeft{
to{transform:translateX(-200%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ===================== */
/* TABLET FIX (SIN ROMPER PC) */
/* ===================== */
@media (max-width: 1024px){

text.big{
font-size: clamp(24px, 6vw, 44px);
transform: translateY(-2px);
}

text.small{
font-size: clamp(10px, 2.5vw, 13px);
letter-spacing:1.5px;
transform: translateY(-2px);
}

}

/* ===================== */
/* MOBILE PEQUEÑO */
/* ===================== */
@media (max-width: 380px){

text.big{
font-size: 24px;
}

text.small{
font-size: 10px;
}

}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group fade">

<text x="700" y="240"
text-anchor="middle"
class="big"
fill="black">
GARABATO CINE
</text>

<text x="700" y="285"
text-anchor="middle"
class="small"
fill="black">
COLOMBIA
</text>

</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

/* autoplay seguro */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* iniciar animación */
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

/* failsafe */
setTimeout(()=>{
const intro = document.getElementById("intro");
if(intro) intro.style.display="none";
},6000);

</script>

</body>
</html>
