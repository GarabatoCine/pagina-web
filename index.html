<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
}

/* --- FONDO (IMAGEN / VIDEO) --- */
.bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* --- CAPA BLANCA --- */
#whiteLayer {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 5;

    animation: fadeWhite 1s ease forwards;
    animation-delay: 4.5s;
}

/* --- SVG TEXTO RECORTE --- */
#svgText {
    position: fixed;
    inset: 0;
    z-index: 10;
}

/* TEXTO */
.text-mask {
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: -0.05em;
}

/* fade inicial */
#textGroup {
    opacity: 0;
    animation: fadeIn 2.5s ease forwards;
    animation-delay: 1s;
}

/* movimiento lateral SOLO del texto */
#textMove {
    animation: moveLeft 1.2s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    animation-delay: 4.5s;
}

/* --- ANIMACIONES --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes moveLeft {
    to { transform: translateX(-120%); }
}

@keyframes fadeWhite {
    to { opacity: 0; visibility: hidden; }
}

</style>
</head>

<body>

<!-- FONDO -->
<img class="bg" src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">

<!-- CAPA BLANCA -->
<div id="whiteLayer"></div>

<!-- SVG -->
<svg id="svgText" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">

    <defs>
        <mask id="mask">
            <rect width="100%" height="100%" fill="white"/>
            
            <!-- TEXTO = TRANSPARENCIA -->
            <text x="50" y="50"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="14"
                font-weight="900"
                font-family="Roboto, sans-serif"
                fill="black">
                GARABATO CINE
            </text>
        </mask>
    </defs>

    <!-- BLANCO CON HUECO -->
    <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

    <!-- TEXTO ANIMADO (invisible pero mueve la máscara visualmente) -->
    <g id="textGroup">
        <g id="textMove">
            <text x="50" y="50"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="14"
                font-weight="900"
                font-family="Roboto, sans-serif"
                fill="black">
                GARABATO CINE
            </text>
        </g>
    </g>

</svg>

</body>
</html>
