<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

#intro{
position:fixed;
inset:0;
z-index:1000;
opacity:1;
}

svg{
width:100vw;
height:100vh;
display:block;
}

text.big{
font-weight:900;
font-size:clamp(80px, 10vw, 150px);
font-family:Arial, Helvetica, sans-serif;
}

text.small{
font-weight:700;
font-size:clamp(14px, 2vw, 18px);
letter-spacing:3px;
}

/* ANIMACIÓN */
.mask-group{
transform-box:fill-box;
transform-origin:center;
}

.play .mask-group{
animation:slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:1s;
}

@keyframes slideLeft{
to{
transform:translateX(-130vw);
}
}

/* OCULTAR */
.fade{
opacity:0;
transition:opacity 0.1s linear;
}

</style>
</head>

<body>

<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<div id="intro">
<svg viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group">
<text x="50%" y="50%" text-anchor="middle" dy="-20" class="big">
GARABATO CINE
</text>
<text x="50%" y="60%" text-anchor="middle" class="small">
COLOMBIA
</text>
</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>
</div>

<script>

function startIntro(){

const intro = document.getElementById("intro");

intro.style.display="block";
intro.style.opacity="1";
document.body.classList.remove("play");

setTimeout(()=>{
document.body.classList.add("play");
},50);

setTimeout(()=>{
intro.classList.add("fade");

setTimeout(()=>{
intro.style.display="none";
},120);

},2600);

}

window.addEventListener("load", startIntro);

</script>

</body>
</html>
