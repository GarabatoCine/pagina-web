<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garabato Cine</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* --- CONTENEDOR DE LA INTRO --- */
        #intro-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background-color: #fff; /* Este es el fondo blanco de la intro */
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            
            /* El fondo blanco desaparece suavemente al final */
            animation: fadeOutIntro 0.6s ease-in forwards;
            animation-delay: 4.5s;
        }

        /* EL TEXTO COMO HUECO (MÁSCARA) */
        .caviar-text {
            width: 90%;
            max-width: 1200px;
            /* Esta animación hace que el 'hueco' esté quieto y luego corra a la izquierda */
            animation: caviarMove 4.5s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes caviarMove {
            0% { opacity: 0; transform: translateX(0); }
            15% { opacity: 1; transform: translateX(0); } /* Quieto en el centro */
            75% { transform: translateX(0); opacity: 1; } /* Pausa larga */
            100% { transform: translateX(-160%); opacity: 0; } /* Salida rápida */
        }

        @keyframes fadeOutIntro {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- ESTILO DEL HEADER --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
            mix-blend-mode: difference;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
        }

        /* --- CONTENIDO DE FONDO --- */
        .hero-project {
            height: 100vh;
            width: 100%;
            background: #000;
            display: block;
        }

        .hero-project img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .project-info {
            padding: 60px 0;
            text-align: center;
            background: white;
        }

        .project-info h2 { font-weight: 300; letter-spacing: 5px; text-transform: uppercase; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div id="intro-wrapper">
        <svg class="caviar-text" viewBox="0 0 800 200">
            <defs>
                <mask id="textMask">
                    <rect width="100%" height="100%" fill="white" />
                    <text x="50%" y="50%" text-anchor="middle" dy=".35em" 
                          font-size="80" font-weight="900" fill="black">GARABATO CINE</text>
                </mask>
            </defs>
            <rect width="100%" height="100%" fill="white" mask="url(#textMask)" />
        </svg>
    </div>

    <header>
        <div>Garabato Cine</div>
        <div>About / Contact</div>
    </header>

    <div class="hero-project">
        <img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20frontera.jpg?raw=true">
    </div>

    <div class="project-info">
        <h2>La Frontera</h2>
        <p style="color:#888; font-size:0.7rem; letter-spacing:2px; margin-top:10px;">LARGOMETRAJE</p>
    </div>

</body>
</html>
