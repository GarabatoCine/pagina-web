<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden; 
font-family:Arial, Helvetica, sans-serif;
}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
background:#000;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:1000;
opacity:1;
pointer-events:none;
}

svg{
width:100%;
height:100%;
display:block;
}

text.big{
font-weight:900;
font-size: clamp(40px, 8vw, 85px); 
font-family:Arial, Helvetica, sans-serif;
fill:black;
}

text.small{
font-weight:700;
font-size: clamp(10px, 2vw, 14px);
letter-spacing:5px;
fill:black;
}

.mask-group{
transform-box:fill-box;
transform-origin:center;
}

.play .mask-group{
animation:slideLeft 1.4s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:1.2s;
}

@keyframes slideLeft{
to{transform:translateX(-150vw);} 
}

.fade{
opacity:0;
transition:opacity 0.3s ease-out;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:200;
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 50px;
color:white;
text-transform:uppercase;
font-family:'Sora', sans-serif;
}

.nav{
display:flex;
gap:26px;
align-items:center;
font-size:14px;
}

.nav a{
color:white;
text-decoration:none;
opacity:0.85;
}

.brand{
font-weight:700;
font-size:22px;
letter-spacing:2px;
cursor:pointer;
}

.icon{
width:20px;
height:20px;
stroke:white;
fill:none;
stroke-width:2;
}

/* HAMBURGER */
.hamburger{
display:none;
width:28px;
height:18px;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
}

.hamburger span{
height:2px;
background:white;
width:100%;
}

/* MENU */
.menu{
position:fixed;
top:75px;
right:25px;
width:220px;
background:rgba(0,0,0,0.92);
backdrop-filter:blur(15px);
border-radius:12px;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
opacity:0;
transform:translateY(-10px);
pointer-events:none;
transition:0.3s ease;
z-index:150;
border: 1px solid rgba(255,255,255,0.1);
}

.menu.active{
opacity:1;
transform:translateY(0);
pointer-events:auto;
}

.menu a{
color:white;
text-decoration:none;
font-size:14px;
}

/* RESPONSIVE */
@media (max-width:1024px){
.nav{display:none;}
.hamburger{display:flex;}
.header{padding:25px 30px;}
text.big { font-size: clamp(35px, 7vw, 65px); }
}

@media (max-width:480px){
.header{padding:20px;}
.brand{font-size: 18px;}
text.big { font-size: 32px; }
}

</style>
</head>

<body>

<div class="video">
<video id="bgVideo" muted loop playsinline webkit-playsinline preload="auto">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4" type="video/mp4">
</video>
</div>

<div id="intro">
<svg viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid slice">
<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>
<g class="mask-group">
<text x="50%" y="48%" text-anchor="middle" class="big">GARABATO CINE</text>
<text x="50%" y="55%" text-anchor="middle" class="small">COLOMBIA</text>
</g>
</mask>
</defs>
<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
</svg>
</div>

<header class="header">
<div class="brand" id="logoBtn">GARABATO CINE</div>

<div class="nav">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>
<a href="https://instagram.com" target="_blank">
<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17" cy="7" r="1.5"></circle></svg>
</a>
</div>

<div class="hamburger" id="hambBtn">
<span></span><span></span><span></span>
</div>
</header>

<div class="menu" id="menu">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">CONTACTO</a>
<a href="#">INSTAGRAM</a>
</div>

<script>
const video = document.getElementById('bgVideo');

/* 🔥 AUTOPLAY REAL */
function forcePlay(){
video.muted = true;
video.setAttribute("muted","");
video.play().catch(()=>{});
}

/* múltiples intentos reales */
window.addEventListener("load", forcePlay);
video.addEventListener("loadeddata", forcePlay);
setTimeout(forcePlay, 500);
setTimeout(forcePlay, 1500);

/* INTRO — 🔥 FIX Safari (ya no se queda pegado) */
function startIntro(){

const intro = document.getElementById("intro");

document.body.classList.remove("play");

setTimeout(()=>{
document.body.classList.add("play");
},100);

/* 🔥 FORZAR SALIDA SIEMPRE */
setTimeout(()=>{
intro.classList.add("fade");

setTimeout(()=>{
intro.style.display="none";
forcePlay();
},400);

},2800);

}

window.addEventListener("load", startIntro);
document.getElementById("logoBtn").addEventListener("click", startIntro);

/* MENU */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("menu");

btn.addEventListener("click", (e)=>{
e.stopPropagation();
menu.classList.toggle("active");
});

document.addEventListener("click", ()=>{
menu.classList.remove("active");
});
</script>

</body>
</html>
