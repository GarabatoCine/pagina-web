<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#000;overflow-x:hidden;}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    height:100px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 80px;
    z-index:1000;
}

.logo-txt{
    font-size:1.4rem;
    letter-spacing:8px;
    font-weight:300;
    text-transform:uppercase;
}

.nav-derecha a{
    margin-left:40px;
    font-size:1rem;
    letter-spacing:2px;
    text-decoration:none;
    color:#222;
}

/* ================= HERO ================= */

.hero{
    margin-top:100px;
    display:flex;
    justify-content:center;
    background:#000;
}

.hero video{
    width:100%;
    height:auto; /* 🔥 PROPORCIÓN REAL SIEMPRE */
    max-height:calc(100vh - 100px);
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
}

#intro svg{
    width:100%;
    height:100%;
}

/* TEXTO */

.mask-text{
    opacity:0;
}

/* ANIMACIÓN */

.play .mask-text{
    animation:
        fadeIn 1.2s ease forwards,
        slideUp 1.4s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.7s;
}

.play .bg{
    animation:fadeOut .3s ease forwards;
    animation-delay:3.1s;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes slideUp{to{transform:translateY(-250%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* ================= MEDIA ================= */

.media video,
.media img{
    width:100%;
    height:auto;
    display:block;
}

/* ================= FRANJA ================= */

.pie{
    padding:40px 0 80px;
    text-align:center;
    background:#fff;
}

.pie h2{
    font-size:1.6rem;
    font-weight:300;
    letter-spacing:6px;
    text-transform:uppercase;
}

.pie p{
    font-size:.7rem;
    letter-spacing:3px;
    color:#999;
}

</style>
</head>

<body>

<header>
<div class="logo-txt">Garabato Cine</div>
<div class="nav-derecha">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- HERO -->
<div class="hero">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 100 100" preserveAspectRatio="none">

<defs>
<mask id="mask" maskUnits="objectBoundingBox">

<rect width="1" height="1" fill="white"/>

<g class="mask-text" fill="black" text-anchor="middle">

<text x="0.5" y="0.45" font-size="0.12" font-weight="900">
GARABATO CINE
</text>

<text x="0.5" y="0.55" font-size="0.03" letter-spacing="0.02">
COLOMBIA
</text>

</g>

</mask>
</defs>

<!-- blanco con hueco -->
<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

<!-- fade -->
<rect width="100%" height="100%" fill="white" class="bg"/>

</svg>
</div>

<!-- PROYECTOS -->

<div class="pie"><h2>La Frontera</h2><p>Largometraje</p></div>

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
</div>
<div class="pie"><h2>Vida de Colores</h2><p>Serie</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true"></div>
<div class="pie"><h2>Marimonda</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true"></div>
<div class="pie"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true"></div>
<div class="pie"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true"></div>
<div class="pie"><h2>Calaguala</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true"></div>
<div class="pie"><h2>La Princesita</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true"></div>
<div class="pie"><h2>Fracturas</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true"></div>
<div class="pie"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

// iOS fix
document.addEventListener("touchstart", ()=>{
    document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// activar animación
window.addEventListener("load", ()=>{
    document.body.classList.add("play");
    window.scrollTo(0,0);
});

// FAILSAFE
setTimeout(()=>{
    const intro = document.getElementById("intro");
    if(intro){
        intro.style.display="none";
    }
},5000);

</script>

</body>
</html>
