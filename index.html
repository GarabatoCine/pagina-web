<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:'Montserrat', Arial, Helvetica, sans-serif;
}

/* VIDEO */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:1000;
opacity:1;
}

/* SVG */
svg{
width:100vw;
height:100vh;
display:block;
}

/* TEXTO */
text.big{
font-weight:800;
font-size:clamp(60px, 9vw, 140px);
dominant-baseline:middle;
}

text.small{
font-weight:600;
font-size:clamp(12px, 2vw, 16px);
letter-spacing:3px;
}

/* SIN FLASH NEGRO */
text{
fill:black;
}

/* ANIMACIÓN */
.mask-group{
transform-box:fill-box;
transform-origin:center;
}

/* 🔥 AQUÍ ESTÁ EL CAMBIO (ANTES ERA 1s) */
.play .mask-group{
animation:slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:0s;
}

@keyframes slideLeft{
to{
transform:translateX(-130vw);
}
}

/* FADE */
.fade{
opacity:0;
transition:opacity 0.1s linear;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:200;
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 40px;
color:white;
}

.brand{
font-weight:800;
font-size:18px;
letter-spacing:2px;
cursor:pointer;
}

.hamburger{
width:28px;
height:18px;
display:flex;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
}

.hamburger span{
height:2px;
background:white;
width:100%;
}

/* MENU */
.menu{
position:fixed;
inset:0;
background:rgba(0,0,0,0.92);
backdrop-filter:blur(12px);
z-index:150;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

opacity:0;
pointer-events:none;
transition:0.4s ease;
}

.menu.active{
opacity:1;
pointer-events:auto;
}

.menu a{
color:white;
text-decoration:none;
font-size:22px;
letter-spacing:3px;
font-weight:600;
margin:12px 0;
transition:0.3s;
}

.menu a:hover{
opacity:0.6;
transform:translateY(-2px);
}

/* RESPONSIVE */
@media (max-width:768px){

text.big{
font-size:clamp(42px, 11vw, 80px);
}

text.small{
font-size:clamp(10px, 3vw, 14px);
}

.header{
padding:20px;
}

}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<svg viewBox="0 0 1400 600" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group">
<text x="50%" y="50%" text-anchor="middle" class="big">
GARABATO CINE
</text>
<text x="50%" y="60%" text-anchor="middle" class="small">
COLOMBIA
</text>
</g>

</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>
</div>

<!-- HEADER -->
<header class="header">
<div class="brand" id="logoBtn">GARABATO CINE</div>

<div class="hamburger" id="hambBtn">
<span></span>
<span></span>
<span></span>
</div>
</header>

<!-- MENU -->
<div class="menu" id="menu">
<a href="#">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="#">INSTAGRAM</a>
</div>

<script>

/* VIDEO */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* INTRO */
function startIntro(){

const intro = document.getElementById("intro");

intro.style.display="block";
intro.style.opacity="1";
document.body.classList.remove("play");

setTimeout(()=>{
document.body.classList.add("play");
},50);

setTimeout(()=>{
intro.classList.add("fade");

setTimeout(()=>{
intro.style.display="none";
},120);

},2600);
}

window.addEventListener("load", startIntro);

/* REINICIO */
document.getElementById("logoBtn").addEventListener("click", startIntro);

/* MENU */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("menu");

btn.addEventListener("click", ()=>{
menu.classList.toggle("active");
});

</script>

</body>
</html>
