<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
position:fixed;
inset:0;
z-index:10;
opacity:1;
transition: opacity 0.05s linear;
}

svg{
width:100vw;
height:100vh;
display:block;
}

.mask-group{
transform-box: fill-box;
transform-origin: center;
}

.mask-group text{ opacity:0; }
.play .mask-group text{ opacity:1; }

.play .mask-group{
animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
animation-delay: 2.5s;
}

#intro.hide{
opacity:0;
pointer-events:none;
}

@keyframes slideLeft{
to { transform: translateX(-200%); }
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:20;

display:flex;
justify-content:space-between;
align-items:center;

padding:30px 50px;

font-family: Arial, Helvetica, sans-serif;
text-transform:uppercase;
letter-spacing:2px;

color:white;
pointer-events:none;
}

/* NAV */
.nav{
display:flex;
gap:28px;
font-size:12px;
opacity:0.85;
align-items:center;
}

.nav a{
color:white;
text-decoration:none;
pointer-events:auto;
transition:opacity 0.3s ease;
display:flex;
align-items:center;
gap:6px;
}

.nav a:hover{
opacity:1;
}

/* CENTRO (MÁS GRANDE AHORA) */
.logo{
position:absolute;
left:50%;
transform:translateX(-50%);
font-weight:900;
font-size:20px; /* 🔥 más grande */
letter-spacing:3px;
pointer-events:auto;
cursor:pointer;
}

/* ICONOS */
.icon{
width:16px;
height:16px;
fill:white;
opacity:0.9;
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */
@media (max-width: 768px){

.header{
padding:20px;
}

.nav{
gap:15px;
font-size:10px;
}

.logo{
font-size:16px;
}

}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="nav left">
        <a href="#">CATÁLOGO</a>
        <a href="#">PRÓXIMAMENTE</a>
    </div>

    <!-- LOGO CLICKABLE (reinicia intro) -->
    <div class="logo" id="logoBtn">
        GARABATO CINE
    </div>

    <div class="nav right">

        <a href="#">
            NOSOTROS
        </a>

        <a href="#">
            CONTACTO
        </a>

        <!-- Instagram icon -->
        <a href="https://instagram.com" target="_blank">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.65 0 3 1.35 3 3v10c0 1.65-1.35 3-3 3H7c-1.65 0-3-1.35-3-3V7c0-1.65 1.35-3 3-3h10z"/>
                <path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0 8a3 3 0 110-6 3 3 0 010 6z"/>
            </svg>
        </a>

        <!-- Language flag -->
        <a href="#">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 2v20h2v-7h12l-2-4 2-4H6V2H4z"/>
            </svg>
        </a>

    </div>

</header>

<!-- VIDEO -->
<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<!-- INTRO -->
<div id="intro">

<svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group">

<text x="700" y="240" text-anchor="middle" style="font-size:58px; font-weight:900;">
GARABATO CINE
</text>

<text x="700" y="285" text-anchor="middle" style="font-size:14px; font-weight:700;">
COLOMBIA
</text>

</g>
</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

/* autoplay */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* restart intro */
document.getElementById("logoBtn").addEventListener("click", ()=>{

const intro = document.getElementById("intro");

intro.style.display = "block";
intro.style.opacity = "1";

document.body.classList.remove("play");

/* reinicia animación */
setTimeout(()=>{
document.body.classList.add("play");
}, 50);

});

window.addEventListener("load", ()=>{

document.body.classList.add("play");

const intro = document.getElementById("intro");

/* timing intro */
setTimeout(()=>{

intro.style.opacity = "0";

setTimeout(()=>{
intro.style.display = "none";
}, 120);

}, 3550);

});

</script>

</body>
</html>
