<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

/* ===================== */
/* VIDEO */
/* ===================== */
.video{
position:fixed;
inset:0;
z-index:0;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
}

/* ===================== */
/* INTRO (RESTAURADO ORIGINAL) */
/* ===================== */
#intro{
position:fixed;
inset:0;
z-index:10;
opacity:1;
transition: opacity 0.05s linear;
}

svg{
width:100vw;
height:100vh;
display:block;
}

.mask-group{
transform-box: fill-box;
transform-origin: center;
}

.mask-group text{ opacity:0; }
.play .mask-group text{ opacity:1; }

.play .mask-group{
animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
animation-delay: 2.5s;
}

#intro.hide{
opacity:0;
pointer-events:none;
}

@keyframes slideLeft{
to { transform: translateX(-200%); }
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:20;

display:flex;
justify-content:space-between;
align-items:center;

padding:30px 50px;

font-family: Arial, Helvetica, sans-serif;
text-transform:uppercase;
letter-spacing:2px;

color:white;
pointer-events:none;
}

/* NAV */
.nav{
display:flex;
gap:28px;
font-size:12px;
opacity:0.85;
align-items:center;
}

.nav a{
color:white;
text-decoration:none;
pointer-events:auto;
cursor:pointer;
transition:opacity 0.3s ease;
}

.nav a:hover{
opacity:1;
}

/* CENTRO */
.logo{
position:absolute;
left:50%;
transform:translateX(-50%);
font-weight:900;
font-size:14px;
letter-spacing:3px;
pointer-events:auto;
cursor:pointer;
}

/* ICONOS IDIOMA */
.lang{
display:flex;
gap:10px;
align-items:center;
}

/* ACTIVE STATE */
.lang button{
background:none;
border:1px solid white;
color:white;
padding:4px 8px;
font-size:10px;
cursor:pointer;
opacity:0.8;
}

.lang button.active{
opacity:1;
background:white;
color:black;
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */
@media (max-width: 768px){

.header{
padding:20px;
}

.nav{
gap:15px;
font-size:10px;
}

.logo{
font-size:12px;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="nav left">
        <a href="#">CATÁLOGO</a>
        <a href="#">PRÓXIMAMENTE</a>
    </div>

    <div class="logo" id="logoBtn">
        GARABATO CINE
    </div>

    <div class="nav right">
        <a href="#">NOSOTROS</a>
        <a href="#">CONTACTO</a>

        <!-- Instagram -->
        <a href="https://instagram.com" target="_blank">📷</a>

        <!-- LANGUAGE -->
        <div class="lang">
            <button id="esBtn" class="active">ES</button>
            <button id="enBtn">EN</button>
        </div>
    </div>

</header>

<!-- VIDEO -->
<div class="video">
    <video autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>
</div>

<!-- INTRO ORIGINAL RESTAURADO -->
<div id="intro">

<svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">

<defs>
<mask id="mask">
<rect width="100%" height="100%" fill="white"/>

<g class="mask-group">

<text x="700" y="240" text-anchor="middle" style="font-size:58px; font-weight:900;">
GARABATO CINE
</text>

<text x="700" y="285" text-anchor="middle" style="font-size:14px; font-weight:700;">
COLOMBIA
</text>

</g>
</mask>
</defs>

<rect width="100%" height="100%" fill="white" mask="url(#mask)"/>

</svg>

</div>

<script>

/* VIDEO */
document.querySelectorAll("video").forEach(v=>{
v.muted = true;
v.play().catch(()=>{});
});

/* ===================== */
/* INTRO INIT */
/* ===================== */
function startIntro(){

const intro = document.getElementById("intro");

intro.style.display = "block";
intro.style.opacity = "1";

document.body.classList.remove("play");

/* reinicio animación SVG */
setTimeout(()=>{
document.body.classList.add("play");
}, 50);

/* timing original */
setTimeout(()=>{
intro.style.opacity = "0";

setTimeout(()=>{
intro.style.display = "none";
}, 120);

}, 3550);
}

/* INIT */
window.addEventListener("load", startIntro);

/* CLICK LOGO REINICIA INTRO */
document.getElementById("logoBtn").addEventListener("click", ()=>{
startIntro();
});

/* ===================== */
/* IDIOMA TOGGLE */
/* ===================== */
const esBtn = document.getElementById("esBtn");
const enBtn = document.getElementById("enBtn");

esBtn.addEventListener("click", ()=>{
esBtn.classList.add("active");
enBtn.classList.remove("active");
document.documentElement.lang = "es";
});

enBtn.addEventListener("click", ()=>{
enBtn.classList.add("active");
esBtn.classList.remove("active");
document.documentElement.lang = "en";
});

</script>

</body>
</html>
