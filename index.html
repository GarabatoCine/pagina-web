<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;font-family:'Roboto',sans-serif;overflow:hidden;}

/* VIDEO BASE */
.video-base{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:0;
}

.video-base video{
width:100%;
height:auto;
max-height:100%;
object-fit:contain;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:#fff;
z-index:10;
}

/* CAPA QUE PERFORA */
.cutout{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

/* 🔥 ESTO ES LO IMPORTANTE */
mix-blend-mode:destination-out;
}

/* TEXTO */
.main{
font-size:12vw;
font-weight:900;
white-space:nowrap;
letter-spacing:-2px;
color:#000;
opacity:0;
}

.sub{
margin-top:10px;
font-size:2vw;
letter-spacing:4px;
font-weight:900;
color:#000;
opacity:0;
}

/* ANIMACIÓN */

.play .main,
.play .sub{
animation:fadeIn 3s ease forwards;
}

.play .cutout{
animation:slideLeft 1.6s cubic-bezier(.76,0,.24,1) forwards;
animation-delay:3.2s;
}

.play #intro{
animation:fadeOut 0.4s ease forwards;
animation-delay:4.8s;
}

@keyframes fadeIn{
to{opacity:1;}
}

@keyframes slideLeft{
to{transform:translateX(-140%);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* RESPONSIVE */
@media(max-width:768px){
.main{font-size:16vw;}
.sub{font-size:4vw;}
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-base">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Gif%20principal%20Vida%20de%20colores.mp4">
</video>
</div>

<!-- CORTINA -->
<div id="intro">
<div class="cutout">
<div class="main">GARABATO CINE</div>
<div class="sub">COLOMBIA</div>
</div>
</div>

<script>

/* autoplay real */
document.querySelectorAll("video").forEach(v=>{
v.muted=true;
v.play().catch(()=>{});
});

/* iOS fix */
document.addEventListener("touchstart",()=>{
document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

/* iniciar animación */
window.addEventListener("load",()=>{
document.body.classList.add("play");
});

/* failsafe */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},6000);

</script>

</body>
</html>
