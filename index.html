<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* ===================== */
/* VIDEO DUAL */
/* ===================== */
.video{
    position:fixed;
    inset:0;
    z-index:0;
}

.video video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-mobile{ display:none; }

@media (max-width:768px){
    .video-desktop{ display:none; }
    .video-mobile{ display:block; }
}

/* ===================== */
/* INTRO */
/* ===================== */
#intro{
    position:fixed;
    inset:0;
    z-index:10;
    opacity:1;
    transition: opacity 0.05s linear;
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

text.big{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size: clamp(28px, 6vw, 58px);
}

text.small{
    font-family: Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing:2px;
}

.mask-group{
    transform-box: fill-box;
    transform-origin:center;
}

.mask-group text{ opacity:0; }
.play .mask-group text{ opacity:1; }

.play .mask-group{
    animation: slideLeft 1.3s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:2s;
}

@keyframes slideLeft{
    to { transform: translateX(-200%); }
}

/* rect cover FIX */
#intro rect{
    x:-5;
    y:-5;
    width:1410;
    height:510;
}

/* ===================== */
/* HEADER */
/* ===================== */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:30px 50px;

    font-family: Arial, Helvetica, sans-serif;
    text-transform:uppercase;
    color:white;

    opacity:0;
    animation:fadeInHeader 0.5s ease forwards;
    animation-delay:3.3s;
}

@keyframes fadeInHeader{
    to { opacity:1; }
}

.brand{
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    cursor:pointer;
}

.nav{
    display:flex;
    gap:25px;
    align-items:center;
    font-size:13px;
    font-weight:700;
}

.nav a{
    color:white;
    text-decoration:none;
    opacity:0.8;
}

.nav a:hover{
    opacity:1;
}

/* instagram */
.icon{
    width:18px;
    height:18px;
    fill:white;
}

/* hamburger */
.hamburger{
    display:none;
    flex-direction:column;
    justify-content:space-between;
    width:26px;
    height:18px;
    cursor:pointer;
}

.hamburger span{
    height:2px;
    background:white;
    width:100%;
}

/* ===================== */
/* CINEMA OVERLAY MENU */
/* ===================== */
.cinema-overlay{
    position:fixed;
    inset:0;
    z-index:100;

    opacity:0;
    pointer-events:none;

    transition:opacity 0.6s ease;
}

.cinema-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.cinema-content{
    position:relative;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;
}

.cinema-links{
    display:flex;
    flex-direction:column;
    gap:25px;
    text-align:center;

    font-family: Arial, Helvetica, sans-serif;
    text-transform:uppercase;
}

.cinema-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    letter-spacing:2px;

    opacity:0;
    transform:translateY(10px);
    transition:all 0.4s ease;
}

.cinema-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.cinema-overlay.active .cinema-links a{
    opacity:1;
    transform:translateY(0);
}

.cinema-overlay.active .cinema-links a:nth-child(1){ transition-delay:0.1s; }
.cinema-overlay.active .cinema-links a:nth-child(2){ transition-delay:0.15s; }
.cinema-overlay.active .cinema-links a:nth-child(3){ transition-delay:0.2s; }
.cinema-overlay.active .cinema-links a:nth-child(4){ transition-delay:0.25s; }
.cinema-overlay.active .cinema-links a:nth-child(5){ transition-delay:0.3s; }

/* MOBILE */
@media (max-width:768px){
    .nav{ display:none; }
    .hamburger{ display:flex; }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="brand" id="restartIntro">GARABATO CINE</div>

    <div class="nav">
        <a href="#">CATÁLOGO</a>
        <a href="#">NOSOTROS</a>
        <a href="#">PRÓXIMAMENTE</a>

        <a href="https://instagram.com" target="_blank">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm10 2H7a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3zm-5 3.5A4.5 4.5 0 1112 16a4.5 4.5 0 010-9z"/>
            </svg>
        </a>
    </div>

    <div class="hamburger" id="hambBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

</header>

<!-- CINEMA MENU -->
<div class="cinema-overlay" id="cinemaMenu">
    <div class="cinema-backdrop"></div>

    <div class="cinema-content">
        <div class="cinema-links">
            <a href="#">CATÁLOGO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">PRÓXIMAMENTE</a>
            <a href="#">CONTACTO</a>
            <a href="#">INSTAGRAM</a>
        </div>
    </div>
</div>

<!-- VIDEO -->
<div class="video">
    <video class="video-desktop" autoplay muted loop playsinline>
        <source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
    </video>

    <video class="video-mobile" autoplay muted loop playsinline>
        <source src="video-vertical.mp4">
    </video>
</div>

<!-- INTRO -->
<div id="intro">
    <svg viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">
        <defs>
            <mask id="mask">
                <rect width="100%" height="100%" fill="white"/>
                <g class="mask-group" id="logoGroup">
                    <text x="700" y="240" text-anchor="middle" class="big">GARABATO CINE</text>
                    <text x="700" y="285" text-anchor="middle" class="small">COLOMBIA</text>
                </g>
            </mask>
        </defs>

        <rect width="100%" height="100%" fill="white" mask="url(#mask)"/>
    </svg>
</div>

<script>

/* VIDEO */
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

/* INTRO */
window.addEventListener("load", ()=>{
    document.body.classList.add("play");

    const intro = document.getElementById("intro");

    setTimeout(()=>{
        intro.style.opacity = "0";
        setTimeout(()=> intro.style.display="none",120);
    },3250);
});

/* RESTART INTRO */
document.getElementById("restartIntro").addEventListener("click", ()=>{

    const intro = document.getElementById("intro");

    intro.style.display = "block";
    intro.style.opacity = "1";

    document.body.classList.remove("play");

    const logo = document.getElementById("logoGroup");
    logo.style.animation = "none";
    void logo.offsetWidth;
    logo.style.animation = "";

    setTimeout(()=>{
        document.body.classList.add("play");
    },50);

    setTimeout(()=>{
        intro.style.opacity="0";
        setTimeout(()=> intro.style.display="none",120);
    },3250);
});

/* HAMB + MENU CINEMA */
const btn = document.getElementById("hambBtn");
const menu = document.getElementById("cinemaMenu");

const sound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-fast-swoosh-transition-1497.mp3");
sound.volume = 0.2;

btn.addEventListener("click", ()=>{
    menu.classList.toggle("active");

    if(menu.classList.contains("active")){
        sound.currentTime = 0;
        sound.play().catch(()=>{});
    }
});

</script>

</body>
</html>
