<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Roboto',sans-serif;
    background:#000;
    overflow-x:hidden;
}

/* ================= HERO ================= */

.hero{
    position:fixed;
    inset:0;
    z-index:-1;
}

.hero video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    animation:fadeOut .4s ease forwards;
    animation-delay:3s;
}

/* TEXTO */
.titulo{
    font-size:clamp(40px,9vw,110px);
    font-weight:900;
    letter-spacing:-2px;
    text-transform:uppercase;
    white-space:nowrap;

    opacity:0;

    animation:fadeIn 1.2s ease forwards,
              slideLeft 1.1s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.7s;
}

.sub{
    margin-top:10px;
    font-size:12px;
    letter-spacing:4px;

    opacity:0;

    animation:fadeIn 1.2s ease forwards,
              slideLeft 1.1s cubic-bezier(.76,0,.24,1) forwards;
    animation-delay:.4s,1.7s;
}

/* animaciones */
@keyframes fadeIn{to{opacity:1;}}
@keyframes slideLeft{to{transform:translateX(-140%);}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    z-index:1000;

    background:linear-gradient(to bottom, rgba(255,255,255,0.7), transparent);
}

.logo{
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:300;
}

.nav a{
    margin-left:15px;
    font-size:.7rem;
    text-decoration:none;
    color:#222;
}

/* ================= MEDIA ================= */

.media{
    width:100%;
    background:#000;
}

.media video,
.media img{
    width:100%;
    height:auto;
    display:block;
}

/* ================= TEXTOS ================= */

.pie{
    padding:20px 0 70px;
    text-align:center;
    background:#fff;
}

.pie h2{
    font-weight:300;
    letter-spacing:5px;
    text-transform:uppercase;
}

.pie p{
    font-size:.6rem;
    letter-spacing:3px;
    color:#999;
}

</style>
</head>

<body>

<!-- HERO VIDEO -->
<div class="hero">
<video autoplay muted loop playsinline preload="auto">
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>

<!-- INTRO -->
<div id="intro">
<div class="titulo">GARABATO CINE</div>
<div class="sub">COLOMBIA</div>
</div>

<!-- HEADER -->
<header>
<div class="logo">Garabato Cine</div>
<div class="nav">
<a href="#">About Us</a>
<a href="#">Contact</a>
<a href="https://www.instagram.com/garabatocine/" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
</header>

<!-- CONTENIDO -->

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-la-frontera.mp4">
</video>
</div>
<div class="pie"><h2>La Frontera</h2><p>Largometraje</p></div>

<div class="media">
<video autoplay muted loop playsinline>
<source src="https://github.com/GarabatoCine/pagina-web/raw/refs/heads/main/Banner-vida-de-colores.mp4">
</video>
</div>
<div class="pie"><h2>Vida de Colores</h2><p>Serie</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Marimonda.jpg?raw=true"></div>
<div class="pie"><h2>Marimonda</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Sabatico.jpg?raw=true"></div>
<div class="pie"><h2>Año Sabático</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20El%20congo.jpg?raw=true"></div>
<div class="pie"><h2>El Congo de Oro</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada-calaguala.jpg?raw=true"></div>
<div class="pie"><h2>Calaguala</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20princesita.png?raw=true"></div>
<div class="pie"><h2>La Princesita</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20Fracturas.jpg?raw=true"></div>
<div class="pie"><h2>Fracturas</h2><p>Cortometraje</p></div>

<div class="media"><img src="https://github.com/GarabatoCine/pagina-web/blob/main/Portada%20La%20tortuga.jpg?raw=true"></div>
<div class="pie"><h2>La Tortuga</h2><p>Cortometraje</p></div>

<script>

// autoplay robusto
document.querySelectorAll("video").forEach(v=>{
    v.muted = true;
    v.play().catch(()=>{});
});

// iOS fallback
document.addEventListener("touchstart", ()=>{
    document.querySelectorAll("video").forEach(v=>v.play());
},{once:true});

// scroll top
if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
}
window.onload = ()=>window.scrollTo(0,0);

</script>

</body>
</html>
