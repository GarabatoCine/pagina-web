<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Frontera | Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
overflow-x:hidden;
background:#ffffff; 
color:#000000;           
font-family:'Roboto',sans-serif;
}

a{
text-decoration:none;
}

img{
display:block;
max-width:100%;
}

/* ================= HEADER ================= */

.header{
position:absolute;
top:0;
left:0;
width:100%;
padding:28px 40px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
text-transform:uppercase;
}

.header, .header a {
color: #FFFFFF; 
}

.logo a{
font-family:'Oswald',sans-serif;
font-size:24px;
letter-spacing:2px;
color:#fff;
display: block;
}

.menu-toggle {
display: none;
font-size: 24px;
cursor: pointer;
color: #fff;
z-index: 2000;
margin-left: auto;
}

.nav{
display:flex;
align-items:center;
gap:26px;
}

.nav a{
font-size:14px;
color:#fff;
opacity:.9;
}

.nav-mobile {
display: none;
position: fixed;
top: 80px;
right: 20px;
width: 200px;
background: rgba(0,0,0,0.9);
padding: 25px;
z-index: 1500;
flex-direction: column;
gap: 15px;
border-radius: 8px;
text-align: right;
}
.nav-mobile a {
color: #fff;
font-size: 16px;
text-transform: uppercase;
}
.nav-mobile .lang-mobile {
color: #fff;
margin-top: 10px;
font-size: 14px;
display: flex;
justify-content: flex-end;
gap: 8px;
}

.lang{
display:flex;
gap:6px;
font-size:13px;
color:#fff;
}

.lang .active{
opacity:.45;
}

/* ================= HERO ================= */

.hero-banner{
position:relative;
width:100%;
background: #000;
line-height: 0;
}

.hero-banner img{
width:100%;
height:auto;
display:block;
filter: brightness(0.65);
}

.hero-overlay{
position:absolute;
bottom: 10%; 
left: 60px;
z-index:10;
max-width: 50%; 
transform:none;
text-align:left;
}

.hero-title{
font-family:'Oswald',sans-serif;
font-size: clamp(24px, 4vw, 54.6px); 
font-weight:700;
line-height:1.1;
letter-spacing:2px;
margin-bottom:10px;
color:#FFF;
text-transform:uppercase;
}

.subrayado-amarillo {
border-bottom: 4px solid #FFC601;
padding-bottom: 12px;
display: inline-block;
line-height: 0.9;
}

.hero-subtitle{
font-size: clamp(12px, 1.5vw, 18px);
line-height: 1.35;
font-weight: 300;
color: #CCCCCC;
letter-spacing: 0.5px;
margin-bottom: 20px;
}

.hero-btn{
display:inline-flex;
align-items:center;
gap: 8px;
padding: 8px 18px;
background: transparent;
border: 0.5px solid rgba(255,255,255,0.5);
color: #FFFFFF;
font-family: 'Roboto', sans-serif;
font-size: 14px;
font-weight: 400;
letter-spacing: 2px;
text-transform: uppercase;
transition: all 0.3s ease;
cursor: pointer;
}

.hero-btn:hover{
background: #FFFFFF;
color: #000000;
border-color: #FFFFFF;
}

/* ================= PREMIOS ================= */

.premios-section {
width: 100%;
background: #000000;
padding: 40px 10px; 
margin-top: 32px;
margin-bottom: 32px;
display: flex;
justify-content: center;
}

.premios-container {
width: 100%;
max-width: 1400px; 
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 20px;
}

.premio-logo {
flex: 1 1 calc(16.66% - 20px);
display: flex;
justify-content: center;
align-items: center;
}

.premio-logo img {
max-height: 75px; 
width: auto;
filter: brightness(0) invert(1);
opacity: 1;
}

/* ================= PÓSTER + TEXTO ================= */

.poster-text-section {
width: 100%;
padding: 0px 20px; 
background: #ffffff;
display: flex;
justify-content: center;
}

.pt-wrapper {
display: flex;
flex-direction: row;
justify-content: center; 
align-items: stretch;
gap: 35px;         
max-width: 1200px;
width: 100%;
}

.pt-poster-wrapper {
flex-shrink: 0;
display: flex;
align-items: flex-start; 
}

.pt-poster {
width: 100%;
max-width: 480px; 
box-shadow: 0 15px 40px rgba(0,0,0,0.1);
height: auto;
align-self: flex-start;
}

.pt-info {
width: 260px; 
flex-shrink: 0;
padding-top: 2px; 
display: flex;
flex-direction: column;
justify-content: space-between; 
}

.pt-title {
font-family: 'Georgia', serif; 
font-size: 36px;
font-weight: normal;
line-height: 1.2;
color: #000000;
margin-bottom: 20px;
letter-spacing: 0px;
text-transform: none;
}

.pt-subrayado-amarillo {
border-bottom: 3px solid #FFC601; 
padding-bottom: 6px;
display: inline-block;
line-height: 0.8;
}

.pt-paragraph {
font-family: 'Roboto', sans-serif;
font-size: 16.5px; 
font-weight: 300; 
line-height: 1.62; 
color: #222222;
margin-bottom: 16px;
text-align: left;
}

/* ================= FOTOGRAMAS ================= */

.fotogramas-section-nueva {
    position: relative;
    margin-top: 40px !important;
    margin-bottom: 40px !important;
    padding: 0 20px;
}

.scroll-indicator-nuevo {
    position: absolute;
    top: -35px;
    right: 20px;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.scroll-indicator-nuevo i { animation: pulse 1.5s infinite; }

.galeria-wrapper-nueva {
    display: flex;
    align-items: center; /* Centrado vertical */
    gap: 40px;
    width: 100%;
}

.galeria-intro-nueva { flex: 0 0 250px; }

.galeria-titulo-nueva {
    font-family: 'Georgia', serif;
    font-size: 46px; /* Ajustado: 1 punto menos */
    font-weight: normal;
    margin-bottom: 10px;
    color: #000;
}

.galeria-subtitulo-nueva {
    font-family: 'Roboto', sans-serif;
    font-size: 15.5px; /* Ajustado: 1 punto más */
    line-height: 1.5;
    color: #666;
    display: block;
}

/* Fuerza el salto de línea para "La Frontera" */
.break-line::before {
    content: "\A";
    white-space: pre;
}

.fotogramas-carousel-nuevo {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    flex: 1;
    padding-bottom: 0px;
    scrollbar-width: none;
}

.fotogramas-carousel-nuevo::-webkit-scrollbar {
    display: none;
}

.fotogramas-carousel-nuevo .fotograma-item { flex: 0 0 350px; }
/* AJUSTES PARA TABLET */
@media(max-width: 1024px) {
    /* Mantenemos la estructura horizontal, evitamos que pase a columna */
    .galeria-wrapper-nueva { 
        flex-direction: row !important; 
        gap: 20px !important; 
    }

    /* Reducimos el ancho de la intro para dar espacio al carrusel */
    .galeria-intro-nueva { 
        flex: 0 0 200px !important; 
    }

    /* Ajustamos el tamaño de las fotos para que quepan dos */
    .fotogramas-carousel-nuevo .fotograma-item { 
        flex: 0 0 calc(50% - 10px) !important; /* Dos fotos visibles */
    }

    /* Ajustamos el título para que no sea tan grande en tablet */
    .galeria-titulo-nueva {
        font-size: 32px !important;
    }
}
@keyframes pulse {
    0% { transform: translateX(-5px); opacity: 0.5; }
    50% { transform: translateX(5px); opacity: 1; }
    100% { transform: translateX(-5px); opacity: 0.5; }
}

@media(max-width: 900px) {
    .galeria-wrapper-nueva { flex-direction: column; }
    .galeria-intro-nueva { margin-bottom: 20px; }
}
/* ================= FICHA TÉCNICA ================= */

.ficha-tecnica-section { background: #000; width: 100%; display: flex; justify-content: center; padding: 20px 0; }
.ficha-tecnica-marco-wrapper { 
    width: calc(100% - 60px); 
    margin: 20px; 
    border: 1px solid #fff; 
    position: relative; 
    padding: 60px 40px 40px 40px; 
}
.titulo-ficha-container { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); background: #000; padding: 0 20px; z-index: 5; }
.titulo-ficha { color: #d1d1d1; font-family: 'Oswald', sans-serif; font-size: 26px; letter-spacing: 4px; text-transform: uppercase; white-space: nowrap; }

/* PC: 5 columnas originales */
.ficha-tecnica-grid { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-start;
    width: 100%; 
}
.ficha-columna { 
    display: flex; 
    flex-direction: column; 
    gap: 30px; 
}
.ficha-item { display: flex; align-items: center; gap: 10px; }
.reparto { display: flex; flex-direction: column; align-items: center; text-align: center; }
.reparto img { width: 45px !important; height: auto !important; margin-bottom: 10px !important; display: block !important; }
.ficha-item img { width: 35px !important; height: 35px !important; display: block !important; }
.ficha-texto { color: #d1d1d1; font-family: 'Roboto', sans-serif; font-size: 13px !important; line-height: 1.4 !important; }

/* TABLET: Centrado estable y trueque mediante flex-direction invertido */
@media(max-width: 1024px) { 
    .ficha-tecnica-grid { 
        display: grid !important; 
        grid-template-columns: repeat(3, 1fr) !important; 
        gap: 30px !important; 
        width: 100% !important; 
        margin: 0 auto !important; 
        padding-left: 5% !important; 
        box-sizing: border-box !important;
    } 
    .ficha-columna { display: contents !important; }
    
    .ficha-item, .reparto { 
        display: flex !important; 
        flex-direction: row !important; 
        align-items: center !important; 
        justify-content: flex-start !important; 
        width: 100% !important; 
        text-align: left !important;
    }

    .ficha-columna:nth-child(1) { order: 1 !important; }
    .reparto { order: 2 !important; }
    .ficha-columna:nth-child(6) { order: 3 !important; } 
}
/* MÓVIL: Código completo y optimizado */
@media(max-width: 600px) { 
    .ficha-tecnica-marco-wrapper { 
        padding: 30px 10px 15px 10px !important; 
        margin: 10px auto !important;
        width: 95% !important;
    }

    .ficha-tecnica-grid { 
        display: grid !important; 
        grid-template-columns: repeat(3, 1fr) !important; 
        gap: 15px 5px !important; 
        width: 100% !important; 
        align-items: start !important; 
    } 

    .ficha-columna { display: contents !important; }
    
    .ficha-item, .reparto { 
        display: flex !important; 
        flex-direction: column !important; 
        align-items: center !important; 
        justify-content: flex-start !important; 
        text-align: center !important; 
        gap: 5px !important;
    }

    .reparto { 
        gap: 2px !important; 
        padding-top: 0 !important;
    }
    
    .reparto .ficha-texto { 
        margin-top: 2px !important; 
        line-height: 1.1 !important;
    }
    
    .ficha-item img, .reparto img { 
        width: 30px !important; 
        height: 30px !important; 
        object-fit: contain !important; 
        margin-bottom: 0 !important;
    }
    
    .ficha-texto { 
        font-size: 9px !important; 
        line-height: 1.2 !important; 
    }
}

/* ================= NUEVA SECCIÓN VER Y ESCUCHAR ALINEADA ================= */
.ve-section-wrapper {
    width: calc(100% - 60px);
    max-width: 1200px;
    margin: 40px auto;
    display: flex;
    gap: 30px;
    align-items: stretch;
    border: 1px solid #ddd;
    padding: 20px;
}
.ve-img-grande { flex: 1; }
.ve-img-grande img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ve-bloques-derecha { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
.ve-bloque { border: 1px solid #eee; padding: 25px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.ve-btn { display: inline-block; padding: 10px 20px; background: #000; color: #fff; text-align: center; text-transform: uppercase; font-size: 12px; margin-top: 10px; }
@media(max-width: 850px) { .ve-section-wrapper { flex-direction: column; } }

/* ================= CONTACTO ================= */

.contact-section {
width: 100%;
padding: 100px 0;
background: #000000;
display: flex;
justify-content: center;
text-align: center;
}

.contact-container {
max-width: 850px;
margin: 0 auto;
padding: 0 25px;
}

.contact-title {
font-family: 'Roboto', sans-serif; 
font-size: 20px;                 
font-weight: 300;                 
line-height: 1.3;
letter-spacing: 0.5px;
margin-bottom: 30px;
color: #FFFFFF;
}

.contact-btn {
display: inline-block;
padding: 14px 40px;
background: transparent;
color: #FFC601;
font-family: 'Roboto', sans-serif;
font-size: 13px;
font-weight: 700;
letter-spacing: 3px;
text-transform: uppercase;
border: 2px solid #FFC601;
cursor: pointer;
transition: all 0.3s ease;
}

.contact-btn:hover {
background: #FFC601;
color: #000000;
}

/* ================= FOOTER ================= */

.sitio-footer{
background:#000000; 
color:#ffffff;
padding:60px 60px 40px;
border-top:1px solid rgba(255,255,255,.08);
}

.fila-tres-columnas{
max-width: 1300px;
margin: auto;
display: flex;
justify-content: space-between;
align-items: center;
}

.columna-izquierda{
flex:1;
}

.columna-izquierda h4{
font-family:'Oswald',sans-serif;
font-size:22px;
letter-spacing:2px;
margin-bottom:6px;
}

.columna-izquierda p{
font-size:13px;
color:#888;
}

.columna-central{
display:flex;
justify-content:center;
gap:25px;
flex:1;
}

.columna-central a{
color:#fff;
font-size:18px;
transition:.3s;
}

.columna-central a:hover{
color:#FFC601;
}

.columna-derecha{
flex:1;
text-align:right;
}

.columna-derecha p{
font-size:13px;
color:#888;
line-height:1.8;
}

.footer-link-normal{
color:inherit;
text-decoration:underline;
}

.footer-link-normal:hover{
color:#FFC601;
}

/* ================= RESPONSIVE ================= */

/* ================= RESPONSIVE ================= */

@media(max-width:1024px) {
    .fotograma-item { flex: 0 0 calc(33.33% - 10px); } 

    /* Ajuste para que la galería sea a pantalla completa en tablet/móvil */
    .galeria-intro-nueva { display: none !important; }
    .scroll-indicator-nuevo { display: none !important; }
    .galeria-wrapper-nueva { display: block !important; padding: 0 !important; margin: 0 !important; }
    .fotogramas-carousel-nuevo { padding-left: 0 !important; width: 100% !important; }
    .fotogramas-carousel-nuevo .fotograma-item { flex: 0 0 80% !important; }
}

@media(max-width:850px){
    .pt-wrapper { flex-direction: column; align-items: center; gap: 40px; }
    .pt-info { width: 100%; max-width: 480px; justify-content: flex-start; }
    .pt-title { text-align: center; }
    .pt-paragraph { margin-bottom: 20px !important; text-align: justify; }
    .ve-section-wrapper { flex-direction: column; }
}

@media(max-width:992px){
    .header { padding:20px; }
    .nav { display:none; }
    .logo { display: none; }
    .menu-toggle { display: block; }
    .hero-overlay { left: 20px; }
    .sitio-footer { padding:40px 25px; }
    .fila-tres-columnas { flex-direction:column; gap:25px; text-align:center; }
    .columna-derecha { text-align:center; }
    .columna-derecha p { text-align: center; }
}

@media(max-width: 991px) {
    .premio-logo img { max-height: 52.5px; }
}

@media(max-width: 600px) {
    .hero-overlay { left: 10px !important; right: 10px !important; bottom: 10px !important; width: calc(100% - 20px) !important; display: flex !important; justify-content: space-between !important; align-items: flex-end !important; max-width: 100% !important; }
    .hero-text-container { display: flex; flex-direction: column; align-items: flex-start; flex: 1; }
    .hero-title { font-size: 20px !important; line-height: 1 !important; margin-bottom: 2px !important; white-space: nowrap !important; letter-spacing: 0.5px !important; }
    .hero-subtitle { font-size: 11px !important; margin-bottom: 0px !important; }
    .subrayado-amarillo { border-bottom: 3px solid #FFC601 !important; padding-bottom: 8px !important; display: inline-block !important; line-height: 1 !important; }
    .hero-btn { padding: 4px 10px !important; font-size: 9px !important; margin-bottom: 0 !important; white-space: nowrap; margin-left: 10px; }
    .premio-logo { flex: 1 1 calc(33.33% - 20px); }
    .fotogramas-carousel { flex-wrap: wrap; overflow-x: visible; gap: 10px; }
    .fotograma-item { flex: 0 0 calc(50% - 5px); }
    .scroll-indicator { display: none; }
    .fotogramas-section { margin-top: 20px; }
}
