<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Frontera | Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
overflow-x:hidden;
background:#000;
color:#fff;
font-family:'Roboto',sans-serif;
}

a{
text-decoration:none;
}

img{
display:block;
max-width:100%;
}

/* ================= HEADER ================= */

.header{
position:absolute;
top:0;
left:0;
width:100%;
padding:28px 40px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
text-transform:uppercase;
}

.logo a{
font-family:'Oswald',sans-serif;
font-size:24px;
letter-spacing:2px;
color:#fff;
}

.nav{
display:flex;
align-items:center;
gap:26px;
}

.nav a{
font-size:14px;
color:#fff;
opacity:.9;
}

.lang{
display:flex;
gap:6px;
font-size:13px;
color:#fff;
}

.lang .active{
opacity:.45;
}

/* ================= HERO (BANNER) ================= */

.hero-banner{
position:relative;
width:100%;
background: #000;
line-height: 0;
}

.hero-banner img{
width:100%;
height:auto;
display:block;
filter: brightness(0.65);
}

.hero-overlay{
position:absolute;
bottom: 40px;
left: 60px;
z-index: 10;
max-width: 700px;
transform: none;
text-align: left;
width: auto;
}

.hero-title{
font-family:'Oswald',sans-serif;
font-size:clamp(28px, 4.2vw, 54.6px);
font-weight: 700;
line-height: 1.1;
letter-spacing: 2px;
margin-bottom: 10px;
color: #FFF;
text-transform: uppercase;
}

.subrayado-amarillo {
border-bottom: 4px solid #FFC601;
padding-bottom: 12px;
display: inline-block;
line-height: 0.9;
}

.hero-subtitle{
font-size: clamp(14px, 1.5vw, 18px);
line-height: 1.35;
font-weight: 300;
color: #CCCCCC;
letter-spacing: 0.5px;
margin-bottom: 20px;
}

.hero-btn{
display:inline-block;
padding:12px 35px;
background: transparent;
border: 1px solid #FFFFFF;
color: #FFFFFF;
font-family: 'Roboto', sans-serif;
font-size: 14px;
font-weight: 400;
letter-spacing: 2px;
text-transform: uppercase;
transition: all 0.3s ease;
cursor: pointer;
}

.hero-btn:hover{
background: #FFFFFF;
color: #000000;
border-color: #FFFFFF;
}

/* ================= SECCIÓN MEDIA (CONTÁCTANOS) ================= */

.contact-section {
width: 100%;
padding: 140px 0;
background: #000000;
display: flex;
justify-content: center;
text-align: center;
}

.contact-container {
max-width: 750px;
margin: 0 auto;
padding: 0 25px;
}

.contact-title {
font-family: 'Oswald', sans-serif;
font-size: clamp(28px, 4vw, 44px);
font-weight: 400;
line-height: 1.3;
text-transform: uppercase;
letter-spacing: 2px;
margin-bottom: 35px;
color: #FFFFFF;
}

.contact-btn {
display: inline-block;
padding: 16px 45px;
background: #FFC601;
color: #000000;
font-family: 'Roboto', sans-serif;
font-size: 13px;
font-weight: 500;
letter-spacing: 3px;
text-transform: uppercase;
border: none;
cursor: pointer;
transition: all 0.3s ease;
}

.contact-btn:hover {
background: #FFFFFF;
}

/* ================= FOOTER ================= */

.sitio-footer{
background:#000;
padding:60px 60px 40px;
border-top:1px solid rgba(255,255,255,.08);
}

.fila-tres-columnas{
max-width:1300px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.columna-izquierda{
flex:1;
}

.columna-izquierda h4{
font-family:'Oswald',sans-serif;
font-size:22px;
letter-spacing:2px;
margin-bottom:6px;
}

.columna-izquierda p{
font-size:13px;
color:#888;
}

.columna-central{
display:flex;
justify-content:center;
gap:25px;
flex:1;
}

.columna-central a{
color:#fff;
font-size:18px;
transition:.3s;
}

.columna-central a:hover{
color:#FFC601;
}

.columna-derecha{
flex:1;
text-align:right;
}

.columna-derecha p{
font-size:13px;
color:#888;
line-height:1.8;
}

.footer-link-normal{
color:inherit;
text-decoration:underline;
}

.footer-link-normal:hover{
color:#FFC601;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

.header{
padding:20px;
}

.nav{
display:none;
}

.logo a { 
font-size: 18px; 
}

/* Responsive Banner Próximamente */
.hero-overlay { 
left: 20px; 
bottom: 30px; 
width: 100%; 
max-width: none;
padding-right: 20px;
}
.hero-title { 
font-size: 26px; 
}
.hero-subtitle { 
font-size: 13px; 
}
.hero-btn { 
padding: 10px 25px; 
font-size: 12px; 
}

/* Responsive Footer */
.sitio-footer{
padding:40px 25px;
}

.fila-tres-columnas{
flex-direction:column;
gap:25px;
text-align:center;
}

.columna-derecha{
text-align:center;
}

.columna-derecha p {
text-align: center;
}

}

</style>

</head>
