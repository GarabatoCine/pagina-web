<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente - Garabato Cine</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            color: white;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: white;
        }

        /* HEADER */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .nav {
            display: flex;
            gap: 40px;
            align-items: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .nav a {
            color: white;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #C49A3A;
        }

        .lang {
            display: flex;
            gap: 8px;
        }

        .lang .active {
            opacity: .5;
        }

        /* BANNER (EXTREMO A EXTREMO SIN CORTES) */
        .banner-container {
            width: 100%;
            position: relative;
            background: #000;
        }

        .banner-container img {
            width: 100%;
            height: auto; /* Mantiene la proporción exacta sin recortar nada */
            display: block;
            filter: brightness(0.65);
        }

        .banner-text-overlay {
            position: absolute;
            top: 45%;
            left: 60px;
            transform: translateY(-50%);
            z-index: 10;
            max-width: 700px;
        }

        .banner-text-overlay h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(45px, 7vw, 100px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #FFF;
        }

        .banner-text-overlay p {
            font-size: clamp(16px, 2.2vw, 22px);
            line-height: 1.5;
            font-weight: 300;
            color: #E2E2E2;
        }

        /* SECCIONES COMPARTIDAS */
        .section {
            max-width: 1300px;
            margin: 100px auto;
            padding: 0 60px;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            letter-spacing: 3px;
            color: #C49A3A;
            border-bottom: 1px solid rgba(196, 154, 58, 0.4);
            display: inline-block;
            padding-bottom: 8px;
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        /* MADRE SEMILLA */
        .featured-project {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: start;
        }

        .main-poster img {
            width: 100%;
            display: block;
        }

        .gallery-thumbs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .gallery-thumbs img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .project-details .status-tag {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            color: #C49A3A;
            margin-bottom: 15px;
        }

        .project-details h2 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(40px, 5vw, 75px);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 12px;
        }

        .project-details .subtitle-yellow {
            color: #C49A3A;
            font-size: 17px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .project-details .synopsis {
            font-size: 17px;
            line-height: 1.7;
            color: #DCDCDC;
            margin-bottom: 45px;
        }

        .meta-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 50px;
            border-top: 1px solid #222;
            padding-top: 30px;
        }

            border-left: 1px
