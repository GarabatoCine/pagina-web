<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
color:#555;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
color:#999;
text-decoration:none;
font-weight:500;
}

.lang span{opacity:0.6;}
.lang .active{opacity:1;color:#555;}

.lang a{
opacity:0.6;
text-decoration:none;
color:#999;
}

.lang a:hover{
opacity:1;
color:#555;
}

.icon{
width:18px;
height:18px;
stroke:#999;
fill:none;
stroke-width:2;
}

/* ================= TITULO ================= */

.page-title{
margin-top:110px;
padding:20px 40px;
font-size:28px;
font-weight:500;
color:#555;
text-transform:uppercase;
}

/* ================= FULL WIDTH BLOCKS ================= */

.block{
position:relative;
width:100vw;
margin-left:calc(-50vw + 50%);
}

.block img{
width:100%;
display:block;
}

.overlay{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:18px;
background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
color:#fff;
font-size:18px;
}

/* ================= FOOTER ================= */

.footer-space{height:120px;}

.footer{
background:#434343;
color:white;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
text-decoration:underline;
color:white;
font-size:19px;
font-weight:100;
}

.footer-right{text-align:right;}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:20px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
text-decoration:underline;
color:white;
margin-bottom:8px;
}

.footer-bottom-right{text-align:right;}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{text-align:left;}

.footer-icons{justify-content:flex-start;}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{text-align:left;}

}

</style>
</head>
