<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#999;

/* FIX IMPORTANTE HEADER */
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

.lang span{opacity:0.6;}
.lang .active{opacity:1;}

.lang a{
opacity:0.6;
text-decoration:none;
color:#000;
}

.lang a:hover{opacity:1;}

/* ================= HAMBURGUESA ================= */

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= GALERÍA ================= */

.block{
position:relative;
width:100vw;
margin-left:calc(-50vw + 50%);

/* 🔥 FIX IMPORTANTE: mismo espacio entre fotos */
margin-bottom:6px;
}

.block img{
width:100%;
display:block;
}

.overlay{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:18px;
background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
color:#fff;
font-size:18px;
}

/* ================= FOOTER SPACE (CORREGIDO) ================= */

.footer-space{
height:60px; /* antes estaba exagerado */
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
color:white;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-right{text-align:right;}

.footer-follow{
font-size:19px;
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
color:white;
margin-bottom:8px;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-bottom-right{
text-align:right;
line-height:1.6;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

/* FIX HEADER TAPANDO IMAGEN */
body{
padding-top:92px;
}

.header{
padding:16px 22px;
}

/* HAMBURGUESA REAL */
.menu-toggle{
display:flex;
}

.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
border:1px solid #eee;
gap:14px;
}

.nav.active{
display:flex;
}

/* GALERÍA */
.block{
margin-bottom:6px;
}

/* FOOTER */
.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{text-align:left;}
.footer-icons{justify-content:flex-start;}

.footer-bottom{
flex-direction:column;
gap:10px;
}

.footer-bottom-right{text-align:left;}

}

</style>
</head>
