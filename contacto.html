<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter', sans-serif;
background:#fff;
color:#000;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
border-bottom:1px solid #eee;
}

.logo a{
font-size:24px;
font-weight:700;
color:#000;
text-decoration:none;
letter-spacing:2px;
}

/* ================= BANNER ================= */

.banner img{
width:100%;
display:block;
}

/* ================= LAYOUT ================= */

.container{
display:flex;
gap:80px;
padding:20px 40px 40px;
align-items:flex-start;
}

/* ================= LEFT ================= */

.left{
width:40%;
padding-left:120px; /* 🔥 x3 más hacia la derecha */
}

.left h2{
font-size:60px; /* +100% aprox */
font-weight:700;
text-decoration:underline;
margin-bottom:20px;
}

.left .social-title{
margin-top:60px;
font-size:18px;
font-weight:600;
}

.social-icons{
display:flex;
gap:18px;
margin-top:15px;
}

.social-icons svg{
width:48px; /* 🔥 x2 del footer */
height:48px;
stroke:black;
fill:none;
stroke-width:1.5;
}

/* ================= RIGHT ================= */

.right{
width:60%;
padding-left:120px; /* mismo corrimiento */
}

.right h2{
font-size:42px;
font-weight:700;
margin-bottom:25px;
margin-top:0; /* alineado con left */
}

/* FORM */

form{
display:flex;
flex-direction:column;
gap:12px;
max-width:500px;
}

.row{
display:flex;
gap:10px;
}

input, textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
font-family:'Inter', sans-serif;
}

textarea{
min-height:140px;
}

button{
width:140px;
padding:10px;
background:#000;
color:#fff;
border:none;
cursor:pointer;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
margin-top:60px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
color:white;
text-decoration:underline;
font-size:19px;
}

.footer-right{
text-align:right;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
color:white;
text-decoration:underline;
margin-bottom:8px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
flex-direction:column;
}

.left, .right{
width:100%;
padding-left:0;
}

.right h2{
margin-top:40px;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>
</div>

<!-- BANNER -->
<div class="banner">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Marimonda-tirita.png?raw=true">
</div>

<!-- CONTENT -->
<div class="container">

<!-- LEFT -->
<div class="left">

<h2>Contacto</h2>

<div class="social-title">Síguenos</div>

<div class="social-icons">

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

<a href="https://web.facebook.com/garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M14 9h3V6h-3c-2 0-4 2-4 4v2H7v3h3v6h3v-6h3l1-3h-4v-2c0-.6.4-1 1-1z"></path>
</svg>
</a>

<a href="https://www.youtube.com/@garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M22 12s0-4-1-5-5-1-9-1-8 0-9 1-1 5-1 5 0 4 1 5 5 1 9 1 8 0 9-1 1-5 1-5z"></path>
<polygon points="10 15 15 12 10 9"></polygon>
</svg>
</a>

</div>

</div>

<!-- RIGHT -->
<div class="right">

<h2>Déjanos tu mensaje</h2>

<form action="mailto:garabatocine@gmail.com">

<div class="row">
<input type="text" placeholder="Nombre">
<input type="text" placeholder="Apellido">
</div>

<input type="email" placeholder="Correo electrónico *" required>
<input type="text" placeholder="Teléfono">
<textarea placeholder="Mensaje *" required></textarea>

<button>Enviar</button>

</form>

</div>

</div>

</body>
</html>
