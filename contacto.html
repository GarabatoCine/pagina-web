<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#111;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
color:#000;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
color:#000;
}

/* ACTIVO */
.nav a.active{
text-decoration:underline;
text-underline-offset:4px;
}

.lang span{opacity:0.6;}
.lang .active{opacity:1;}
.lang a{opacity:0.6;color:#000;text-decoration:none;}
.lang a:hover{opacity:1;}

/* ================= LAYOUT ================= */

.container{
max-width:1100px;
margin:0 auto;
padding:90px 40px;
display:flex;
gap:80px;
}

.left{
flex:1;
}

.left h1{
font-size:72px;
font-weight:500;
line-height:1;
margin-bottom:20px;
}

.location{
display:flex;
align-items:center;
gap:10px;
font-size:14px;
color:#555;
}

.location svg{
width:16px;
height:16px;
stroke:#555;
fill:none;
stroke-width:1.5;
}

.right{
flex:1;
}

.right h2{
font-size:36px;
font-weight:500;
margin-bottom:25px;
}

form{
display:flex;
flex-direction:column;
gap:14px;
}

input, textarea{
width:100%;
padding:12px 14px;
border:1px solid #ddd;
font-size:14px;
font-family:inherit;
outline:none;
}

textarea{
min-height:140px;
resize:none;
}

button{
width:auto;
align-self:flex-start;
padding:10px 22px;
background:#000;
color:#fff;
border:none;
font-size:13px;
cursor:pointer;
text-transform:uppercase;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:#fff;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
color:#fff;
text-decoration:underline;
text-underline-offset:2px;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:#fff;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
color:#fff;
margin-bottom:8px;
text-decoration:underline;
}

.footer-bottom-right{
text-align:right;
line-height:1.6;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
flex-direction:column;
padding:80px 24px;
}

.left h1{
font-size:48px;
}

.right h2{
font-size:28px;
}

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{text-align:left;}
.footer-icons{justify-content:flex-start;}
.footer-bottom{
flex-direction:column;
gap:20px;
}
.footer-bottom-right{text-align:left;}

}

</style>
</head>

<input type="text" name="apellido" placeholder="Apellido">

<input type="tel" name="telefono" placeholder="Teléfono">

<input type="email" name="email" placeholder="Correo electrónico *" required>

<textarea name="mensaje" placeholder="Mensaje *" required></textarea>

<button type="submit">Enviar</button>

</form>

</div>

</div>

<!-- FOOTER -->
<footer class="footer">

<div class="footer-line"></div>

<div class="footer-row">

<div class="footer-left">
<a href="#top">Contacto</a>
</div>

<div class="footer-right">

<div class="footer-follow">Síguenos</div>

<div class="footer-icons">

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg viewBox="0 0 24 24">

</svg>
</a>

<a href="https://www.youtube.com/@garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M22 12s0-4-1-5-5-1-9-1-8 0-9 1-1 5-1 5 0 4 1 5 5 1 9 1 8 0 9-1 1-5 1-5z"></path>
<polygon points="10 15 15 12 10 9"></polygon>
</svg>

</div>

</div>

</div>

<div class="footer-line"></div>

<div class="footer-bottom">

<div class="footer-bottom-left">

</div>

<div class="footer-bottom-right">

</html>
