<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter', sans-serif;
overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-weight:700; /* 🔥 más negrita */
font-size:24px;
letter-spacing:2px;
text-decoration:none;
color:#000;
}

.nav{
display:flex;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
color:#000;
}

.lang span{opacity:0.5;}
.lang a{color:#000; text-decoration:none; opacity:0.7;}

/* ================= BANNER ================= */

.banner img{
width:100%;
display:block;
}

/* ================= LAYOUT 2 COLUMNAS ================= */

.container{
display:flex;
min-height:100vh;
}

.left{
width:40%;
background:#fff;
padding:80px 70px;
}

.right{
width:60%;
background:#000;
color:#fff;
padding:80px 70px;
}

/* ================= TITULOS ================= */

.title-contact{
font-size:48px;
font-weight:600;
color:#000;
margin-left:120px; /* 🔥 más desplazado */
margin-bottom:10px;
position:relative;
}

/* línea fina en vez de subrayado real */
.title-contact::after{
content:"";
display:block;
width:120px;
height:1px;
background:#000;
margin-top:6px;
opacity:0.6;
}

.location{
margin-left:120px;
margin-top:20px;
font-size:14px;
color:#333;
}

/* ================= REDES ================= */

.social-title{
margin-top:60px;
margin-left:120px;
font-size:14px;
font-family:Arial, sans-serif;
}

.social-icons{
display:flex;
gap:14px;
margin-left:120px;
margin-top:12px;
}

.social-icons svg{
width:32px;   /* 🔥 más grandes */
height:32px;
stroke:#000;
fill:none;
stroke-width:1.2;
}

/* ================= LINKS LEGAL ================= */

.legal{
margin-left:120px;
margin-top:50px;
font-size:13px;
}

.legal a{
display:block;
color:#000;
text-decoration:underline;
margin-bottom:8px;
}

/* ================= FORM ================= */

.form-title{
font-size:42px;
font-weight:600;
margin-bottom:40px;
}

form{
display:flex;
flex-direction:column;
gap:14px;
}

.row{
display:flex;
gap:12px;
}

input, textarea{
padding:12px;
border:1px solid #ccc;
font-size:14px;
font-family:inherit;
}

textarea{
min-height:120px;
resize:none;
}

button{
width:140px;
padding:10px;
background:#000;
color:#fff;
border:none;
cursor:pointer;
font-size:13px;
margin-top:10px;
}

/* ================= FOOTER (SIN CAMBIOS) ================= */

.footer{
background:#000;
color:#fff;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
color:#fff;
text-decoration:underline;
}

.footer-icons{
display:flex;
gap:12px;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
color:#fff;
text-decoration:underline;
margin-bottom:8px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="nav">
<a href="catalogo.html">CATÁLOGO</a>

</div>

</div>

<!-- BANNER -->
<div class="banner">
<img src="https://github.com/GarabatoCine/pagina-web/blob/main/Marimonda-tirita.png?raw=true">
</div>

<!-- CONTENIDO -->
<div class="container">

<!-- IZQUIERDA -->
<div class="left">

<div class="title-contact">Contacto</div>

<div class="location">Valledupar, Colombia</div>

<div class="social-title">Síguenos</div>

<div class="social-icons">

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

<a href="https://web.facebook.com/garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M13 17v-4h2l.3-2H13V9.8c0-.6.2-1 1-1h1.3V7.1C14.8 7 14 7 13.2 7 11.6 7 10.5 8 10.5 10v1H9v2h1.5v4H13z"></path>
</svg>
</a>

<a href="https://www.youtube.com/@garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M22 12s0-4-1-5-5-1-9-1-8 0-9 1-1 5-1 5 0 4 1 5 5 1 9 1 8 0 9-1 1-5 1-5z"></path>
<polygon points="10 15 15 12 10 9"></polygon>
</svg>
</a>

</div>

<div class="legal">
<a href="cookies.html">Política de Cookies</a>
<a href="politicadeprivacidad.html">Política de Privacidad</a>
</div>

</div>

<!-- DERECHA -->
<div class="right">

<div class="form-title">Déjanos tu mensaje</div>

<form>
<div class="row">
<input type="text" placeholder="Nombre">
<input type="text" placeholder="Apellido">
</div>

<input type="email" placeholder="Correo electrónico *" required>
<input type="text" placeholder="Teléfono">

<textarea placeholder="Mensaje *" required></textarea>

<button type="submit">Enviar</button>
</form>

</div>

</div>

<!-- FOOTER (SIN CAMBIOS) -->
<footer class="footer">

<div class="footer-line"></div>

<div class="footer-row">
<div class="footer-left">
<a href="contacto.html">Contacto</a>
</div>

<div class="footer-icons">
<!-- icons igual que ya tenías -->
</div>
</div>

<div class="footer-bottom">
<div class="footer-bottom-left">
<a href="cookies.html">Política de Cookies</a>
<a href="politicadeprivacidad.html">Política de Privacidad</a>
</div>

<div>© 2026 Garabato Cine</div>
</div>

</footer>

</body>
</html>
