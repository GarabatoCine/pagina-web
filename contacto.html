<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#222;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
font-weight:700;
}

.logo a{
font-size:24px;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
}

.lang .active{
opacity:0.45;
}

.lang a{
opacity:1;
text-decoration:none;
}

.lang a:hover{
opacity:0.7;
}

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= BANNER ================= */

.banner img{
width:100%;
height:420px;
object-fit:cover;
display:block;
}

/* ================= CONTACT SECTION ================= */

.contact-section{
background:#000;
color:#fff;
}

.contact-wrapper{
display:grid;
grid-template-columns:1fr 1fr;
gap:120px;
max-width:1600px;
margin:0 auto;
padding:50px 180px 80px;
}

/* LEFT COLUMN */

.contact-left{
padding-left:60px;
}

.contact-title{
font-family:'Inter', sans-serif;
font-size:60px;
font-weight:700;
line-height:1;
display:inline-block;
margin-bottom:35px;
}

.contact-underline{
width:100%;
height:4px;
background:#fff;
margin-top:8px;
}

.follow-title{
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:19px;
margin-bottom:18px;
}

.contact-social{
display:flex;
flex-direction:row;
gap:18px;
align-items:center;
}

.contact-social a{
display:inline-flex;
width:fit-content;
}

.contact-social svg{
width:42px;
height:42px;
stroke:#fff;
fill:none;
stroke-width:1.2;
}

/* RIGHT COLUMN */

.contact-right{
padding-right:60px;
}

.form-title{
font-family:'Inter', sans-serif;
font-size:36px;
font-weight:700;
line-height:1.1;
margin:0 0 25px;
}

.contact-form{
display:flex;
flex-direction:column;
gap:12px;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

input,
textarea{
width:100%;
padding:12px 16px;
border:none;
outline:none;
background:#fff;
color:#000;
font-family:'Roboto', sans-serif;
font-size:15px;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
background:#16a34a;
color:#fff;
border:none;
padding:10px 28px;
font-size:14px;
font-weight:500;
cursor:pointer;
align-self:flex-end;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
width:100%;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer a{
color:white;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
font-weight:100;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-bottom-right{
text-align:right;
line-height:1.8;
}

/* EN ESCRITORIO: ocultar Contacto, Síguenos y redes del footer */
@media (min-width:1025px){
.footer-left{
display:none;
}

.footer-right{
display:none;
}
}

/* ================= TABLET ================= */

@media (max-width:1024px){

body{
padding-top:86px;
}

.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
align-items:flex-start;
border:1px solid #eee;
gap:14px;
z-index:1001;
}

.nav.active{
display:flex;
}

.menu-toggle{
display:flex;
}

.banner img{
height:240px;
}

.contact-wrapper{
grid-template-columns:1fr;
gap:35px;
padding:30px 60px 50px;
}

.contact-left,
.contact-right{
padding:0;
}

.contact-title{
font-size:42px;
margin-bottom:8px;
}

.follow-title,
.contact-social{
display:none;
}

.form-title{
font-size:28px;
margin:0 0 20px;
}

.contact-form{
gap:10px;
}

.form-row{
grid-template-columns:1fr;
gap:10px;
}

input,
textarea{
padding:11px 14px;
font-size:14px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
padding:10px 28px;
font-size:14px;
}

.footer{
padding:50px 40px;
}

.footer-left{
display:none;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{
display:block;
text-align:left;
}

.footer-icons{
justify-content:flex-start;
}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{
text-align:left;
line-height:1.8;
}
}

/* ================= MOBILE ================= */

@media (max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

.banner img{
height:220px;
}

.contact-wrapper{
padding:35px 24px 60px;
gap:35px;
}

.contact-title{
font-size:34px;
margin-bottom:10px;
}

.form-title{
font-size:24px;
margin-bottom:24px;
}

input,
textarea{
padding:14px 16px;
font-size:15px;
}

textarea{
min-height:130px;
}

button{
padding:10px 28px;
font-size:14px;
}

.footer{
padding:50px 40px;
}

.footer-left{
display:none;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{
display:block;
text-align:left;
}

.footer-icons{
justify-content:flex-start;
}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{
text-align:left;
line-height:1.8;
}
}
</style>
</head>
