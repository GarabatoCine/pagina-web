<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#111;
padding:100px 40px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
z-index:1000;
}

.logo a{
text-decoration:none;
color:#000;
font-weight:500;
letter-spacing:2px;
text-transform:uppercase;
}

/* ================= LAYOUT ================= */

.container{
max-width:1100px;
margin:0 auto;
display:flex;
justify-content:space-between;
gap:80px;
}

/* ================= COLUMNA IZQUIERDA ================= */

.left{
flex:1;
}

.left h1{
font-size:72px;
font-weight:500;
letter-spacing:-1px;
line-height:1;
margin-bottom:20px;
}

.location{
font-size:14px;
color:#555;
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
}

.location svg{
width:16px;
height:16px;
stroke:#555;
fill:none;
stroke-width:1.5;
}

/* ================= COLUMNA DERECHA ================= */

.right{
flex:1;
}

.right h2{
font-size:36px;
font-weight:500;
margin-bottom:25px;
}

/* FORM */

form{
display:flex;
flex-direction:column;
gap:14px;
}

input, textarea{
width:100%;
padding:12px 14px;
border:1px solid #ddd;
font-size:14px;
font-family:inherit;
outline:none;
transition:0.2s;
}

input:focus, textarea:focus{
border-color:#999;
}

textarea{
min-height:140px;
resize:none;
}

/* BOTÓN PEQUEÑO NEGRO */

button{
width:auto;
align-self:flex-start;
padding:10px 22px;
background:#000;
color:#fff;
border:none;
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
cursor:pointer;
transition:0.2s;
}

button:hover{
opacity:0.85;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
flex-direction:column;
gap:50px;
}

.left h1{
font-size:48px;
}

.right h2{
font-size:28px;
}

body{
padding:90px 20px;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>
</div>

<!-- CONTENIDO -->
<div class="container">

<!-- IZQUIERDA -->
<div class="left">

<h1>Contacto</h1>

<div class="location">
<svg viewBox="0 0 24 24">
<path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"></path>
<circle cx="12" cy="9" r="2.5"></circle>
</svg>
Valledupar, Colombia
</div>

</div>

<!-- DERECHA -->
<div class="right">

<h2>Déjanos tu mensaje</h2>

<form action="https://formspree.io/f/xojrkwkj" method="POST">

<input type="text" name="nombre" placeholder="Nombre">

<input type="text" name="apellido" placeholder="Apellido">

<input type="tel" name="telefono" placeholder="Teléfono">

<input type="email" name="email" placeholder="Correo electrónico *" required>

<textarea name="mensaje" placeholder="Mensaje *" required></textarea>

<button type="submit">Enviar</button>

</form>

</div>

</div>

</body>
</html>
