<!DOCTYPE html>
<html lang="es">
<head>

<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter', sans-serif;
background:#fff;
color:#000;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
text-decoration:none;
color:#000;
letter-spacing:2px;
}

.nav{
display:flex;
gap:18px;
font-size:13px;
align-items:center;
}

.nav a{
text-decoration:none;
font-weight:500;
color:#000;
}

/* ================= BANNER ================= */

.banner{
width:100%;
height:auto;
}

.banner img{
width:100%;
display:block;
}

/* ================= TITLE ================= */

.page-title{
padding:30px 40px 10px;
font-size:36px;
font-weight:700;
}

/* ================= 2 COLUMN LAYOUT ================= */

.container{
display:flex;
gap:80px;
padding:40px;
}

/* LEFT */

.left{
width:40%;
}

.left h2{
font-size:38px;
font-weight:700;
margin-bottom:20px;
}

.location{
margin-top:20px;
font-size:16px;
}

/* RIGHT */

.right{
width:60%;
}

.right h2{
font-size:38px;
font-weight:700;
margin-bottom:20px;
}

/* FORM */

form{
display:flex;
flex-direction:column;
gap:12px;
max-width:500px;
}

.row{
display:flex;
gap:10px;
}

input, textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
font-family:'Inter', sans-serif;
}

textarea{
min-height:140px;
}

button{
width:140px;
padding:10px;
background:#000;
color:#fff;
border:none;
cursor:pointer;
font-size:13px;
}

/* ================= FOOTER (SIN CAMBIOS) ================= */

.footer{
background:#000;
color:white;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
margin-top:80px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
color:white;
text-decoration:underline;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
color:white;
margin-bottom:8px;
text-decoration:underline;
}

.footer-bottom-right{
text-align:right;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

.container{
flex-direction:column;
}

.left, .right{
width:100%;
}

}

</style>
</head>

</svg>
</a>

</div>

</div>

</div>

</html>
