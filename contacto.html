<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#111;
padding-top:74px;
}

/* ================= HEADER (ORIGINAL) ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
text-decoration:none;
color:#000;
letter-spacing:2px;
}

.nav{
display:flex;
gap:18px;
font-size:13px;
align-items:center;
}

.nav a{
text-decoration:none;
font-weight:500;
color:#000;
}

/* ================= LAYOUT ================= */

.container{
max-width:1200px;
margin:80px auto;
padding:0 40px;
display:grid;
grid-template-columns:1fr 1fr;
gap:80px;
}

/* ================= LEFT ================= */

.left h1{
font-size:88px; /* -20% aprox */
font-weight:900;
font-family:'Arial Black', Arial, sans-serif;
letter-spacing:-2px;
margin-bottom:20px;
}

/* ICONOS debajo de CONTACTO */
.social-icons{
display:flex;
gap:12px;
margin-top:10px;
}

.social-icons a svg{
width:22px;
height:22px;
stroke:#000;
fill:none;
stroke-width:1.5;
}

/* ubicación */
.location{
font-size:14px;
color:#666;
margin-top:20px;
}

/* ================= RIGHT ================= */

.right h2{
font-size:52px;
font-weight:900;
font-family:'Arial Black', Arial, sans-serif;
white-space:nowrap; /* UNA SOLA LÍNEA */
margin-bottom:20px;
}

form{
display:flex;
flex-direction:column;
gap:14px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

input, textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
font-family:'Roboto', sans-serif;
font-size:14px;
background:#fafafa;
outline:none;
}

textarea{
min-height:140px;
}

/* ================= BOTÓN ================= */

button{
width:25%;
padding:8px 14px;
background:#d60000;
color:#fff;
border:none;
cursor:pointer;
font-size:12px;
font-weight:500;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:#fff;
padding:70px 160px;
margin-top:120px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.3);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
color:#fff;
text-decoration:underline;
font-size:18px;
}

.footer-right{
text-align:right;
}

.footer-follow{
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:22px;
height:22px;
stroke:#fff;
fill:none;
stroke-width:1.5;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-size:13px;
}

.footer-bottom-left a{
display:block;
color:#fff;
text-decoration:underline;
margin-bottom:6px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
gap:50px;
}

.left h1{
font-size:64px;
}

.right h2{
font-size:34px;
white-space:normal;
}

button{
width:50%;
}

.footer{
padding:50px 40px;
}

.footer-bottom{
flex-direction:column;
gap:10px;
}

}

</style>
</head>
