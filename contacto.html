<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#222;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
}

.logo a{
font-size:24px;
font-weight:500;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
font-weight:500;
}

.lang .active{
opacity:0.45;
}

.lang a{
opacity:1;
text-decoration:none;
}

.lang a:hover{
opacity:0.7;
}

.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= BANNER ================= */

.banner img{
width:100%;
height:420px;
object-fit:cover;
display:block;
}

/* ================= CONTACT SECTION ================= */

.contact-section{
background:#000;
color:#fff;
}

.contact-wrapper{
display:grid;
grid-template-columns:1fr 1fr;
gap:120px;
max-width:1600px;
margin:0 auto;
padding:50px 180px 80px;
}

/* LEFT COLUMN */

.contact-left{
padding-left:60px;
}

.contact-title{
font-family:'Inter', sans-serif;
font-size:60px;
font-weight:700;
line-height:1;
display:inline-block;
margin-bottom:35px;
}

.contact-underline{
width:100%;
height:4px;
background:#ffc601;
margin-top:8px;
}

.follow-title{
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:19px;
margin-bottom:18px;
}

.contact-social{
display:flex;
flex-direction:row;
gap:18px;
align-items:center;
}

.contact-social a{
display:inline-flex;
width:fit-content;
}

.contact-social svg{
width:42px;
height:42px;
stroke:#fff;
fill:none;
stroke-width:1.2;
}

/* RIGHT COLUMN */

.contact-right{
padding-right:60px;
}

.form-title{
font-family:'Inter', sans-serif;
font-size:36px;
font-weight:700;
line-height:1.1;
margin:0 0 25px;
}

.contact-form{
display:flex;
flex-direction:column;
gap:12px;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

input,
textarea{
width:100%;
padding:12px 16px;
border:none;
outline:none;
background:#fff;
color:#000;
font-family:'Roboto', sans-serif;
font-size:15px;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
background:#ffc601;
color:#000;
border:none;
padding:10px 28px;
font-size:15px;
font-weight:700;
cursor:pointer;
align-self:flex-end;
}

/* ================= FOOTER ================= */

.sitio-footer {
background-color: #000000;
/* Alinear exactamente con los 180px de padding lateral de .contact-wrapper */
padding: 40px 180px;
border-top: 1px solid #1a1a1a;
width: 100%;
}

.fila-tres-columnas {
max-width: 1600px;
margin: 0 auto;
display: flex;
justify-content: space-between;
align-items: center;
position: relative;
}

.columna-izquierda {
text-align: left;
/* Anulamos el flex para controlar el ancho exacto y compensar los 60px de .contact-left */
width: calc(50% - 60px); 
padding-left: 60px;
}

.columna-izquierda h4 {
font-family: 'Roboto', sans-serif;
font-size: 22px;
font-weight: 500;
letter-spacing: normal;
margin-bottom: 6px;
color: #fff; 
}

.columna-izquierda p {
font-size: clamp(10px, 1.2vw, 13px);
color: #888888;
white-space: nowrap;
}

.columna-central {
display: flex;
justify-content: center;
gap: 25px;
position: absolute;
left: 50%;
transform: translateX(-50%);
}

.columna-central a {
color: #ffffff;
font-size: 18px;
transition: color 0.3s ease;
}

.columna-central a:hover {
color: #FFC601;
}

.columna-derecha {
text-align: right;
/* Anulamos el flex para controlar el ancho exacto y compensar los 60px de .contact-right */
width: calc(50% - 60px);
padding-right: 60px;
}

.columna-derecha p {
font-size: 13px;
color: #888888;
line-height: 1.6;
}

.texto-chico {
font-size: 11.5px !important;
color: #888888;
}

.footer-link-normal {
display: inline-block;
font-size: 13px;
color: inherit; 
text-decoration: underline;
transition: color 0.3s ease;
}

.footer-link-normal:hover {
color: #FFC601;
}

/* ================= TABLET / MÓVIL (FOOTER ADAPTABLE) ================= */

@media (min-width:1025px){
  /* Ocultamos las redes sociales del footer solo en PC */
  .columna-central {
    display: none;
  }
}

@media (max-width:1024px){

body{
padding-top:86px;
}

.nav{
display:none;
flex-direction:column;
position:absolute;
top:100%;
left:0;
width:100%;
background:#fff;
padding:20px;
gap:20px;
border-bottom:1px solid #eee;
align-items:flex-start;
z-index:1001;
}

.nav.active{
display:flex;
}

.lang {
margin-top: 10px;
}

.menu-toggle{
display:flex;
}

.banner img{
height:240px;
}

.contact-wrapper{
grid-template-columns:1fr;
gap:35px;
padding:30px 60px 50px;
}

.contact-left,
.contact-right{
padding:0;
}

.contact-title{
font-size:42px;
margin-bottom:8px;
}

.follow-title,
.contact-social{
display:none;
}

.form-title{
font-size:28px;
margin:0 0 20px;
}

.contact-form{
gap:10px;
}

.form-row{
grid-template-columns:1fr;
gap:10px;
}

input,
textarea{
padding:11px 14px;
font-size:14px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
padding:10px 28px;
font-size:14px;
}

.sitio-footer {
padding: 40px 40px;
}

.fila-tres-columnas {
flex-direction: column;
gap: 25px;
text-align: center;
width: 100% !important;
}

.columna-izquierda, .columna-derecha {
text-align: center;
padding-left: 0 !important;
padding-right: 0 !important;
width: 100% !important;
}

.columna-central {
position: relative;
left: auto;
transform: none;
}

.columna-derecha {
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
}

.columna-derecha .link-linea-1 {
order: 1;
}

.columna-derecha .texto-linea-2 {
order: 2;
}

.columna-derecha .texto-linea-3 {
order: 3;
}
}

@media (max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

.banner img{
height:220px;
}

.contact-wrapper{
padding:35px 24px 60px;
gap:35px;
}

.contact-title{
font-size:34px;
margin-bottom:10px;
}

.form-title{
font-size:24px;
margin-bottom:24px;
}

input,
textarea{
padding:14px 16px;
font-size:15px;
}

textarea{
min-height:130px;
}

button{
padding:10px 28px;
font-size:14px;
}

.sitio-footer {
padding: 40px 25px;
}

.fila-tres-columnas {
flex-direction: column;
gap: 25px;
text-align: center;
width: 100% !important;
}

.columna-izquierda, .columna-derecha {
text-align: center;
padding-left: 0 !important;
padding-right: 0 !important;
width: 100% !important;
}

.columna-central {
position: relative;
left: auto;
transform: none;
}

.columna-derecha {
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
}

.columna-derecha .link-linea-1 {
order: 1;
}

.columna-derecha .texto-linea-2 {
order: 2;
}

.columna-derecha .texto-linea-3 {
order: 3;
}
}
</style>
</head>
