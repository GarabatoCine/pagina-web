<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#222;
padding-top:74px;
line-height:1.6;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
font-weight:700;
text-decoration:none;
}

.logo a{
font-size:24px;
letter-spacing:2px;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.lang .active{
opacity:0.45;
}

.lang a{
opacity:1;
}

/* ================= BANNER ================= */

.banner img{
width:100%;
display:block;
height:320px;
object-fit:cover;
}

/* ================= CONTACT SECTION ================= */

.contact-section{
display:grid;
grid-template-columns:40% 60%;
gap:80px;
padding:90px 140px;
background:#fff;
}

.contact-left{
padding-left:120px;
}

.contact-title{
font-family:'Inter', sans-serif;
font-size:52px;
font-weight:700;
color:#000;
margin-bottom:8px;
display:inline-block;
}

.contact-underline{
width:100%;
max-width:165px;
height:3px;
background:#000;
margin-bottom:55px;
}

.follow-title{
font-family:'Century Gothic', sans-serif;
font-size:21px;
font-weight:100;
color:#000;
margin-bottom:18px;
}

.contact-social{
display:flex;
flex-direction:column;
gap:18px;
}

.contact-social a{
display:inline-flex;
width:fit-content;
}

.contact-social svg{
width:36px;
height:36px;
stroke:#000;
fill:none;
stroke-width:1.2;
}

.contact-right{
padding-right:40px;
}

.form-title{
font-family:'Inter', sans-serif;
font-size:48px;
font-weight:700;
color:#000;
margin-bottom:30px;
margin-top:8px;
white-space:nowrap;
}

.contact-form{
display:flex;
flex-direction:column;
gap:15px;
}

.two-columns{
display:flex;
gap:15px;
}

.two-columns input{
width:50%;
}

input,
textarea{
width:100%;
padding:12px 14px;
border:1px solid #ccc;
background:#fff;
color:#000;
font-size:14px;
font-family:'Roboto', sans-serif;
}

textarea{
min-height:140px;
resize:vertical;
}

button{
width:140px;
padding:10px 0;
background:#1faa3a;
color:#fff;
border:none;
cursor:pointer;
font-weight:700;
font-family:'Roboto', sans-serif;
margin-top:10px;
align-self:flex-end;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
width:100%;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer a{
color:white;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
font-weight:100;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-bottom-right{
text-align:right;
line-height:1.8;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

.banner img{
height:220px;
}

.contact-section{
grid-template-columns:1fr;
gap:50px;
padding:50px 24px;
}

.contact-left{
padding-left:0;
}

.contact-right{
padding-right:0;
}

.contact-title{
font-size:42px;
}

.contact-underline{
max-width:135px;
margin-bottom:40px;
}

.form-title{
font-size:34px;
white-space:normal;
margin-top:0;
}

.two-columns{
flex-direction:column;
}

.two-columns input{
width:100%;
}

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{
text-align:left;
}

.footer-icons{
justify-content:flex-start;
}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{
text-align:left;
}
}
</style>
</head>
