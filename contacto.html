<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter', sans-serif;
background:#fff;
color:#111;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:600;
text-decoration:none;
color:#000;
letter-spacing:2px;
}

.nav{
display:flex;
gap:18px;
font-size:13px;
align-items:center;
}

.nav a{
text-decoration:none;
font-weight:500;
color:#000;
}

/* CONTACTO SIN SUBRAYADO */
.nav a.active{
text-decoration:none;
}

/* ================= LAYOUT ================= */

.container{
max-width:1200px;
margin:80px auto;
padding:0 40px;
display:grid;
grid-template-columns:1fr 1fr;
gap:80px;
}

/* ================= LEFT ================= */

.left h1{
font-size:64px;
font-weight:600;
letter-spacing:-1px;
margin-bottom:20px;
}

/* UBICACIÓN */
.location{
font-size:14px;
color:#666;
margin-top:10px;
display:flex;
align-items:center;
gap:8px;
}

/* ================= RIGHT ================= */

.right h2{
font-size:34px;   /* MÁS GRANDE */
font-weight:700;  /* MÁS NEGRITA */
margin-bottom:20px;
letter-spacing:-0.5px;
}

form{
display:flex;
flex-direction:column;
gap:14px;
}

input, textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
font-family:'Inter', sans-serif;
font-size:14px;
background:#fafafa;
outline:none;
}

textarea{
min-height:140px;
resize:none;
}

input:focus, textarea:focus{
border-color:#000;
background:#fff;
}

/* ================= BOTÓN ================= */

button{
width:auto;
padding:8px 14px;     /* MÁS PEQUEÑO */
background:#d60000;   /* ROJO */
color:#fff;
border:none;
cursor:pointer;
font-size:12px;       /* MÁS PEQUEÑO */
font-weight:500;
margin-top:10px;
border-radius:2px;
}

button:hover{
opacity:0.85;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:#fff;
padding:70px 160px;
margin-top:120px;
font-family:'Inter', sans-serif;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.3);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
color:#fff;
font-size:18px;
text-decoration:underline;
text-underline-offset:4px;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-size:13px;
}

.footer-bottom-left a{
display:block;
color:#fff;
margin-bottom:6px;
text-decoration:underline;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
gap:50px;
}

.left h1{
font-size:42px;
}

.footer{
padding:50px 40px;
}

.footer-bottom{
flex-direction:column;
gap:10px;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="nav">
<a href="catalogo.html">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
<a href="contacto.html" class="active">CONTACTO</a>
</div>

</div>

<!-- CONTENT -->
<div class="container">

<!-- LEFT -->
<div class="left">
<h1>Contacto</h1>

<div class="location">
📍 Valledupar, Colombia
</div>
</div>

<!-- RIGHT -->
<div class="right">

<h2>Dejanos tu mensaje</h2>

<form action="mailto:garabatocine@gmail.com" method="post" enctype="text/plain">

<input type="text" name="nombre" placeholder="Nombre">
<input type="text" name="apellido" placeholder="Apellido">
<input type="text" name="telefono" placeholder="Teléfono">
<input type="email" name="correo" placeholder="Correo electrónico *" required>

<textarea name="mensaje" placeholder="Mensaje *" required></textarea>

<button type="submit">Enviar</button>

</form>

</div>

</div>

<!-- FOOTER -->
<footer class="footer">

<div class="footer-line"></div>

<div class="footer-bottom">

<div class="footer-bottom-left">
<a href="cookies.html">Política de Cookies</a>
<a href="politicadeprivacidad.html">Política de Privacidad</a>
</div>

<div>
<div>Garabato Cine</div>
<div>Todos los derechos reservados</div>
</div>

</div>

</footer>

</body>
</html>
