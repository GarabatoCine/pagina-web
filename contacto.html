<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Garabato Cine</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            color: white;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: white;
        }

        /* HEADER */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            transition: all 0.3s ease;
        }

        .nav {
            display: flex;
            gap: 40px;
            align-items: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .nav a {
            color: white;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #FFC601;
        }

        .lang {
            display: flex;
            gap: 8px;
        }

        .lang .active {
            opacity: .5;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 110;
        }

        /* FOOTER BASE */
        .sitio-footer {
            background-color: #000000;
            padding: 40px 60px;
            border-top: 1px solid #1a1a1a;
            width: 100%;
            margin-top: auto; /* Para empujar el footer abajo si se usa flexbox en el body */
        }

        .fila-tres-columnas {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .columna-izquierda {
            text-align: left;
            flex: 1;
        }

        .columna-izquierda h4 {
            font-family: 'Oswald', sans-serif;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .columna-izquierda p {
            font-size: clamp(10px, 1.2vw, 13px);
            color: #888888;
            white-space: nowrap;
        }

        .columna-central {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex: 1;
            opacity: 0; /* Oculto en PC */
            pointer-events: none;
        }

        .columna-central a {
            color: #ffffff;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .columna-central a:hover {
            color: #FFC601;
        }

        .columna-derecha {
            text-align: right;
            flex: 1;
        }

        .columna-derecha p {
            font-size: 13px;
            color: #888888;
            line-height: 1.6;
        }

        /* Estilos de fuente ligeramente más pequeña para las líneas 2 y 3 */
        .texto-chico {
            font-size: 11.5px !important;
            color: #888888;
        }
        
        /* Enlaces footer normales con subrayado permanente y color heredado (#888888) */
        .footer-link-normal {
            display: inline-block;
            font-size: 13px;
            color: inherit; 
            text-decoration: underline; /* Subrayado forzado */
            transition: color 0.3s ease;
        }

        .footer-link-normal:hover {
            color: #FFC601;
        }

        /* RESPONSIVE DISPOSITIVOS (TABLETS) */
        @media(max-width: 1024px) {
            .header { 
                padding: 20px 40px; 
            }

            .brand-logo {
                font-size: 18px; 
            }
            
            .menu-toggle { 
                display: block; 
            }

            .nav {
                display: none; 
                flex-direction: column;
                position: absolute;
                top: 70px; 
                right: 40px;
                background: rgba(10, 10, 10, 0.98);
                border: 1px solid #222;
                padding: 30px;
                gap: 25px;
                align-items: flex-start;
                width: 220px;
                box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
                z-index: 200;
            }

            .nav.open { 
                display: flex; 
            }
        }

        /* RESPONSIVE EXCLUSIVO PARA MÓVILES Y TABLETS */
        @media(max-width: 767px) {
            .header { 
                padding: 15px 25px; 
            }

            .brand-logo {
                font-size: 16px; 
                letter-spacing: 1px;
            }

            .nav { right: 25px; top: 60px; }

            .fila-tres-columnas {
                flex-direction: column;
                gap: 25px;
                text-align: left;
            }
            
            .columna-izquierda {
                text-align: left;
                width: 100%;
            }
            
            .columna-izquierda h4, .columna-izquierda p {
                text-align: left;
            }
            
            .columna-izquierda p {
                font-size: 11.5px;
            }

            /* Mostrar y centrar redes sociales en móviles y tablets */
            .columna-central {
                opacity: 1;
                pointer-events: auto;
                display: flex;
                justify-content: center;
                width: 100%;
                order: 2;
            }
            
            .columna-central a {
                color: #ffffff;
                font-size: 20px;
            }

            .columna-derecha {
                text-align: left;
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                order: 3;
            }
            
            .columna-derecha p {
                text-align: left;
            }
            
            .columna-derecha .link-linea-1 {
                order: 1;
            }

            .columna-derecha .texto-linea-2 {
                order: 2;
            }

            .columna-derecha .texto-linea-3 {
                order: 3;
            }
        }
    </style>
    </head>
<body>

    <header class="header">
        <div class="brand-logo">GARABATO CINE</div>

        <button class="menu-toggle" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="nav" id="navMenu">
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="nosotros.html">NOSOTROS</a>
            <div class="lang">
                <span class="active">ES</span>
                <span>/</span>
                <a href="#">EN</a>
            </div>
        </div>
    </header>

    <main style="margin-top: 150px; padding: 0 60px; min-height: 50vh;">
        <h1>Contacto</h1>
        <p>Escríbenos para más información sobre nuestros proyectos.</p>
    </main>
    <footer class="sitio-footer">
        <div class="fila-tres-columnas">
            <div class="columna-izquierda">
                <h4>GARABATO CINE</h4>
                <p>Cine hecho desde el Caribe colombiano.</p>
            </div>
            
            <div class="columna-central">
                <a href="https://www.instagram.com/garabatocine/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/garabatocine?_rdc=1&_rdr" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="http://www.youtube.com/channel/UC4vuld7vS7GhKcBf2dv0fJw" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            </div>
            
            <div class="columna-derecha">
                <p class="link-linea-1"><a href="privacidadycookies.html" class="footer-link-normal" target="_blank">Privacidad y cookies</a></p>
                <p class="texto-chico texto-linea-2">Todos los derechos reservados</p>
                <p class="texto-chico texto-linea-3">© 2026 Garabato Cine</p>
            </div>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');

        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('open');
        });
    </script>
</body>
</html>
