<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:500;
text-decoration:none;
color:#000;
letter-spacing:2px;
}

.nav{
display:flex;
gap:18px;
font-size:13px;
align-items:center;
}

.nav a{
text-decoration:none;
font-weight:500;
color:#000;
}

/* ================= SPLIT LAYOUT ================= */

.container{
display:flex;
height:100vh;
padding-top:74px;
}

/* ===== LEFT (40%) ===== */

.left{
width:40%;
background:#fff;
padding:80px 60px;
color:#000;
display:flex;
flex-direction:column;
justify-content:flex-start;
}

.left h1{
font-size:72px;
font-weight:400;
text-decoration:underline;
margin-bottom:30px;
}

/* ubicación */
.location{
font-size:16px;
margin-bottom:60px;
}

/* síguenos */
.follow{
font-size:14px;
margin-bottom:15px;
margin-top:60px;
}

/* iconos */
.social{
display:flex;
gap:14px;
margin-bottom:60px;
}

.social svg{
width:20px;
height:20px;
stroke:#000;
fill:none;
stroke-width:1.5;
}

/* links inferiores */
.links{
font-size:13px;
display:flex;
flex-direction:column;
gap:10px;
margin-top:40px;
}

.links a{
color:#000;
text-decoration:underline;
}

/* ===== RIGHT (60%) ===== */

.right{
width:60%;
background:#000;
color:#fff;
padding:80px 80px;
display:flex;
flex-direction:column;
justify-content:center;
}

.right h2{
font-size:64px;
font-weight:400;
margin-bottom:40px;
white-space:nowrap;
}

/* form */
form{
display:flex;
flex-direction:column;
gap:14px;
max-width:500px;
}

.row{
display:flex;
gap:12px;
}

input, textarea{
width:100%;
padding:12px;
border:1px solid #444;
background:#111;
color:#fff;
font-family:Arial;
outline:none;
}

textarea{
min-height:140px;
}

/* botón */
button{
width:120px;
padding:8px;
background:#d60000;
color:#fff;
border:none;
cursor:pointer;
font-size:12px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
flex-direction:column;
height:auto;
}

.left, .right{
width:100%;
}

.right h2{
white-space:normal;
font-size:42px;
}

}

</style>
</head>

<body>

<!-- HEADER (sin “Contacto”) -->
<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="nav">
<a href="catalogo.html">CATÁLOGO</a>
<a href="#">NOSOTROS</a>
<a href="#">PRÓXIMAMENTE</a>
</div>

</div>

<!-- SPLIT -->
<div class="container">

<!-- LEFT -->
<div class="left">

<h1>Contacto</h1>

<div class="location">
Valledupar, Colombia
</div>

<div class="follow">Síguenos</div>

<div class="social">

<a href="https://www.instagram.com/garabatocine/" target="_blank">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17" cy="7" r="1.5"></circle>
</svg>
</a>

<a href="https://web.facebook.com/garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
</svg>
</a>

<a href="https://www.youtube.com/@garabatocine" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M22 12s0-4-1-5-5-1-9-1-8 0-9 1-1 5-1 5 0 4 1 5 5 1 9 1 8 0 9-1 1-5 1-5z"></path>
<polygon points="10 15 15 12 10 9"></polygon>
</svg>
</a>

</div>

<div class="links">
<a href="politicadeprivacidad.html">Política de Privacidad</a>
<a href="cookies.html">Política de Cookies</a>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<h2>Déjanos tu mensaje</h2>

<form action="mailto:garabatocine@gmail.com" method="post">

<div class="row">
<input type="text" placeholder="Nombre">
<input type="text" placeholder="Apellido">
</div>

<input type="email" placeholder="Correo electrónico *" required>
<input type="text" placeholder="Teléfono">
<textarea placeholder="Mensaje *" required></textarea>

<button type="submit">Enviar</button>

</form>

</div>

</div>

</body>
</html>
