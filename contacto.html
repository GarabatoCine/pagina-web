<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#111;
padding:80px 20px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
}

.logo a{
text-decoration:none;
color:#000;
font-weight:500;
letter-spacing:2px;
text-transform:uppercase;
}

/* ================= CONTENIDO ================= */

.container{
max-width:720px;
margin:0 auto;
padding-top:60px;
}

.title{
font-size:22px;
font-weight:500;
text-decoration:underline;
text-underline-offset:4px;
margin-bottom:10px;
}

.subtitle{
font-size:16px;
color:#444;
margin-bottom:35px;
}

/* ================= UBICACIÓN ================= */

.location{
display:flex;
align-items:center;
gap:10px;
font-size:14px;
color:#444;
margin-bottom:40px;
}

.location svg{
width:18px;
height:18px;
stroke:#444;
fill:none;
stroke-width:1.5;
}

/* ================= FORMULARIO ================= */

form{
display:flex;
flex-direction:column;
gap:16px;
}

/* cajas visibles */

input, textarea{
width:100%;
padding:12px 14px;
border:1px solid #ddd;
border-radius:4px;
font-size:14px;
font-family:inherit;
outline:none;
transition:0.2s;
}

input:focus, textarea:focus{
border-color:#999;
}

/* textarea mensaje */

textarea{
min-height:140px;
resize:none;
}

/* botón bermellón */

button{
margin-top:10px;
padding:14px;
background:#b11226;
color:#fff;
border:none;
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
cursor:pointer;
transition:0.2s;
}

button:hover{
opacity:0.85;
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){
.header{
padding:16px 20px;
}
.container{
padding-top:40px;
}
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>
</div>

<!-- CONTENIDO -->
<div class="container">

<div class="title">Contacto</div>

<div class="subtitle">
Déjanos tu mensaje
</div>

<!-- UBICACIÓN -->
<div class="location">
<svg viewBox="0 0 24 24">
<path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"></path>
<circle cx="12" cy="9" r="2.5"></circle>
</svg>
Valledupar, Colombia
</div>

<!-- FORMULARIO -->
<form action="https://formspree.io/f/xojrkwkj" method="POST">

<input type="text" name="nombre" placeholder="Nombre">

<input type="text" name="apellido" placeholder="Apellido">

<input type="tel" name="telefono" placeholder="Teléfono">

<input type="email" name="email" placeholder="Correo electrónico *" required>

<textarea name="mensaje" placeholder="Mensaje *" required></textarea>

<button type="submit">Enviar mensaje</button>

</form>

</div>

</body>
</html>
