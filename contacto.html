<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter', sans-serif;
background:#fff;
color:#000;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a{
font-size:24px;
font-weight:700; /* 🔥 FIX: bold real */
text-decoration:none;
color:#000;
letter-spacing:2px;
}

.nav{
display:flex;
gap:18px;
font-size:13px;
align-items:center;
}

.nav a{
text-decoration:none;
font-weight:600;
color:#000;
}

/* ================= BANNER ================= */

.banner img{
width:100%;
display:block;
}

/* ================= LAYOUT ================= */

.container{
display:flex;
gap:80px;
padding:10px 40px 40px; /* 🔥 más pegado al banner */
}

/* LEFT */

.left{
width:40%;
}

/* 🔥 CONTACTO PRINCIPAL (AJUSTADO) */
.left h2{
font-size:110px; /* +200% aprox */
font-weight:700;
margin-top:20px;
margin-bottom:40px;
margin-left:40px; /* corrido hacia la derecha estilo Ciudad Lunar */
}

/* UBICACIÓN */
.location{
font-size:16px;
margin-left:40px;
display:flex;
align-items:center;
gap:8px;
}

/* ICONO UBICACIÓN */
.location svg{
width:16px;
height:16px;
}

/* ================= RIGHT ================= */

.right{
width:60%;
}

.right h2{
font-size:42px;
font-weight:700;
margin-bottom:20px;
}

/* FORM */

form{
display:flex;
flex-direction:column;
gap:12px;
max-width:500px;
}

.row{
display:flex;
gap:10px;
}

input, textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
font-family:'Inter', sans-serif;
}

textarea{
min-height:140px;
}

button{
width:140px;
padding:10px;
background:#000;
color:#fff;
border:none;
cursor:pointer;
font-size:13px;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
margin-top:60px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
color:white;
text-decoration:underline;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

/* 🔥 FIX FACEBOOK ICON */
.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

/* FOOTER BOTTOM */

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
color:white;
margin-bottom:8px;
text-decoration:underline;
}

.footer-bottom-right{
text-align:right;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

.container{
flex-direction:column;
}

.left, .right{
width:100%;
}

.left h2{
font-size:70px;
margin-left:0;
}

.location{
margin-left:0;
}

}

</style>
</head>

</div>

</div>
