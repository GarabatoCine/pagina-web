<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#000;
color:#fff;
padding-top:74px;
}

/* ================= HEADER (SIN CAMBIOS) ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
font-weight:700;
text-decoration:none;
}

.logo a{
font-size:24px;
letter-spacing:2px;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.menu-toggle{
display:none;
}

/* ================= HERO BANNER ================= */

.banner{
width:100%;
height:320px;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* ================= LAYOUT ================= */

.container{
display:flex;
justify-content:space-between;
gap:80px;
padding:80px 140px;
}

/* ================= LEFT ================= */

.left{
width:40%;
}

.contact-title{
font-size:54px; /* +30% */
font-weight:700;
position:relative;
margin-bottom:30px;
}

.contact-title::after{
content:"";
display:block;
width:100%;
height:4px;
background:#fff;
margin-top:10px;
}

.location{
display:flex;
align-items:center;
gap:10px;
margin-top:30px;
font-size:16px;
}

.location svg{
width:18px;
height:18px;
stroke:#fff;
fill:none;
}

/* SOCIAL */

.social-title{
margin-top:50px;
font-size:14px;
font-weight:400;
opacity:0.8;
}

.social-icons{
display:flex;
gap:15px;
margin-top:15px;
}

.social-icons svg{
width:26px;
height:26px;
stroke:#fff;
fill:none;
}

/* ================= RIGHT ================= */

.right{
width:60%;
}

.right h2{
font-size:48px;
font-weight:700;
margin-bottom:30px;
}

form{
display:flex;
flex-direction:column;
gap:15px;
}

.row{
display:flex;
gap:15px;
}

input, textarea{
width:100%;
padding:12px;
background:transparent;
border:1px solid #555;
color:#fff;
font-size:14px;
}

textarea{
min-height:120px;
resize:none;
}

button{
width:140px;
padding:10px;
background:#fff;
color:#000;
border:none;
cursor:pointer;
font-weight:700;
margin-top:10px;
}

/* ================= FOOTER (IGUAL ORIGINAL) ================= */

.footer{
background:#000;
color:white;
width:100%;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
}

.footer-left a{
font-size:19px;
color:white;
text-decoration:underline;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
color:white;
margin-bottom:8px;
text-decoration:underline;
}

.footer-bottom-right{
text-align:right;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

.container{
flex-direction:column;
padding:40px 25px;
}

.left, .right{
width:100%;
}

.footer{
padding:50px 40px;
}

.footer-row{
flex-direction:column;
gap:30px;
}

.footer-right{
text-align:left;
}

.footer-icons{
justify-content:flex-start;
}

.footer-bottom{
flex-direction:column;
gap:20px;
}

.footer-bottom-right{
text-align:left;
}

}

</style>
</head>
