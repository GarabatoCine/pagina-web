<!-- ================= CONTACT SECTION ================= -->

<div class="contact-title">
Contacto
<div class="contact-underline"></div>
</div>

<div class="follow-title">Síguenos</div>

<!-- ================= CSS CORREGIDO ================= -->

<style>

/* TÍTULO CONTACTO */
.contact-title{
font-family:'Inter', sans-serif;
font-size:82px; /* reducido 2 puntos */
font-weight:700;
line-height:1;
display:inline-block;
margin-bottom:60px;
}

/* SUBRAYADO */
.contact-underline{
width:100%;
height:4px;
background:#fff;
margin-top:8px;
}

/* SÍGUENOS (misma fuente del footer) */
.follow-title{
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:19px;
margin-bottom:18px;
}

/* TÍTULO DÉJANOS TU MENSAJE */
.form-title{
font-family:'Inter', sans-serif;
font-size:50px; /* reducido 2 puntos */
font-weight:700;
line-height:1.1;
margin:10px 0 40px;
}

/* ================= FOOTER ================= */

/* Ocultar "Contacto" del footer en PC */
@media (min-width:1025px){
.footer-left{
display:none;
}
}

/* ================= TABLET ================= */
@media (max-width:1024px){

.contact-title{
font-size:54px;
margin-bottom:10px;
}

.form-title{
font-size:32px;
margin-top:0;
margin-bottom:30px;
}

/* En tablet el footer vuelve a mostrar "Síguenos" */
.footer-left{
display:none;
}

}

/* ================= MOBILE ================= */
@media (max-width:768px){

.contact-title{
font-size:42px;
margin-bottom:10px;
}

.form-title{
font-size:28px;
margin-bottom:28px;
}

/* En móvil también ocultar "Contacto" del footer */
.footer-left{
display:none;
}

}

</style>
