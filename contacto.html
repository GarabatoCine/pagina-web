
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#111;
padding-top:80px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
border-bottom:1px solid #eee;
z-index:1000;
text-transform:uppercase;
}

.logo a{
font-size:22px;
font-weight:500;
text-decoration:none;
color:#000;
letter-spacing:2px;
}

.nav a{
margin-left:18px;
font-size:13px;
text-decoration:none;
color:#000;
font-weight:500;
}

/* ================= HERO ================= */

.hero{
max-width:1100px;
margin:auto;
padding:90px 40px 30px;
}

.hero h1{
font-size:44px;
font-weight:500;
margin-bottom:10px;
}

.hero p{
font-size:16px;
color:#555;
max-width:600px;
line-height:1.6;
}

/* ================= CONTACT LAYOUT ================= */

.contact{
max-width:1100px;
margin:40px auto 120px;
padding:0 40px;
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
}

/* INFO */

.info{
font-size:15px;
color:#444;
line-height:1.8;
}

.info h3{
font-size:18px;
margin-bottom:10px;
color:#000;
}

/* FORM */

form{
display:flex;
flex-direction:column;
gap:16px;
}

input, textarea{
border:none;
border-bottom:1px solid #ccc;
padding:12px 0;
font-size:15px;
outline:none;
background:transparent;
font-family:inherit;
}

textarea{
min-height:130px;
resize:none;
}

button{
margin-top:10px;
padding:14px 18px;
background:#000;
color:#fff;
border:none;
cursor:pointer;
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
transition:0.2s ease;
}

button:hover{
opacity:0.85;
}

/* ================= FOOTER ================= */

.footer{
text-align:center;
padding:60px 20px;
font-size:13px;
color:#777;
border-top:1px solid #eee;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

.hero h1{
font-size:32px;
}

.contact{
grid-template-columns:1fr;
gap:40px;
padding:0 25px;
}

.header{
padding:16px 22px;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">
<a href="index.html">GARABATO CINE</a>
</div>

<div class="nav">
<a href="catalogo.html">CATÁLOGO</a>
<a href="contacto.html">CONTACTO</a>
</div>

</div>

<!-- HERO -->
<section class="hero">
<h1>Contacto</h1>
<p>
Escríbenos para proyectos, colaboraciones o información general. Respondemos lo antes posible.
</p>
</section>

<!-- CONTACT -->
<section class="contact">

<!-- INFO -->
<div class="info">
<h3>Garabato Cine</h3>

<p>
Producción audiovisual independiente<br>
Colombia<br><br>

Email directo:<br>
contacto@garabatocine.com
</p>
</div>

<!-- FORM -->
<form action="https://formspree.io/f/xojrkwkj" method="POST">

<!-- opcional: asunto visible en email -->
<input type="hidden" name="_subject" value="Nuevo mensaje desde Garabato Cine">

<input type="text" name="nombre" placeholder="Nombre" required>

<input type="email" name="email" placeholder="Correo electrónico" required>

<input type="text" name="asunto" placeholder="Asunto">

<textarea name="mensaje" placeholder="Mensaje" required></textarea>

<button type="submit">Enviar mensaje</button>

</form>

</section>

<!-- FOOTER -->
<footer class="footer">
© 2026 Garabato Cine — Todos los derechos reservados
</footer>

</body>
</html>
