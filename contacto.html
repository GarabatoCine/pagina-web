<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Garabato Cine</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body{
width:100%;
overflow-x:hidden;
}

body{
font-family:'Roboto', sans-serif;
background:#fff;
color:#222;
padding-top:74px;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
border-bottom:1px solid #eee;
text-transform:uppercase;
}

.logo a,
.nav a,
.lang span,
.lang a{
color:#000;
font-weight:700;
}

.logo a{
font-size:24px;
letter-spacing:2px;
text-decoration:none;
}

.nav{
display:flex;
align-items:center;
gap:18px;
font-size:13px;
}

.nav a{
text-decoration:none;
}

.lang .active{
opacity:0.45;
}

.lang a{
opacity:1;
text-decoration:none;
}

.lang a:hover{
opacity:0.7;
}

/* Hamburguesa */
.menu-toggle{
display:none;
flex-direction:column;
gap:4px;
cursor:pointer;
}

.menu-toggle span{
width:22px;
height:2px;
background:#000;
display:block;
}

/* ================= BANNER ================= */

.banner img{
width:100%;
height:420px;
object-fit:cover;
display:block;
}

/* ================= CONTACT SECTION ================= */

.contact-section{
background:#000;
color:#fff;
display:grid;
grid-template-columns:40% 60%;
gap:80px;
padding:90px 120px 110px;
}

.contact-left{
padding-left:90px;
}

.contact-title{
font-family:'Inter', sans-serif;
font-size:84px;
font-weight:700;
line-height:1;
display:inline-block;
}

.contact-underline{
width:210px;
height:4px;
background:#fff;
margin-top:10px;
margin-bottom:32px;
}

.location{
font-size:17px;
font-weight:300;
margin-bottom:50px;
display:flex;
align-items:center;
gap:8px;
color:#fff;
}

.location svg{
width:16px;
height:16px;
stroke:#fff;
fill:none;
stroke-width:2;
}

.follow-title{
font-family:'Helvetica Neue', Arial, sans-serif;
font-size:21px;
font-weight:700;
margin-bottom:20px;
}

.contact-social{
display:flex;
flex-direction:column;
gap:16px;
}

.contact-social a svg{
width:34px;
height:34px;
stroke:#fff;
fill:none;
stroke-width:1.2;
}

/* Right column */

.form-title{
font-family:'Inter', sans-serif;
font-size:54px;
font-weight:700;
line-height:1.1;
margin-bottom:35px;
color:#fff;
}

.contact-form{
display:flex;
flex-direction:column;
gap:18px;
}

.two-columns{
display:flex;
gap:18px;
}

.two-columns input{
width:50%;
}

input,
textarea{
width:100%;
padding:16px 18px;
border:none;
outline:none;
background:#fff;
color:#000;
font-family:'Roboto', sans-serif;
font-size:15px;
}

textarea{
min-height:180px;
resize:vertical;
}

button{
background:#2e7d32;
color:#fff;
border:none;
padding:12px 30px;
font-size:13px;
font-weight:500;
cursor:pointer;
align-self:flex-end;
}

/* ================= FOOTER ================= */

.footer{
background:#000;
color:white;
width:100%;
padding:70px 160px;
font-family:'Century Gothic', sans-serif;
font-weight:100;
font-size:15px;
}

.footer a{
color:white;
}

.footer-line{
height:1px;
background:rgba(255,255,255,0.4);
margin:50px 0;
}

.footer-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.footer-left a{
font-size:19px;
font-weight:100;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-right{
text-align:right;
}

.footer-follow{
font-size:19px;
margin-bottom:15px;
font-weight:100;
}

.footer-icons{
display:flex;
gap:12px;
justify-content:flex-end;
}

.footer-icons svg{
width:24px;
height:24px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.footer-bottom{
display:flex;
justify-content:space-between;
margin-top:30px;
font-weight:100;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
text-decoration:underline;
text-decoration-thickness:0.5px;
text-underline-offset:2px;
}

.footer-bottom-right{
text-align:right;
line-height:1.8;
}

/* ================= TABLET ================= */

@media (max-width:1024px){

body{
padding-top:86px;
}

.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
align-items:flex-start;
border:1px solid #eee;
gap:14px;
z-index:1001;
}

.nav.active{
display:flex;
}

.menu-toggle{
display:flex;
}

.banner img{
height:260px;
}

.contact-section{
grid-template-columns:1fr;
gap:60px;
padding:70px 50px 90px;
background:#000;
color:#fff;
}

.contact-left{
padding-left:0;
}

.contact-title{
font-size:58px;
}

.contact-underline{
width:145px;
height:3px;
margin-bottom:30px;
}

.follow-title,
.contact-social{
display:none;
}

.form-title{
font-size:42px;
line-height:1.15;
margin-top:0;
}

.two-columns{
flex-direction:column;
gap:15px;
}

.two-columns input{
width:100%;
}

.footer{
padding:55px 50px;
}

.footer-row,
.footer-line:first-child{
display:none;
}

.footer-bottom{
margin-top:0;
flex-direction:column;
gap:20px;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
}

.footer-bottom-right{
text-align:left;
line-height:1.8;
}
}

/* ================= MOBILE ================= */

@media (max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
align-items:flex-start;
border:1px solid #eee;
gap:14px;
z-index:1001;
}

.nav.active{
display:flex;
}

.menu-toggle{
display:flex;
}

.banner img{
height:220px;
}

.contact-section{
grid-template-columns:1fr;
gap:50px;
padding:55px 24px 70px;
background:#000;
color:#fff;
}

.contact-left{
padding-left:0;
}

.contact-title{
font-size:46px;
}

.contact-underline{
width:120px;
height:3px;
margin-bottom:24px;
}

.location{
font-size:15px;
margin-bottom:0;
}

.follow-title,
.contact-social{
display:none;
}

.form-title{
font-size:34px;
line-height:1.15;
margin-bottom:28px;
}

.two-columns{
flex-direction:column;
gap:14px;
}

.two-columns input{
width:100%;
}

input,
textarea{
font-size:15px;
padding:14px 16px;
}

textarea{
min-height:140px;
}

button{
padding:12px 28px;
font-size:13px;
margin-left:auto;
}

.footer{
padding:50px 40px;
}

.footer-row,
.footer-line:first-child{
display:none;
}

.footer-bottom{
margin-top:0;
flex-direction:column;
gap:20px;
}

.footer-bottom-left a[href="contacto.html"]{
display:none;
}

.footer-bottom-right{
text-align:left;
line-height:1.8;
}
}
</style>
</head>
