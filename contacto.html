<style>

/* ================= AJUSTES DESKTOP ================= */

.location{
display:none;
}

.contact-section{
padding:90px 120px 110px;
gap:60px;
}

.contact-left{
padding-left:90px;
}

.contact-right{
padding-right:90px;
}

.contact-title{
font-size:74px; /* +2 puntos aprox */
font-weight:700;
}

.contact-title::after{
width:100%;
margin-top:8px;
height:3px;
}

.follow-title{
font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
font-weight:100;
font-size:23px;
margin-bottom:18px;
}

.contact-social{
display:flex;
flex-direction:column;
gap:18px;
}

.contact-social svg{
width:34px;
height:34px;
stroke:white;
fill:none;
stroke-width:1.2;
}

.form-title{
font-size:52px; /* 2 puntos menos */
}

/* Botón alineado a la derecha */
.submit-wrap{
display:flex;
justify-content:flex-end;
}

.submit-btn{
background:#2ea44f;
color:#fff;
border:none;
padding:12px 28px;
font-size:14px;
font-weight:600;
cursor:pointer;
text-transform:uppercase;
letter-spacing:1px;
}

/* Inputs blancos con texto negro */
.contact-form input,
.contact-form textarea{
background:#fff;
color:#000;
border:none;
padding:14px 16px;
font-size:15px;
width:100%;
}

.contact-form textarea{
min-height:170px;
resize:vertical;
}

/* ================= TABLET ================= */
@media (max-width:1024px){

/* Header hamburguesa */
.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
align-items:flex-start;
border:1px solid #eee;
gap:14px;
}

.nav.active{
display:flex;
}

.menu-toggle{
display:flex;
}

/* Ajustar layout */
.contact-section{
padding:70px 40px 90px;
gap:40px;
grid-template-columns:1fr 1fr;
}

.contact-left{
padding-left:0;
}

.contact-right{
padding-right:0;
}

.contact-title{
font-size:52px;
}

.form-title{
font-size:40px;
}

/* Ocultar ubicación y redes del cuerpo */
.location,
.follow-title,
.contact-social{
display:none;
}

/* Footer final (sin Contacto arriba, con redes visibles) */
.footer{
padding:50px 40px;
}

.footer-row{
display:flex;
flex-direction:column;
gap:30px;
}

.footer-left{
display:none;
}

.footer-right{
display:block;
text-align:left;
}

.footer-icons{
display:flex;
justify-content:flex-start;
gap:12px;
}

.footer-bottom{
display:flex;
flex-direction:column;
gap:20px;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
}

.footer-bottom-right{
text-align:left;
line-height:1.8;
}
}

/* ================= MOBILE ================= */
@media (max-width:768px){

body{
padding-top:82px;
}

.header{
padding:16px 22px;
}

.contact-section{
display:block;
padding:50px 24px 70px;
}

.contact-left{
padding-left:0;
margin-bottom:50px;
}

.contact-right{
padding-right:0;
}

.contact-title{
font-size:48px;
}

.form-title{
font-size:34px;
margin-bottom:30px;
}

/* Header hamburguesa */
.nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#fff;
padding:20px;
flex-direction:column;
align-items:flex-start;
border:1px solid #eee;
gap:14px;
}

.nav.active{
display:flex;
}

.menu-toggle{
display:flex;
}

/* Ocultar ubicación y redes del cuerpo */
.location,
.follow-title,
.contact-social{
display:none;
}

/* Footer final (sin Contacto arriba, con redes visibles) */
.footer{
padding:50px 40px;
}

.footer-row{
display:flex;
flex-direction:column;
gap:30px;
}

.footer-left{
display:none;
}

.footer-right{
display:block;
text-align:left;
}

.footer-icons{
display:flex;
justify-content:flex-start;
gap:12px;
}

.footer-bottom{
display:flex;
flex-direction:column;
gap:20px;
margin-top:30px;
}

.footer-bottom-left a{
display:block;
margin-bottom:8px;
}

.footer-bottom-right{
text-align:left;
line-height:1.8;
}
}

</style>
